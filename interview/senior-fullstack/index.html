<header><h1>资深全栈工程师 · 岗位定制题库</h1><p class="sub">服务端架构、Web、跨端、Agent、稳定性与端到端交付。基础薄弱时先刷 <a href="../fundamentals/">全栈基础题库</a>，再口述本页问题。</p><div class="tools"><input id="search" type="search" placeholder="搜索：事务、幂等、React、RAG、Kubernetes"><button class="active" data-level="0">全部</button><button data-level="3">★★★ 必考</button><button data-level="2">★★ 常考</button><button data-level="1">★ 加分</button><button id="random">随机抽题</button><button id="expand">展开</button><button id="collapse">收起</button><span class="progress" id="progress"></span></div></header>

<script>
const sections=[
{id:'sprint',title:'三天面试冲刺路线',note:'先建立可表达的全栈能力地图',items:[
[3,'第 1 天：如何补齐服务端与数据基础，并产出可讲项目？',`<p><b>上午：</b>逐题口述 HTTP、REST、认证、SQL 索引、事务、Redis、MQ；每题限制 2 分钟，答不上来立刻展开题库补齐。</p><p><b>下午：</b>完成一个最小服务：<code>POST /orders</code>，包含参数校验、JWT 鉴权、PostgreSQL 事务、幂等键、Redis 缓存和结构化日志。为正常创建、重复提交、库存不足写测试。</p><p><b>晚上：</b>把服务设计画成一页图，准备“请求如何从前端到数据库，再到异步事件”的 3 分钟口述。目标不是堆功能，而是能解释边界、失败路径和验证方法。</p>`],
[3,'第 2 天：如何补齐 Web、部署与稳定性基础？',`<p><b>上午：</b>用 React 做订单列表/创建表单：加载、空态、字段错误、重复提交和接口错误都要有状态。复习组件状态、列表 key、请求取消、前后端错误契约。</p><p><b>下午：</b>Docker 化前后端，用 Docker Compose 启动应用、PostgreSQL 和 Redis；配置 health endpoint、环境变量和一条 GitHub Actions 流水线。</p><p><b>晚上：</b>压测一个端点，记录吞吐、p95/p99、错误率；人为注入慢 SQL 或下游超时，练习用日志、指标、Trace 说明定位与止损过程。</p>`],
[3,'第 3 天：如何把 Agent 经验、系统设计与项目表达收束成面试答案？',`<p><b>上午：</b>复习 Agent/RAG 的安全边界、工具权限、评估、成本和降级；为你的 Agent 工作流准备一个真实案例，重点讲质量门禁而非“自动生成代码”。</p><p><b>下午：</b>按本题库随机抽 20 题，每题 2 分钟；再做两道系统设计：订单创建、知识库问答。每题都按需求澄清 → 架构 → 数据/一致性 → 容量/故障 → 监控/演进作答。</p><p><b>晚上：</b>演练自我介绍、eBay Compose/GraphQL 协作案例、独立产品交付案例和一次故障复盘。诚实标出尚在积累的服务端深度，用可运行项目和清晰学习计划补足，而不虚构生产经验。</p>`]
]},
{id:'foundation',title:'工程基础底座',note:'服务端与全栈高频追问',items:[
[3,'从输入 URL 到页面出现，浏览器和服务端经历了什么？',`<p>典型路径：DNS 解析 → 建立 TCP 连接（HTTPS 还要 TLS 握手）→ 发送 HTTP 请求 → CDN/负载均衡/网关 → 应用与数据库/缓存 → 返回 HTML/CSS/JS → 浏览器解析、布局、绘制和合成。</p><p>排查慢页面时分段测量：DNS、连接、TTFB、资源下载、JS 执行和渲染。优化不应只盯后端接口，也要考虑 CDN、缓存、资源体积和渲染阻塞。</p>`],
[3,'HTTP 常见方法、幂等性和状态码如何理解？',`<table><tr><th>方法</th><th>常见语义</th><th>是否天然幂等</th></tr><tr><td>GET</td><td>读取资源</td><td>是</td></tr><tr><td>POST</td><td>创建资源或执行命令</td><td>通常否，需业务幂等键</td></tr><tr><td>PUT</td><td>按 URI 整体替换</td><td>是</td></tr><tr><td>PATCH</td><td>局部更新</td><td>取决于补丁语义</td></tr><tr><td>DELETE</td><td>删除资源</td><td>通常是</td></tr></table><p>常见状态码：<code>400</code> 参数错误、<code>401</code> 未认证、<code>403</code> 无权限、<code>404</code> 不存在、<code>409</code> 冲突、<code>429</code> 限流、<code>5xx</code> 服务端/依赖失败。</p>`],
[3,'数据库索引为什么能加速查询？哪些情况下会失效？',`<p>B+ 树索引通过有序结构减少磁盘页访问；联合索引通常遵循最左前缀。索引不是越多越好，会增加写入、空间和维护成本。</p><ul><li>对索引列使用函数、隐式类型转换、前导通配符 <code>LIKE '%x'</code>，常导致无法有效使用索引。</li><li>选择性很低的列（如布尔值）单独建索引收益有限。</li><li>使用 <code>EXPLAIN</code> 看执行计划、扫描行数和是否回表；不要仅凭直觉加索引。</li></ul>`],
[3,'进程、线程、协程分别是什么？Java/Kotlin 服务端如何选择并发模型？',`<p><b>进程</b>拥有独立地址空间，隔离强但切换/通信成本更高；<b>线程</b>共享进程内存，适合阻塞 I/O 与并行计算，但要同步共享状态；<b>协程</b>通常由运行时调度，适合大量 I/O 等待，但 CPU 密集仍需线程池。</p><p>Java 可用受控线程池或虚拟线程；Kotlin 用协程和结构化并发。无论模型如何，都必须有超时、并发上限、取消、连接池限制和背压。</p>`],
[2,'Linux 上接口异常时，先看什么？',`<p>先确认影响范围与最近变更，再看应用日志和系统资源：<code>top/htop</code> 看 CPU/内存，<code>free</code> 看内存，<code>df -h</code> 看磁盘，<code>ss -lntp</code> 看端口与连接，<code>lsof -p PID</code> 看 FD，<code>journalctl</code> 或容器日志看错误。</p><p>不要一上来重启。先保留证据，检查 OOM、磁盘写满、连接池耗尽、线程池排队和下游超时，再按影响做回滚、限流或扩容。</p>`],
[2,'Git merge、rebase、cherry-pick 的区别和协作原则？',`<p><code>merge</code> 保留分支合并历史；<code>rebase</code> 把提交重放到新基线，使本地线性但会改写 commit hash；<code>cherry-pick</code> 选择性应用某个提交。</p><p>原则：不随意 rebase 已被他人基于其开发的共享分支；小而聚焦的 PR；合并前跑测试；冲突时理解两边意图而不是机械选一边。生产热修复可用 cherry-pick，但要确认依赖与回归。</p>`],
[2,'Docker 镜像、容器、Volume 和网络分别是什么？',`<p>镜像是不可变分层模板，容器是其运行实例；容器文件系统是临时的，数据库等持久数据使用 Volume；容器通过网络互联，应用用服务名发现依赖而不是写死 IP。</p><pre><code># 多阶段构建：运行镜像不包含构建工具
FROM node:22 AS build
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN npm run build

FROM nginx:alpine
COPY --from=build /app/dist /usr/share/nginx/html</code></pre><p>镜像应使用固定基础镜像版本、最小权限、非 root 用户，并避免把密钥打进层。</p>`],
[3,'认证、授权、加密分别解决什么问题？',`<p><b>认证</b>确认“你是谁”，例如登录/OAuth；<b>授权</b>确认“你能做什么”，例如 RBAC/资源级权限；<b>加密</b>保护数据机密性，例如 TLS 和数据库加密。它们不能互相替代。</p><p>后端必须执行授权，前端隐藏按钮只改善体验。密码使用适当的单向哈希（如 bcrypt/Argon2）；令牌设置过期、轮换和撤销策略，敏感字段不写日志。</p>`],
[2,'单元测试、集成测试和端到端测试如何分层？',`<p>单元测试快、定位准，覆盖业务规则和边界；集成测试验证数据库、消息队列、HTTP 等真实边界；端到端测试覆盖关键用户流程但慢且脆弱，应控制数量。</p><p>高价值测试不是追求覆盖率数字，而是覆盖失败代价高的规则：权限、金额/库存、幂等、迁移、异常恢复和核心转化路径。</p>`],
[1,'算法题如何在面试中稳定作答？',`<p>先澄清输入、边界和复杂度要求；从暴力解法出发，再说明用哈希表、双指针、二分、堆、单调栈、BFS/DFS 或动态规划如何优化；边写边用样例走读，最后说明时间/空间复杂度。</p><p>全栈岗位常见基础题包括 LRU、Top K、合并区间、二叉树遍历、限流器和生产者消费者。不会时也要展示拆解能力，不要直接沉默或背模板。</p>`]
]},
{id:'delivery',title:'端到端交付与架构',note:'岗位职责 1 / 6 / 7',items:[
[3,'如何负责一个复杂业务功能从需求到上线？',`<p>先将需求拆成<b>业务目标、范围、非功能约束和可验收指标</b>，再设计 UI、API、数据模型、权限、异常和灰度方案。上线前完成测试、监控、回滚预案和数据校验；上线后观察核心指标、错误率和用户反馈。</p><p>对不确定性要明确假设与风险，例如外部系统 SLA、数据迁移量、兼容版本。不要只讲“开发完成”，要讲清楚如何让功能可观测、可灰度、可回滚。</p>`],
[3,'如何拆分一个服务端业务模块的边界？',`<p>按<b>业务能力和数据所有权</b>划分，而不是按表或技术层硬拆。模块应拥有自己的领域规则和写模型；跨模块通过稳定 API 或事件协作，避免其他服务直接写它的数据库。</p><ul><li>先做模块化单体，边界清晰但部署简单；只有独立伸缩、不同发布节奏或团队边界明显时再拆服务。</li><li>接口传递面向业务的 DTO/事件，不泄露内部表结构。</li><li>把同步调用链控制在可用性预算内，非关键后续动作优先异步化。</li></ul>`],
[3,'系统设计题中，如何在交付速度、成本和长期可维护性之间取舍？',`<p>先问清流量、SLA、数据一致性、团队规模和上线窗口。先选择满足当前约束的<b>最简单可演进方案</b>：例如单体加模块边界、托管数据库、Redis、异步任务，而非一开始引入多个微服务和复杂基础设施。</p><p>明确技术债的偿还条件：当 QPS、团队人数、故障频率或部署耦合超过阈值时，再拆分或替换组件。用指标而不是“未来可能会很大”驱动复杂度。</p>`],
[2,'如何设计配置、Feature Flag 与灰度发布？',`<p>配置有版本、校验、默认值和审计；Flag 与业务代码解耦，支持按用户、地区、客户端版本或百分比命中。灰度必须配套指标、快速关闭开关和回滚路径。</p><pre><code>if (featureFlags.isEnabled("new_checkout", userId)) {
    return newCheckout(request)
}
return legacyCheckout(request)</code></pre><p>不要把 Flag 当永久分支。功能稳定后删除旧路径和 Flag，避免配置债。</p>`],
[2,'如何处理与外部系统集成的不稳定性？',`<p>先定义超时、重试条件、幂等键、降级行为与对账机制。只对瞬时故障重试，并使用指数退避和抖动；写操作必须保证幂等，避免重试重复扣款或重复创建。</p><div class="tip">回答时要区分“调用成功”和“业务最终一致”：网络超时后对方可能已经成功，因此需要查询、回调或对账确认。</div>`]
]},
{id:'backend',title:'Java / Kotlin 服务端、数据与分布式',note:'Spring Boot / API / 缓存 / MQ',items:[
[3,'如何设计一个可靠的创建订单 API？',`<p>使用资源化 URL 与明确状态码；请求带 <code>Idempotency-Key</code>，服务端将 key、请求摘要与结果持久化。重复请求返回首次结果，而不是重复创建订单。</p><pre><code>POST /orders
Idempotency-Key: 9b6...

BEGIN;
INSERT INTO idempotency_keys(key, request_hash) ...;
INSERT INTO orders(...) VALUES (...);
COMMIT;</code></pre><p>关键点：幂等记录与订单写入在同一事务中；对 key 冲突读取已完成或处理中结果；日志包含 trace id，不记录敏感信息。</p>`],
[3,'数据库事务隔离级别和常见并发问题？',`<table><tr><th>问题</th><th>含义</th><th>常见处理</th></tr><tr><td>脏读</td><td>读到未提交数据</td><td>Read Committed 以上</td></tr><tr><td>不可重复读</td><td>同一行两次读取结果不同</td><td>更高隔离或显式锁</td></tr><tr><td>幻读</td><td>范围查询出现新行</td><td>可串行化或数据库 MVCC/谓词锁机制</td></tr><tr><td>丢失更新</td><td>并发写覆盖彼此</td><td>乐观锁版本号或条件更新</td></tr></table><p>隔离级别越高并非总是越好，会增加锁等待或重试成本。根据业务选择，例如库存扣减可用条件更新：<code>UPDATE stock SET n=n-1 WHERE id=? AND n&gt;0</code>。</p>`],
[3,'缓存穿透、击穿、雪崩分别是什么？',`<ul><li><b>穿透：</b>反复查询不存在的数据，缓存和数据库都被打到。使用参数校验、空值缓存、布隆过滤器。</li><li><b>击穿：</b>热点 key 同时过期，大量请求回源。使用互斥重建、逻辑过期或提前刷新。</li><li><b>雪崩：</b>大量 key 同时失效或缓存集群故障。TTL 加随机值、多级缓存、限流降级、缓存集群高可用。</li></ul><p>缓存不是数据库真相；写入后的失效/更新策略和一致性边界必须说清楚。</p>`],
[3,'什么时候使用消息队列？如何保证可靠消费？',`<p>适用于削峰、异步处理、服务解耦、广播事件。生产者需确认投递；消费者需幂等并在成功后提交 offset/ack；失败重试有上限，进入死信队列后告警和人工/自动补偿。</p><p>“至少一次”是常见语义，所以业务必须处理重复消息。端到端恰好一次通常是业务幂等、去重表和事务/Outbox 的组合，不是简单勾选 MQ 配置。</p>`],
[2,'什么是 Outbox，如何避免“写库成功但消息没发”？',`<p>在同一数据库事务内写入业务数据和 outbox 事件表；后台发布器可靠地读取未发事件、投递到 MQ，并记录投递状态。消费者用事件 ID 去重。</p><pre><code>BEGIN;
UPDATE orders SET status = 'PAID' WHERE id = :id;
INSERT INTO outbox(id, type, payload) VALUES (:eventId, 'OrderPaid', :json);
COMMIT;</code></pre>`],
[2,'Java 和 Kotlin 如何在服务端项目中协作？',`<p>Kotlin 与 Java 可以在同一 JVM 和 Spring Boot 项目中互操作。新业务可优先 Kotlin：空安全、data class、扩展函数和协程能提高表达力；存量 Java 模块逐步演进，避免为“统一语言”做大规模无收益重写。</p><p>边界上要注意 Kotlin 的可空类型与 Java platform type、默认参数的 Java 调用方式、集合可变性和协程与阻塞框架的线程模型。统一代码规范、异常处理、日志、测试和依赖管理比语言本身更重要。</p>`]
]},
{id:'web',title:'Web、跨端与用户体验',note:'React / Vue / Flutter / React Native',items:[
[3,'React 中如何避免不必要重渲染？',`<p>先通过 React DevTools Profiler 定位，再优化。保持 state 靠近实际使用处；传递稳定、最小化的 props；列表使用稳定 key；昂贵派生计算才用 <code>useMemo</code>，回调引用导致子组件重渲染时才用 <code>useCallback</code>。</p><p>不要把所有组件包进 <code>memo</code>。真正重要的是状态边界、数据结构和组件拆分。</p>`],
[3,'如何设计前后端 API 契约与错误处理？',`<p>契约包含请求/响应 schema、字段语义、枚举、分页、版本兼容和错误码。前端区分可恢复业务错误、认证错误、网络错误和未知错误；服务端返回稳定错误码，面向用户的信息可本地化，诊断信息放日志和 trace。</p><pre><code>{
  "code": "INVENTORY_INSUFFICIENT",
  "message": "库存不足",
  "traceId": "..."
}</code></pre>`],
[2,'复杂表单如何保证体验和数据正确性？',`<p>前端做即时格式与必填校验，后端做最终可信校验；提交期间禁用重复提交或携带幂等键。草稿、自动保存、离开确认、失败重试和字段级错误应由业务风险决定。</p><p>对于金额、日期、时区、手机号等字段，前后端必须共用明确格式与边界规则，不能依赖浏览器默认行为。</p>`],
[2,'如何选择 Web、Flutter 和 React Native？',`<p>Web 适合覆盖广、迭代快的业务和运营场景；Flutter 追求统一渲染与跨端一致性；React Native 适合团队已有 React 能力且需要复用 JS 生态。若涉及复杂原生能力、性能敏感交互或深度系统集成，原生端仍更可控。</p><p>选择看用户场景、平台能力、团队技能、交付周期和长期维护，不应只按技术潮流。</p>`],
[2,'如何处理客服反馈的线上问题？',`<p>先收集可定位信息：账号脱敏标识、时间、端版本、网络、trace id、操作路径和截图。按影响面与严重度分级，先止损再定位；需要数据修复时保证审计、幂等和回滚。</p><p>修复后补充监控、测试用例和知识库，避免同类问题再次依赖人工排查。</p>`]
]},
{id:'agent',title:'LLM、Agent 与 AI Coding',note:'加分项：LLM / Agent / RAG',items:[
[3,'如何把 LLM Agent 安全地接入业务工作流？',`<p>将模型输出视为<b>不可信输入</b>。Agent 只能通过受控工具调用业务能力；工具要有严格 schema、权限校验、审计、速率限制、超时和幂等。高风险动作如支付、删除、发布必须由用户确认或规则引擎批准。</p><p>不要让模型直接拼 SQL、执行 shell 或拥有无限制 token。提示词不是安全边界。</p>`],
[3,'RAG 的完整链路和常见质量问题？',`<ol><li>文档解析、去噪、分块并保留标题/权限/更新时间等元数据。</li><li>向量化并建立索引，查询时进行检索、过滤、重排。</li><li>将有限、可引用的上下文交给模型生成答案。</li><li>评估检索召回、答案正确性、引用完整性、延迟与成本。</li></ol><p>常见问题是分块不合理、索引过期、权限泄露、只看生成效果不看检索质量。需要离线评测集和线上反馈闭环。</p>`],
[3,'如何评估 Agent 是否真正提升研发效率？',`<p>先定义任务和基线，例如 PRD 到可运行原型时间、测试覆盖、缺陷逃逸率、人工返工率、PR review 时长。对相似任务分组对照，记录人类介入、工具调用失败、成本和安全事件。</p><p>不要只统计调用次数或生成行数；可维护性、正确性和审核成本才是交付指标。</p>`],
[2,'AI Coding 工具如何在团队中落地？',`<p>建立代码规范、架构约束、测试门槛和敏感信息规则；把仓库上下文、设计文档和受允许工具封装为 Skill/Agent。生成代码必须走现有 review、CI、安全扫描和人工验收。</p><div class="tip">面试可结合你的经验：产品、开发、测试、UI、发布角色拆分为 Agent，但真实质量门禁仍由测试和发布流程承担。</div>`],
[2,'如何控制 LLM 成本、延迟和可用性？',`<p>缓存可复用结果，按任务路由到合适模型，限制上下文长度与工具轮数，流式返回改善感知延迟。对模型超时、限流和供应商故障提供降级、重试和熔断；记录 token、延迟、成功率和质量指标。</p>`]
]},
{id:'reliability',title:'部署、稳定性与可观测性',note:'Docker / Kubernetes / CI/CD / 高并发',items:[
[3,'如何设计 CI/CD 流水线和安全发布？',`<p>典型链路：格式化/Lint → 单元测试 → 构建不可变制品 → 依赖与安全扫描 → 集成测试 → 部署测试环境 → 灰度生产 → 指标验证 → 完成或回滚。制品应可追溯到 commit、依赖版本和配置版本。</p><p>生产发布要有健康检查、容量预留、数据库迁移策略、回滚方案和变更审计；回滚应用不等于回滚数据，因此迁移采用向后兼容的 expand/contract 模式。</p>`],
[3,'Kubernetes 中如何让服务具备基本可用性？',`<ul><li>设置 request/limit，避免单实例资源失控；区分 startup、readiness、liveness probe。</li><li>用多副本、反亲和/拓扑分布、HPA 和 PodDisruptionBudget 抵抗节点和发布扰动。</li><li>配置通过 ConfigMap/Secret 注入，密钥不写入镜像或日志。</li><li>优雅终止：先从 ready endpoints 移除，停止接收新请求，处理在途请求后退出。</li></ul>`],
[3,'高并发系统如何做限流、熔断和降级？',`<p>在入口按用户、租户或 API 维度限流，常用令牌桶；服务调用设置超时、并发隔离和熔断；下游异常时返回缓存、默认结果或排队异步处理。每层的限额要协调，避免重试风暴。</p><pre><code>if (!rateLimiter.tryAcquire(userId)) {
  return Response.status(429).header("Retry-After", "1").build()
}</code></pre>`],
[3,'如何建立可观测性来定位线上故障？',`<p>三件套：日志、指标、Trace。日志结构化且包含 trace id；指标覆盖请求量、错误率、延迟分位数、饱和度和业务成功率；分布式 Trace 串起跨服务调用。</p><p>告警要基于用户影响和错误预算，例如成功率下降或 p99 持续恶化，而不是每条异常日志都报警。</p>`],
[2,'如何排查一次接口 p99 延迟飙升？',`<p>先按端点、区域、版本、租户和依赖拆分指标，确认是应用、数据库、缓存、网络还是下游。沿 Trace 找最长 span，结合 CPU、GC、线程池队列、连接池、慢 SQL 和缓存命中率验证假设。</p><p>先止损：回滚新版本、关闭高成本功能、限流或降级；再修根因，并把对应的指标/压测纳入发布门禁。</p>`]
]},
{id:'behavior',title:'项目表达与协作',note:'岗位匹配与行为面试',items:[
[3,'为什么你适合这个资深全栈岗位？',`<p>回答应围绕岗位证据，而非泛泛列技术栈：我有 8 年大型 App/SDK 研发经验，长期参与 API 与数据模型协作；独立完成 Android/iOS/Web/隐私政策/CI/上架闭环；使用 TypeScript/React 和 Spring Boot 负责端到端功能；并已建立多角色 LLM Agent 工作流。</p><p>同时诚实说明服务端深度仍在持续积累，并以作品、可运行项目和系统设计能力证明转型不是停留在学习阶段。</p>`],
[3,'讲一次跨团队接口或数据模型协作的案例。',`<p>用 STAR：先交代多模块/多市场的约束；说明你如何拉齐字段语义、兼容策略、错误码和发布顺序；再讲通过契约文档、联调环境、Feature Flag 和监控降低风险；最后用覆盖范围、上线结果或故障数据收尾。</p><div class="tip">可结合 eBay 能效标签：统一数据模型与渲染接口，复用到多个模块，并按地区和功能开关灰度。</div>`],
[2,'业务方提出紧急需求但技术方案风险高，怎么处理？',`<p>先澄清不可变目标与上线时间，给出分阶段选项：最小可用方案、完整方案和不做的风险。每个方案明确成本、质量、数据/合规风险和回滚能力，由业务共同决策。</p><p>避免只说“不行”或悄悄承担不可控风险。资深工程师的价值是把技术约束转化为可决策的信息。</p>`],
[2,'没有直接管理职责，如何推动问题解决？',`<p>通过事实、方案和执行降低协作摩擦：复现问题、量化影响、写清 owner/时间线/决策点，主动提供最小修复或 PoC。遇到分歧时回到用户影响、数据和可逆实验，而不是用职位压人。</p>`],
[1,'面试中可以反问什么？',`<ul><li>团队当前最重要的业务指标与技术挑战分别是什么？</li><li>该岗位在服务端、Web、跨端和 Agent 之间的实际投入比例如何？</li><li>发布、事故响应和技术债治理是怎样运作的？</li><li>入职前三个月，什么结果算是成功？</li></ul>`]
]}
];
const key='senior-fullstack-interview-mastered-v1';let mastered={};try{mastered=JSON.parse(localStorage.getItem(key))||{}}catch(e){}
const app=document.querySelector('#app'),toc=document.querySelector('#toc'),search=document.querySelector('#search'),progress=document.querySelector('#progress');let level=0,total=0;const tocLinks={};
sections.forEach((section,si)=>{const el=document.createElement('section');el.className='section';el.id=section.id;el.innerHTML=`<h2>${si+1}. ${section.title}<span class="note">${section.note}</span></h2>`;section.items.forEach((item,qi)=>{const id=`${section.id}-${qi}`;const d=document.createElement('details');d.dataset.id=id;d.dataset.level=item[0];d.dataset.text=(item[1]+' '+item[2]).toLowerCase();d.innerHTML=`<summary><span class="num">${si+1}.${qi+1}</span><span class="question">${item[1]}</span><span class="badge p${item[0]}">${'★'.repeat(item[0])}</span><button class="mark" type="button"></button></summary><div class="answer">${item[2]}</div>`;const mark=d.querySelector('.mark');const showMark=()=>{const on=!!mastered[id];mark.textContent=on?'已掌握':'标记掌握';mark.classList.toggle('on',on)};showMark();mark.onclick=e=>{e.preventDefault();e.stopPropagation();mastered[id]?delete mastered[id]:mastered[id]=true;localStorage.setItem(key,JSON.stringify(mastered));showMark();render()};el.append(d);total++});app.append(el);const link=document.createElement('a');link.href='#'+section.id;link.innerHTML=`${si+1}. ${section.title}<span></span>`;toc.append(link);tocLinks[section.id]=link});
function render(){const word=search.value.trim().toLowerCase();let visible=0;document.querySelectorAll('details').forEach(d=>{const ok=(!word||d.dataset.text.includes(word))&&(!level||Number(d.dataset.level)===level);d.hidden=!ok;if(ok)visible++});sections.forEach(s=>{const sec=document.querySelector('#'+s.id),n=[...sec.querySelectorAll('details')].filter(d=>!d.hidden).length;sec.hidden=!n;tocLinks[s.id].hidden=!n;tocLinks[s.id].querySelector('span').textContent=n});const done=Object.keys(mastered).filter(id=>document.querySelector(`[data-id="${id}"]`)).length;progress.textContent=`已掌握 ${done} / ${total} · 当前 ${visible} 题`}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=Number(b.dataset.level);render()});search.oninput=render;document.querySelector('#expand').onclick=()=>document.querySelectorAll('details:not([hidden])').forEach(x=>x.open=true);document.querySelector('#collapse').onclick=()=>document.querySelectorAll('details').forEach(x=>x.open=false);document.querySelector('#random').onclick=()=>{const pool=[...document.querySelectorAll('details:not([hidden])')];if(!pool.length)return;const d=pool[Math.floor(Math.random()*pool.length)];d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'})};render();
</script>
