<header><h1>全栈基础题库</h1><p class="sub">从网络、语言、数据库到部署的底座。先刷这里，再进入岗位定制题库。</p><div class="tools"><input id="search" type="search" placeholder="搜索：TCP、索引、JWT、React、Docker"><button class="active" data-level="0">全部</button><button data-level="3">★★★ 必考</button><button data-level="2">★★ 常考</button><button data-level="1">★ 加分</button><button id="random">随机抽题</button><button id="expand">展开</button><button id="collapse">收起</button><span id="progress" class="progress"></span></div></header>

<script>
const sections=[
{id:'network',title:'网络与 HTTP',note:'请求链路基础',items:[
[3,'从输入 URL 到页面展示经历了什么？',`<p>DNS 解析域名 → TCP 三次握手（HTTPS 还包含 TLS 握手）→ 发送 HTTP 请求 → CDN/负载均衡/网关 → 应用、缓存、数据库 → 浏览器接收 HTML/CSS/JS → 解析、布局、绘制、合成。</p><p>排查慢页面应按 DNS、连接、TTFB、资源下载、JS 执行和渲染分段测量，不能只盯接口耗时。</p>`],
[3,'TCP 三次握手和四次挥手分别解决什么？',`<p><b>先说结论：</b>建立连接时，双方要确认“我能发、你能收；你能发、我能收”，并同步各自的初始序列号，所以需要三段报文。关闭连接时，TCP 是全双工的：我不再发送，不代表你已经发完，所以通常需要四段报文。</p><section class="protocol"><h3>一、三次握手：连接从不存在到可双向传数据</h3><div class="tcp-seq"><div class="tcp-peers"><span>客户端 Client</span><span>服务端 Server</span></div><div class="tcp-row to-server"><span>① SYN_SENT</span><span class="msg">SYN, seq = x</span><span class="note">请求建立连接，并给出客户端初始序列号 x</span></div><div class="tcp-row to-client"><span class="note">确认服务端能收到；进入 ESTABLISHED</span><span class="msg">SYN + ACK, seq = y, ack = x + 1</span><span>② SYN_RCVD</span></div><div class="tcp-row to-server"><span>③ ESTABLISHED</span><span class="msg">ACK, ack = y + 1</span><span class="note">确认客户端也能收到服务端的报文</span></div></div><p><b>逐步理解：</b>第 1 次，客户端证明自己能发；第 2 次，服务端同时证明“我收到你了，而且我也能发”；第 3 次，客户端证明“我收到你了”。到此双方都知道双向链路可用，才能安全发送业务数据。</p><div class="tcp-state"><span>客户端：CLOSED -> SYN_SENT -> ESTABLISHED</span><span>服务端：LISTEN -> SYN_RCVD -> ESTABLISHED</span></div><p><b>为什么不能只两次？</b>若旧的 SYN 在网络中延迟到达，服务端可能误以为客户端要建新连接。第三次 ACK 让服务端等到客户端的明确确认，避免这种半开或误建连接。</p><h3>二、四次挥手：两边分别结束自己的发送方向</h3><div class="tcp-seq"><div class="tcp-peers"><span>主动关闭方 Client</span><span>被动关闭方 Server</span></div><div class="tcp-row to-server"><span>① FIN_WAIT_1</span><span class="msg">FIN, seq = u</span><span class="note">我没有数据要发了，但仍可接收</span></div><div class="tcp-row to-client"><span class="note">确认收到；应用仍可继续发送剩余数据</span><span class="msg">ACK, ack = u + 1</span><span>② CLOSE_WAIT</span></div><div class="tcp-row to-client"><span class="note">收到后进入 TIME_WAIT，等待最后确认的可靠送达</span><span class="msg">FIN, seq = v</span><span>③ LAST_ACK</span></div><div class="tcp-row to-server"><span>④ TIME_WAIT</span><span class="msg">ACK, ack = v + 1</span><span class="note">确认服务端也关闭发送方向</span></div></div><p><b>为什么经常是四次？</b>Server 收到 FIN 后，TCP 可以立刻回 ACK，但它的应用层可能还在发送剩余响应；等数据发完才发送自己的 FIN。因此 ACK 和 FIN 通常分开。若恰好没有待发送数据，它们可以合并，抓包时可能看到三段。</p><div class="tcp-state"><span>主动方：FIN_WAIT_1 -> FIN_WAIT_2 -> TIME_WAIT -> CLOSED</span><span>被动方：CLOSE_WAIT -> LAST_ACK -> CLOSED</span></div><p><b>TIME_WAIT 为什么必要？</b>第一，若最后一个 ACK 丢失，Server 会重发 FIN，Client 还能够再回 ACK；第二，等待约 2MSL 让旧连接的延迟报文自然过期，避免污染同一四元组的新连接。它通常是主动关闭方的正常状态，不是需要“消灭”的错误。</p></section><p><b>面试时可这样回答：</b>三次握手确认双方收发能力和初始序列号，第三次还能避免旧连接请求造成误建连接。四次挥手体现 TCP 全双工，两端分别关闭写方向；主动关闭方保留 TIME_WAIT，以保障最后 ACK 的可靠传递并隔离旧报文。</p>`],
[3,'HTTP/1.1、HTTP/2、HTTP/3 的区别？',`<table><tr><th>版本</th><th>核心变化</th><th>注意点</th></tr><tr><td>HTTP/1.1</td><td>长连接、队头阻塞</td><td>同连接请求响应仍受顺序影响</td></tr><tr><td>HTTP/2</td><td>二进制分帧、多路复用、HPACK</td><td>TCP 丢包仍可能影响所有流</td></tr><tr><td>HTTP/3</td><td>基于 QUIC/UDP，多流独立</td><td>降低 TCP 层队头阻塞与建连延迟</td></tr></table>`],
[3,'Cookie、Session 和 JWT 如何选择？',`<p>Session 把状态放服务端，浏览器 Cookie 带 session id；JWT 通常是服务端签名、客户端携带的自包含 token。JWT 便于无状态扩容，但撤销、权限实时更新和体积需要额外设计。</p><p>Web 场景中 Cookie 应使用 <code>HttpOnly</code>、<code>Secure</code>、合适的 <code>SameSite</code>；无论哪种，服务端必须验证身份与权限。</p>`],
[2,'HTTPS 如何保证安全？',`<p>TLS 通过证书验证服务端身份，利用非对称加密协商密钥，后续用高效对称加密保护传输内容，并通过完整性校验防篡改。HTTPS 不能防止业务权限错误、XSS 或服务端泄漏。</p>`]
]},
{id:'language',title:'Java / Kotlin 与并发',note:'JVM 服务端基础',items:[
[3,'进程、线程和协程有什么区别？',`<p>进程有独立地址空间，隔离强；线程共享进程内存，需要同步；协程由语言运行时调度，适合大量 I/O 等待。CPU 密集计算仍需要多核并行能力，例如线程池、进程池或原生计算。</p><p>无论使用何种模型，都要有超时、取消、并发上限和背压，避免任务无限堆积。</p>`],
[3,'Java 中 HashMap 为什么需要扩容？线程安全吗？',`<p>HashMap 用数组加桶组织键值对，负载因子过高会导致冲突增多，因此达到阈值后扩容并重新分布。它不是线程安全的，并发读写可能数据错误；需要并发场景用 <code>ConcurrentHashMap</code>，或用锁保护复合操作。</p>`],
[3,'Kotlin 协程的 suspend、Dispatcher 和 structured concurrency 如何理解？',`<p><code>suspend</code> 表示函数可以挂起而不阻塞线程；<code>Dispatcher</code> 决定协程运行的线程池；结构化并发让子协程受父 scope 管理，父任务取消时子任务也会取消，避免后台任务泄漏。</p><pre><code>suspend fun loadOrder(id: String): Order = coroutineScope {
  val order = async(Dispatchers.IO) { orderApi.get(id) }
  val profile = async(Dispatchers.IO) { userApi.get(order.await().userId) }
  Order(order.await(), profile.await())
}</code></pre><p>服务端要传递超时和取消信号，不能无边界地创建协程或把阻塞 I/O 放在默认计算调度器。</p>`],
[2,'Java 虚拟线程与传统线程池如何选择？',`<p>传统线程池限制并发线程数，适合 CPU 密集工作或需要显式隔离资源的场景。Java 虚拟线程适合大量阻塞 I/O 任务，降低“一个请求占一个平台线程”的成本，但数据库连接、下游服务和 CPU 仍是有限资源。</p><p>无论是否使用虚拟线程，都要设请求超时、连接池上限、限流和背压；虚拟线程不能让下游容量无限。</p>`],
[2,'什么是数据竞争？如何避免？',`<p>多个执行单元同时访问同一可变数据，至少一个写且没有正确同步，就是数据竞争。用不可变数据、消息传递、互斥锁、原子变量或单线程所有者模型避免；先保证正确性，再考虑无锁优化。</p>`],
[2,'异常、错误码和重试如何协作？',`<p>在进程内用异常或 Result 表达失败；跨 HTTP/API 用稳定错误码和状态码。仅对可恢复的瞬时失败重试，采用超时、指数退避和抖动；写操作要有幂等键，防止重试造成重复副作用。</p>`]
]},
{id:'database',title:'数据库与缓存',note:'SQL / 索引 / Redis',items:[
[3,'索引为什么能加速查询？联合索引如何使用？',`<p>B+ 树索引利用有序结构减少数据页访问。联合索引通常遵循最左前缀，例如 <code>(tenant_id, created_at)</code> 能服务先按 tenant_id 再按 created_at 的查询。</p><p>用 <code>EXPLAIN</code> 验证执行计划；函数包裹索引列、隐式转换、前导通配符和低选择性条件都可能让索引收益下降。</p>`],
[3,'事务 ACID 分别是什么？',`<p><b>原子性</b>：事务全成或全败；<b>一致性</b>：提交前后满足约束；<b>隔离性</b>：并发事务按规定互不干扰；<b>持久性</b>：提交后数据可恢复。隔离级别和数据库实现决定脏读、不可重复读、幻读等问题的处理。</p>`],
[3,'什么是乐观锁和悲观锁？',`<p>悲观锁假设冲突高，先锁住数据再操作，例如 <code>SELECT ... FOR UPDATE</code>；乐观锁假设冲突低，更新时带版本条件，失败则重读或提示冲突。</p><pre><code>UPDATE inventory
SET quantity = quantity - 1, version = version + 1
WHERE id = :id AND quantity &gt; 0 AND version = :version;</code></pre>`],
[3,'缓存穿透、击穿、雪崩分别是什么？',`<ul><li><b>穿透</b>：不存在的数据反复回源，使用校验、空值缓存、布隆过滤器。</li><li><b>击穿</b>：热点 key 过期后同时回源，使用互斥重建、逻辑过期或预热。</li><li><b>雪崩</b>：大量 key 同时失效或缓存整体故障，TTL 加随机值、限流降级与高可用。</li></ul>`],
[2,'Redis 常见数据结构与使用场景？',`<table><tr><th>结构</th><th>常见场景</th></tr><tr><td>String</td><td>缓存、计数器、分布式锁 token</td></tr><tr><td>Hash</td><td>对象字段</td></tr><tr><td>List/Stream</td><td>队列、消息流</td></tr><tr><td>Set</td><td>去重、共同关注</td></tr><tr><td>ZSet</td><td>排行榜、延迟队列索引</td></tr></table><p>Redis 是内存系统，必须设内存策略、过期策略和持久化/高可用方案，不能无限当数据库使用。</p>`],
[2,'什么是 N+1 查询，如何解决？',`<p>先查 N 条主记录，再针对每条查关联数据，形成 1+N 次查询。用 join、批量 <code>IN</code> 查询、预加载或 DataLoader 批量合并解决；同时注意 join 后的行膨胀和分页语义。</p>`]
]},
{id:'backend',title:'后端 API 与分布式',note:'接口、消息、可靠性',items:[
[3,'如何设计一个 REST API？',`<p>资源使用名词 URI，方法表达操作；定义请求/响应 schema、分页、过滤、排序、状态码、错误码和版本兼容。写操作必须定义幂等、权限、审计和失败恢复。</p><pre><code>POST /orders
GET /orders/{id}
PATCH /orders/{id}
DELETE /orders/{id}</code></pre>`],
[3,'如何保证创建类接口的幂等性？',`<p>客户端提交唯一 <code>Idempotency-Key</code>；服务端在同一事务内保存 key、请求摘要和业务结果。重复 key 返回首次结果或处理中状态，不重新执行副作用。</p><p>仅靠前端禁用按钮不够，网络重试和多端请求仍会重复到达服务端。</p>`],
[3,'消息队列为什么会重复消费？如何处理？',`<p>消费者处理完成前崩溃、ack 超时或网络失败都可能让消息重新投递。常见语义是至少一次，因此消费者要通过业务唯一键、去重表或状态机实现幂等；失败重试有上限并进入死信队列。</p>`],
[3,'限流、熔断和降级有什么区别？',`<p><b>限流</b>控制进入系统的请求量；<b>熔断</b>在下游连续失败时临时停止调用；<b>降级</b>在资源不足或依赖失败时返回缓存、默认值或非核心功能。三者配合防止故障扩散。</p>`],
[2,'如何做日志、指标和 Trace？',`<p>结构化日志带 trace id；指标至少有请求量、错误率、p50/p95/p99、CPU/内存/连接池等饱和度；Trace 串联跨服务调用。告警应基于用户影响和错误预算，而不是每条异常都报警。</p>`],
[2,'如何处理数据库写入与发消息的一致性？',`<p>使用 Outbox：业务数据和待发事件在一个本地事务内写入；后台发布器可靠投递事件；消费者按 event id 幂等。避免“写库成功但消息没发”或“消息先发而事务回滚”。</p>`]
]},
{id:'frontend',title:'前端与 React 基础',note:'状态、渲染、工程化',items:[
[3,'React 的 state 更新和重渲染如何理解？',`<p>state 更新会调度组件重新渲染；渲染是计算新的 UI 描述，React 再比较差异并提交必要的 DOM 更新。state 应靠近实际使用处，避免把全局状态作为默认选择。</p>`],
[3,'列表为什么需要稳定 key？',`<p>key 是列表元素的身份，不是数组下标的装饰。插入、删除、排序后，稳定业务 ID 能让 React 将状态关联到正确元素；使用 index 在可变列表中可能导致输入框、展开状态错位。</p>`],
[3,'useEffect 常见误区？',`<p><code>useEffect</code> 用于与 React 外部系统同步，例如请求、订阅、DOM API。依赖数组必须覆盖 effect 使用的响应式值；effect 返回清理函数取消请求、订阅或定时器。</p><pre><code>useEffect(() =&gt; {
  const controller = new AbortController()
  loadUser(id, controller.signal)
  return () =&gt; controller.abort()
}, [id])</code></pre>`],
[2,'前端如何处理接口加载、错误与重复提交？',`<p>显式建模 loading、success、empty、error 状态；错误区分网络、认证、业务校验与未知错误。提交时禁用或合并重复动作，关键写操作仍由后端幂等保护。</p>`],
[2,'XSS、CSRF 和 SQL 注入如何防御？',`<ul><li><b>XSS</b>：默认转义输出，避免危险 HTML，设置 CSP。</li><li><b>CSRF</b>：Cookie 场景用 SameSite、CSRF token、校验 Origin/Referer。</li><li><b>SQL 注入</b>：参数化查询/ORM 绑定参数，绝不拼接不可信输入。</li></ul>`],
[2,'构建工具如何减少前端包体？',`<p>代码分割和动态 import、Tree Shaking、按需加载、压缩图片/字体、设置长缓存与内容 hash。先用 bundle analyzer 识别大依赖，不要靠猜测删除代码。</p>`]
]},
{id:'ops',title:'Linux、Docker 与 CI/CD',note:'部署排障基础',items:[
[3,'Linux 上接口变慢，排查顺序是什么？',`<p>确认影响范围和最近变更；看应用日志、CPU/内存/磁盘/网络、连接数和 FD；再沿 Trace 查慢 SQL、缓存命中、线程池/连接池排队和下游超时。先保留证据，再回滚、限流、扩容或降级。</p><pre><code>top            # CPU / 内存
free -h        # 内存
 df -h         # 磁盘
ss -lntp       # 端口与连接
lsof -p PID    # 文件描述符</code></pre>`],
[3,'Docker 镜像、容器、Volume、网络分别是什么？',`<p>镜像是不可变构建产物；容器是镜像运行实例；Volume 存持久数据；容器网络让服务通过名称访问。镜像使用多阶段构建、固定版本和非 root 用户；密钥通过运行时 Secret 注入。</p>`],
[3,'CI/CD 基本流水线有哪些环节？',`<p>格式化/Lint → 单元测试 → 构建不可变制品 → 依赖/安全扫描 → 集成测试 → 部署测试环境 → 灰度生产 → 指标验证 → 完成或回滚。制品、配置、数据库迁移都需要可追溯。</p>`],
[2,'readiness、liveness、startup probe 有什么区别？',`<p>startup probe 允许慢启动应用完成初始化；readiness 决定实例是否接收流量；liveness 失败时平台重启实例。不要把依赖短暂故障直接作为 liveness，否则可能造成重启风暴。</p>`],
[2,'Git merge、rebase、cherry-pick 的区别？',`<p>merge 保留分支历史；rebase 重放提交并改写 hash，适合未共享本地分支；cherry-pick 选择性应用单个提交。协作上保持 PR 小且可测试，不重写他人依赖的共享历史。</p>`],
[2,'如何安全地做数据库迁移？',`<p>采用 expand/contract：先添加向后兼容字段/表，应用同时兼容新旧读写，完成数据回填和验证后再删除旧结构。应用回滚不等于数据回滚，破坏性 DDL 必须分阶段执行。</p>`]
]},
{id:'algorithm',title:'算法、测试与工程习惯',note:'笔试与现场编码',items:[
[3,'写算法题的稳定步骤是什么？',`<p>澄清输入和边界 → 给暴力解并说明复杂度 → 选择数据结构优化 → 边写边用样例走读 → 说明时间/空间复杂度 → 补充异常边界。重点展示推理过程，不是直接背模板。</p>`],
[3,'LRU 缓存如何实现？',`<p>哈希表 O(1) 定位节点，双向链表维护最近使用顺序。访问或更新移动到头部；超过容量删除尾部并从哈希表移除。Java 可用 <code>LinkedHashMap(accessOrder=true)</code>，手写则解释两种结构的职责。</p>`],
[2,'单元测试、集成测试、E2E 如何分层？',`<p>单元测试覆盖纯业务规则，快且定位准；集成测试验证数据库、HTTP、消息等边界；E2E 覆盖少量关键用户路径但更慢脆弱。高价值测试优先覆盖权限、金额/库存、幂等、异常恢复和核心转化。</p>`],
[2,'代码评审应关注什么？',`<p>先看需求是否正确、边界和失败路径；再看安全、数据一致性、并发、性能、可测试性、命名和可维护性。评论应具体说明风险和建议，不把个人偏好伪装成阻塞问题。</p>`],
[1,'如何持续积累全栈能力而不只背题？',`<p>每周完成一个闭环：一个 API + 一个界面 + 一个数据库表 + 测试 + Docker + 部署/监控。把遇到的真实失败写成复盘和回归测试。题库用于检验表达，项目才是可信证据。</p>`]
]}
];

const learning={

'database-1':['ACID 描述事务的承诺，不是“用了事务就不会有所有并发问题”。','开始事务→读/写→约束校验→提交日志落盘；失败则回滚。','把一致性理解成数据库自动满足所有业务规则；跨服务一致性仍需状态机、补偿或 Outbox。','我会明确事务边界和隔离级别，把跨服务动作设计为最终一致。'],

'database-3':['三种缓存问题分别是不存在、热点失效和大范围失效，不要混为一谈。','请求→缓存命中直接返回；未命中→受控回源→回填带 TTL；故障时限流/降级。','用分布式锁包住所有缓存 miss，导致锁竞争；或缓存永不过期导致脏数据。','我会针对 key 类型选择空值缓存、逻辑过期、随机 TTL 和降级策略。'],
'database-4':['Redis 是高性能内存数据结构服务器，数据结构要匹配访问模式。','先写清 key 设计、TTL、最大内存和淘汰策略；再考虑持久化与主从/哨兵/集群。','把 Redis 当无限可靠主库，或使用锁却没有 token 校验、过期和续期策略。','我会明确 Redis 是缓存、协调还是消息组件，并预先定义数据丢失和故障时的降级。'],
'database-5':['N+1 是访问关联数据时循环触发查询，网络往返和数据库解析被放大。','查订单列表 1 次→循环查每个用户 N 次；改为 join 或一次 IN 批量查用户。','无脑 join 所有表，导致重复行、内存膨胀和分页错误。','我会通过 SQL 日志/Trace 发现查询数异常，再按数据量选择 join、批量查询或 DataLoader。'],
'backend-0':['REST 的核心是稳定资源语义和契约，不是 URI 格式好看。','客户端→路由→认证授权→参数校验→业务服务→持久化→统一错误响应。','把动作塞进 GET，或让响应直接暴露数据库实体和内部异常。','我会先定义资源、状态流转、错误码、分页和兼容策略，再开始实现 Controller。'],
'backend-1':['幂等指同一个请求执行多次，业务效果与执行一次相同；它保护网络重试和重复提交。','收到 key→查/插入幂等记录→同事务创建资源→保存结果→重复请求返回原结果。','只依赖前端按钮防抖，或幂等记录不与业务写入同事务导致竞态。','创建、支付、扣库存等写接口必须有服务端幂等设计，并对处理中请求定义返回语义。'],
'backend-2':['MQ 的至少一次投递意味着重复正常存在，消费者必须以业务方式去重。','生产者投递→Broker 保存→消费者处理→成功 ACK；崩溃或 ACK 丢失→再次投递。','先提交 offset 再写库导致丢消息，或先写库失败后不断无界重试。','我让消费处理幂等，成功后确认；失败有限重试，进入死信队列并可追踪补偿。'],
'backend-3':['限流保护入口容量，熔断保护失败依赖，降级保护核心体验。','请求先经过限流→调用下游有超时/熔断→失败时走缓存或默认值→恢复后半开探测。','只给接口限流却不限制线程池、连接池和重试，仍会形成拥塞。','我按用户/租户/API 分层限流，并为非核心能力准备清晰的降级结果。'],
'backend-4':['日志回答发生了什么，指标回答是否正在变坏，Trace 回答慢在哪里。','一次请求注入 trace id→每层记录 span 和结构化字段→聚合出延迟/错误率→告警。','日志带密码、token、身份证等敏感数据，或只看平均延迟忽略 p99。','我会用 trace 关联跨服务调用，用 RED/USE 指标定位，并基于用户影响设置告警。'],
'backend-5':['Outbox 用本地事务保证业务变化和“待发事件”要么一起存在，要么都不存在。','事务写订单+outbox→发布器重试投递→消费者按 event id 幂等处理。','直接在事务提交前发 MQ，或以为分布式两阶段提交总是最佳答案。','对跨服务事件，我优先 Outbox 加幂等消费和可观测重试，接受可控的最终一致。'],
'frontend-0':['React 重新渲染是重新计算 UI 描述，不等于所有 DOM 都重新创建。','事件→setState→组件函数执行→协调差异→仅提交必要 DOM 修改。','把所有数据塞进全局 state，或不测量就给每个组件 useMemo/memo。','我先用 Profiler 找真正重渲染源，再调整状态边界、props 和组件拆分。'],
'frontend-1':['key 代表列表元素身份，稳定 key 让 React 在重排后保留正确的组件状态。','旧列表与新列表按 key 对齐→相同 key 复用实例→新增/删除才挂载/卸载。','可排序列表用 index 作 key，导致输入内容、展开状态或动画串到其他行。','动态列表使用业务 ID；只有静态、永不重排列表才可考虑 index。'],
'frontend-2':['Effect 负责与 React 外部世界同步，不用于纯计算或由事件直接完成的逻辑。','依赖变化→先清理旧订阅/请求→执行新 effect；组件卸载→执行清理函数。','遗漏依赖导致陈旧闭包，或把 async 函数直接作为 effect 返回值。','我会让依赖完整、使用 AbortController 取消旧请求，并把纯派生值放在 render 中计算。'],
'frontend-3':['UI 必须明确描述每种异步状态，用户才知道系统在做什么和下一步能做什么。','初始→加载→成功/空数据/可恢复错误/不可恢复错误；提交操作另有 pending 和结果状态。','只用一个 boolean loading，导致错误、空态和旧数据混在一起。','我会把状态建模为有限集合，并让服务端幂等作为最终重复提交防线。'],
'frontend-4':['XSS 是把恶意脚本注入页面，CSRF 是借用户 Cookie 伪造请求，SQL 注入是把输入解释成 SQL。','不可信输入→按上下文编码/参数绑定→浏览器与服务端分别验证→最小权限执行。','只在前端校验、把 CSP 当万能防护，或拼接 SQL/HTML。','我默认转义和参数化，Cookie 加 SameSite/CSRF 防护，服务端做鉴权和输入校验。'],
'frontend-5':['减包的目标是减少用户首次需要下载、解析和执行的代码，而不是追求源代码行数少。','构建分析→发现大依赖→代码分割/动态加载→压缩资源→内容 hash 长缓存→测量 LCP/INP。','未分析就盲目拆包，产生太多请求或把公共依赖重复打包。','我先看 bundle analyzer 和真实性能指标，再针对首屏和非首屏做按需加载。'],
'ops-0':['排障先缩小影响范围和保留证据，再按资源、应用、依赖逐层验证假设。','告警→确认版本/区域/租户影响→看 CPU/内存/磁盘/FD/连接→Trace→慢 SQL/下游。','一报警就重启，丢失现场且可能掩盖内存泄漏、连接池耗尽等根因。','我会先止损并保存日志/指标，随后形成根因、修复、监控和回归测试闭环。'],
'ops-1':['镜像是不可变模板，容器是运行实例，Volume 解决持久化，网络解决服务发现。','Dockerfile 构建镜像→运行容器→挂载 Volume→通过服务名访问依赖→运行时注入配置。','把数据库数据写在容器层，把密钥写入镜像，或使用 latest 导致不可复现。','我使用多阶段构建、固定版本、非 root、只读/最小权限，并让数据与密钥脱离镜像。'],
'ops-2':['CI 验证变更质量，CD 自动、可控地把已验证制品推广到环境。','提交→Lint/测试→构建并签名制品→扫描→部署测试→灰度→指标验证→完成/回滚。','每次环境重新构建，导致测试和生产运行的不是同一个制品。','我让 commit、制品、配置和迁移版本可追溯，并在发布前定义健康指标与回滚条件。'],
'ops-3':['startup 解决启动慢，readiness 决定是否接流量，liveness 判断进程是否需要重启。','启动期间先过 startup→成功后 readiness 进入流量池→运行中 liveness 失败才重启。','把 DB 短暂不可用作为 liveness，所有实例会一起重启，反而扩大故障。','我让 readiness 反映能否服务请求，liveness 只检查进程不可恢复卡死。'],
'ops-4':['merge 合并历史，rebase 重写基线，cherry-pick 复制单个提交；重点是协作边界。','本地分支可 rebase 到最新 main→解决冲突→测试→PR；共享分支优先 merge，避免改写他人历史。','对已推送且被同事使用的分支强推 rebase，制造难以恢复的协作问题。','我用小 PR 和可测试提交降低冲突；热修复 cherry-pick 后会确认依赖和回归。'],
'ops-5':['expand/contract 将破坏性 schema 变化拆成多个可回滚阶段。','先加新列/表→双读写或回填→验证数据→切换读取→最后删除旧结构。','同一次发布直接改列类型或删除字段，应用回滚后立即无法读取数据。','我把数据库迁移视为独立发布单元，先保证向后兼容，再清理旧结构。'],
'algorithm-0':['算法面试更看拆解与验证，不只看最终代码是否一次写对。','澄清→暴力基线→识别重复工作→选择数据结构→走读边界→复杂度。','未确认空输入、重复值、溢出和规模就开写，或只给代码不解释复杂度。','我会先讲思路和不变量，再编码并拿样例逐步验证。'],
'algorithm-1':['LRU 同时需要按 key 快速定位和按访问顺序快速淘汰，因此组合哈希表与双向链表。','get：map 找节点→移到头；put：更新/新建到头→超容量删尾→map 删除。','只用数组保存顺序，移动元素会 O(n)；或删除链表节点后忘记清理 map。','我会先说明为什么单一结构不能同时 O(1)，再给出 map+双向链表的不变量。'],
'algorithm-2':['测试金字塔强调大量快速单元测试、适量集成测试、少量关键 E2E。','业务规则先用单测→数据库/MQ/HTTP 边界用集成测→支付/登录等关键路径用 E2E。','用 E2E 覆盖一切导致流水线慢且脆弱，或只追覆盖率数字不测关键失败路径。','我按风险选测试层级：金额、权限、幂等和迁移优先覆盖异常与回归。'],
'algorithm-3':['有效 review 是提前发现正确性、风险和维护成本，而不是挑格式。','先读需求/上下文→检查主路径→检查边界与失败→检查安全/并发/性能→给可执行建议。','只评论命名格式而忽略越权、竞态、数据迁移和不可回滚变更。','我会区分必须修复、建议和问题，并说明业务或技术风险，让作者能行动。'],
'algorithm-4':['全栈能力来自重复完成可运行闭环，而不是收藏概念。','需求→接口/数据→UI→测试→容器化→部署→监控→复盘，每周完成一个小切片。','同时学很多框架却没有可展示项目；或为简历夸大没有做过的生产经历。','我用小而完整的项目沉淀证据，明确已掌握、实践中和待学习的边界。']
};
function learningCard(id, sectionId){const guide=learning[id];if(!guide)return '';return `<section class="learn"><h3>图解与逐步理解</h3>${topicVisuals[id]?topicDiagram(topicVisuals[id]):visuals[sectionId]}<div class="learn-grid"><div><b>核心概念</b>${guide[0]}</div><div><b>怎么理解</b>${guide[1]}</div><div><b>常见误区</b>${guide[2]}</div><div><b>面试表达</b>${guide[3]}</div></div></section>`}
const storage='fullstack-fundamentals-mastered-v1';let mastered={};try{mastered=JSON.parse(localStorage.getItem(storage))||{}}catch(e){}const app=document.querySelector('#app'),toc=document.querySelector('#toc'),search=document.querySelector('#search'),progress=document.querySelector('#progress');let level=0,total=0;const links={};
sections.forEach((section,si)=>{const sec=document.createElement('section');sec.className='section';sec.id=section.id;sec.innerHTML=`<h2>${si+1}. ${section.title}<span class="note">${section.note}</span></h2>`;section.items.forEach((item,qi)=>{const id=`${section.id}-${qi}`,d=document.createElement('details');d.dataset.id=id;d.dataset.level=item[0];d.dataset.text=(item[1]+' '+item[2]+' '+(learning[id]||[]).join(' ')).toLowerCase();d.innerHTML=`<summary><span class="num">${si+1}.${qi+1}</span><span class="q">${item[1]}</span><span class="badge p${item[0]}">${'★'.repeat(item[0])}</span><button type="button" class="mark"></button></summary><div class="ans">${item[2]}${learningCard(id,section.id)}</div>`;const mark=d.querySelector('.mark');const update=()=>{const on=!!mastered[id];mark.textContent=on?'已掌握':'标记掌握';mark.classList.toggle('on',on)};update();mark.onclick=e=>{e.preventDefault();e.stopPropagation();mastered[id]?delete mastered[id]:mastered[id]=true;localStorage.setItem(storage,JSON.stringify(mastered));update();render()};sec.append(d);total++});app.append(sec);const link=document.createElement('a');link.href='#'+section.id;link.innerHTML=`${si+1}. ${section.title}<span></span>`;toc.append(link);links[section.id]=link});
function render(){const word=search.value.trim().toLowerCase();let visible=0;document.querySelectorAll('details').forEach(d=>{const ok=(!word||d.dataset.text.includes(word))&&(!level||Number(d.dataset.level)===level);d.hidden=!ok;if(ok)visible++});sections.forEach(s=>{const sec=document.querySelector('#'+s.id),count=[...sec.querySelectorAll('details')].filter(d=>!d.hidden).length;sec.hidden=!count;links[s.id].hidden=!count;links[s.id].querySelector('span').textContent=count});const done=Object.keys(mastered).filter(id=>document.querySelector(`[data-id="${id}"]`)).length;progress.textContent=`已掌握 ${done} / ${total} · 当前 ${visible} 题`}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-level]').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=Number(b.dataset.level);render()});search.oninput=render;document.querySelector('#expand').onclick=()=>document.querySelectorAll('details:not([hidden])').forEach(d=>d.open=true);document.querySelector('#collapse').onclick=()=>document.querySelectorAll('details').forEach(d=>d.open=false);document.querySelector('#random').onclick=()=>{const pool=[...document.querySelectorAll('details:not([hidden])')];if(!pool.length)return;const d=pool[Math.floor(Math.random()*pool.length)];d.open=true;d.scrollIntoView({behavior:'smooth',block:'center'})};render();
</script>
