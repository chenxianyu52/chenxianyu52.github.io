    { p: 3, q: 'Activity 的生命周期？A 启动 B 时生命周期的调用顺序？', a: `
<ul>
  <li>完整生命周期：<code>onCreate → onStart → onResume → onPause → onStop → onDestroy</code>；从停止状态返回时经过 <code>onRestart</code>。</li>
  <li><b>A 启动 B：</b>A.onPause → B.onCreate → B.onStart → B.onResume → A.onStop。因此 <code>onPause</code> 中不能做耗时操作，否则会拖慢新页面显示。</li>
  <li><b>B 是透明或对话框主题：</b>A 只执行 <code>onPause</code>，不执行 <code>onStop</code>。</li>
  <li><b>从 B 返回 A：</b>B.onPause → A.onRestart → A.onStart → A.onResume → B.onStop → B.onDestroy。</li>
  <li><b>配置变化</b>（旋转、语言、深色模式）默认销毁并重建 Activity。业务数据放在 ViewModel；少量 UI 状态使用 <code>onSaveInstanceState</code> 或 <code>SavedStateHandle</code>，以应对进程被系统回收。</li>
  <li><code>onSaveInstanceState</code>：Android 9（API 28）起在 <code>onStop</code> 之后调用，之前在 <code>onStop</code> 之前。</li>
</ul>` },
    { p: 3, q: 'Activity 的四种启动模式和常用 Intent Flag？', a: `
<table>
  <tr><th>模式</th><th>行为</th><th>场景</th></tr>
  <tr><td>standard</td><td>每次启动都创建新实例</td><td>默认</td></tr>
  <tr><td>singleTop</td><td>目标位于栈顶时复用，回调 <code>onNewIntent</code>；不在栈顶仍创建新实例</td><td>通知点击进入的详情页、搜索页</td></tr>
  <tr><td>singleTask</td><td>任务栈中只存在一个实例；复用时清除其上方的所有 Activity，回调 <code>onNewIntent</code></td><td>主页</td></tr>
  <tr><td>singleInstance</td><td>独占一个任务栈</td><td>来电、系统级独立页面</td></tr>
</table>
<ul>
  <li>Android 12 新增 <code>singleInstancePerTask</code>。</li>
  <li><code>taskAffinity</code> 决定 Activity 归属的任务栈，配合 <code>singleTask</code> 或 <code>FLAG_ACTIVITY_NEW_TASK</code> 使用。</li>
  <li>常用 Flag：<code>FLAG_ACTIVITY_NEW_TASK</code>（非 Activity 的 Context 启动 Activity 时必须使用）、<code>FLAG_ACTIVITY_CLEAR_TOP</code>、<code>FLAG_ACTIVITY_SINGLE_TOP</code>。</li>
</ul>` },
    { p: 2, q: 'Fragment 的生命周期和常见问题？', a: `
<ul>
  <li>生命周期：<code>onAttach → onCreate → onCreateView → onViewCreated → onStart → onResume → onPause → onStop → onDestroyView → onDestroy → onDetach</code>。</li>
  <li><b>Fragment 与其 View 的生命周期不同：</b>放入返回栈时只销毁 View，Fragment 实例仍存在。
    <ul>
      <li>观察数据时使用 <code>viewLifecycleOwner</code>，避免重复订阅和泄漏。</li>
      <li>ViewBinding 需要在 <code>onDestroyView</code> 中置空。</li>
    </ul>
  </li>
  <li><code>add</code> 保留之前的 Fragment；<code>replace</code> 会移除容器中已有的 Fragment。</li>
  <li><code>commit</code> 异步执行；<code>commitNow</code> 同步执行；在 <code>onSaveInstanceState</code> 之后提交会抛异常，<code>commitAllowingStateLoss</code> 可以提交，但可能丢失状态。</li>
  <li>通信：共享 ViewModel（<code>activityViewModels()</code>）或 Fragment Result API，避免直接持有对方引用。</li>
</ul>` },
    { p: 2, q: 'Service 有哪些类型？startService 和 bindService 的区别？', a: `
<ul>
  <li><b>启动型：</b><code>startService</code> 启动，生命周期为 <code>onCreate → onStartCommand → onDestroy</code>，与调用方无关，需要 <code>stopSelf</code> 或 <code>stopService</code> 停止。</li>
  <li><b>绑定型：</b><code>bindService</code> 绑定，生命周期为 <code>onCreate → onBind → onUnbind → onDestroy</code>，通过 Binder 与调用方交互，所有客户端解绑后销毁。</li>
  <li><b>前台服务：</b>必须显示通知；Android 8 起后台应用需使用 <code>startForegroundService</code>，并在规定时间内调用 <code>startForeground</code>；Android 14 起必须声明 <code>foregroundServiceType</code>。</li>
  <li>Service 默认运行在主线程，耗时操作需要自行切换线程。<code>IntentService</code> 已废弃，延迟执行且需要保证完成的任务推荐使用 WorkManager。</li>
</ul>` },
    { p: 2, q: 'BroadcastReceiver 的注册方式和版本限制？', a: `
<ul>
  <li><b>静态注册：</b>在 Manifest 中声明。Android 8 起，大多数隐式广播不能再通过静态注册接收。</li>
  <li><b>动态注册：</b>在代码中注册，需要在对应生命周期中注销。Android 14 起动态注册时必须指定 <code>RECEIVER_EXPORTED</code> 或 <code>RECEIVER_NOT_EXPORTED</code>。</li>
  <li><b>有序广播</b>按优先级依次传递，可以中止；普通广播并行分发。</li>
  <li><code>onReceive</code> 运行在主线程，不能做耗时操作；需要异步处理时使用 <code>goAsync()</code> 或交给 WorkManager。</li>
  <li><code>LocalBroadcastManager</code> 已废弃，应用内通信改用 Flow、LiveData 或事件总线。</li>
</ul>` },
    { p: 2, q: 'ContentProvider 的作用和原理？', a: `
<ul>
  <li>为跨进程、跨应用的数据共享提供统一接口，通过 URI 定位数据，提供增删改查和 <code>call()</code> 方法。</li>
  <li>底层通过 Binder 通信；可以使用读写权限，或 <code>signature</code> 级别权限，只允许相同签名的应用访问。</li>
  <li><code>ContentProvider.onCreate</code> 在 <code>Application.onCreate</code> 之前执行。很多库借此自动初始化，但会拖慢启动，可以使用 Jetpack App Startup 合并初始化。</li>
  <li>通过 <code>ContentObserver</code> 监听数据变化。</li>
</ul>
<div class="tip">可以结合 OPC：AgentBridge 通过 <code>ContentProvider.call()</code> 暴露跨应用能力，并通过 signature 权限保护。</div>` },
    { p: 3, q: 'View 的绘制流程？MeasureSpec 是什么？', a: `
<ul>
  <li>入口为 <code>ViewRootImpl.performTraversals()</code>，依次执行 <b>measure → layout → draw</b>。</li>
  <li><b>measure：</b>确定尺寸。父 View 根据自身 MeasureSpec 和子 View 的 LayoutParams 生成子 View 的 MeasureSpec。</li>
  <li><b>MeasureSpec</b> 是 32 位整数，高 2 位为模式，低 30 位为尺寸：
    <ul>
      <li><code>EXACTLY</code>：精确尺寸，对应 match_parent 或固定值。</li>
      <li><code>AT_MOST</code>：最大不超过某值，对应 wrap_content。</li>
      <li><code>UNSPECIFIED</code>：不限制，例如 ScrollView 内部测量子 View。</li>
    </ul>
  </li>
  <li><b>layout：</b>确定位置，调用 <code>onLayout</code> 摆放子 View。</li>
  <li><b>draw：</b>绘制背景 → <code>onDraw</code> 绘制自身 → <code>dispatchDraw</code> 绘制子 View → 绘制前景和滚动条。</li>
  <li><code>requestLayout</code> 触发重新测量和布局；<code>invalidate</code> 只触发重绘，必须在主线程调用；<code>postInvalidate</code> 可在子线程调用。</li>
</ul>` },
    { p: 3, q: 'Android 触摸事件分发机制？如何解决滑动冲突？', a: `
<p>传递顺序：Activity → PhoneWindow → DecorView → ViewGroup → View。三个核心方法：</p>
<pre><code>// ViewGroup 的分发逻辑（简化）
public boolean dispatchTouchEvent(MotionEvent ev) {
    boolean consumed;
    if (onInterceptTouchEvent(ev)) {
        consumed = onTouchEvent(ev);          // 自己拦截并处理
    } else {
        consumed = child.dispatchTouchEvent(ev); // 继续分发给子 View
    }
    return consumed;
}</code></pre>
<ul>
  <li><code>onInterceptTouchEvent</code> 只存在于 ViewGroup 中，View 没有拦截方法。</li>
  <li><b>DOWN 事件是关键：</b>某个 View 消费了 DOWN，后续 MOVE 和 UP 才会交给它；如果 DOWN 没有被消费，后续事件不会再传给它。</li>
  <li>父容器一旦拦截某个事件序列，该序列后续事件不会再询问是否拦截。</li>
  <li><code>OnTouchListener</code> 优先于 <code>onTouchEvent</code>；点击事件 <code>onClick</code> 在 <code>onTouchEvent</code> 的 UP 中触发。</li>
  <li><b>滑动冲突：</b>
    <ul>
      <li>外部拦截法：父容器在 <code>onInterceptTouchEvent</code> 中根据滑动方向决定是否拦截（推荐）。</li>
      <li>内部拦截法：子 View 调用 <code>parent.requestDisallowInterceptTouchEvent()</code> 控制父容器是否拦截。</li>
      <li>嵌套滚动使用 NestedScrolling 机制；Compose 中使用 <code>Modifier.nestedScroll</code>。</li>
    </ul>
  </li>
</ul>` },
    { p: 2, q: '自定义 View 的步骤和注意事项？', a: `
<ol>
  <li>选择继承：直接继承 View 或 ViewGroup，或扩展已有控件。</li>
  <li>通过 <code>declare-styleable</code> 定义自定义属性，在构造函数中读取，并回收 TypedArray。</li>
  <li>在 <code>onMeasure</code> 中处理 <code>wrap_content</code>，否则效果等同于 <code>match_parent</code>。</li>
  <li>ViewGroup 需要实现 <code>onLayout</code>。</li>
  <li>在 <code>onDraw</code> 中绘制，<b>不要在其中创建对象</b>，以免频繁 GC 导致卡顿。</li>
  <li>处理 padding、触摸事件、状态保存和无障碍。</li>
  <li>在 <code>onDetachedFromWindow</code> 中停止动画并释放资源。</li>
</ol>` },
    { p: 3, q: 'RecyclerView 的缓存机制和优化方法？', a: `
<p><b>四级缓存：</b></p>
<ol>
  <li><b>Scrap</b>（<code>mAttachedScrap / mChangedScrap</code>）：布局过程中临时分离的屏幕内 ViewHolder，无需重新绑定。</li>
  <li><b>CachedViews</b>：刚移出屏幕的 ViewHolder，默认 2 个，按位置匹配，复用时无需重新绑定。</li>
  <li><b>ViewCacheExtension</b>：开发者自定义缓存，很少使用。</li>
  <li><b>RecycledViewPool</b>：按 viewType 存储，默认每种类型 5 个，复用时需要重新执行 <code>onBindViewHolder</code>。</li>
</ol>
<p><b>优化：</b></p>
<ul>
  <li>使用 <code>ListAdapter</code> + <code>DiffUtil</code> 进行局部刷新，避免 <code>notifyDataSetChanged</code>。</li>
  <li>局部字段变化时使用 payload 更新。</li>
  <li>尺寸固定时调用 <code>setHasFixedSize(true)</code>。</li>
  <li>嵌套列表共享 RecycledViewPool；按需增大缓存数量。</li>
  <li><code>onBindViewHolder</code> 中不做耗时操作；图片按目标尺寸加载。</li>
</ul>
<div class="tip">面试时可以对比：eBay 项目中你用 Compose LazyColumn 统一列表架构替代 RecyclerView，并使用 key 和 derivedStateOf 优化重组。</div>` },
    { p: 2, q: 'Bitmap 占用多少内存？如何优化大图加载？', a: `
<ul>
  <li><b>内存大小 = 宽 × 高 × 每像素字节数。</b>ARGB_8888 为 4 字节，RGB_565 为 2 字节。一张 4000 × 3000 的 ARGB_8888 图片约占 45.8MB。</li>
  <li>从 drawable 目录加载时，会根据设备密度和资源目录密度缩放，实际尺寸可能变大。</li>
  <li>Android 8.0 起，Bitmap 像素数据存储在 Native 堆。</li>
  <li><b>优化：</b>
    <ul>
      <li>先设置 <code>inJustDecodeBounds</code> 读取尺寸，再通过 <code>inSampleSize</code> 采样到目标大小。</li>
      <li>不需要透明度时使用 RGB_565。</li>
      <li>通过 <code>inBitmap</code> 复用内存。</li>
      <li>超大图使用 <code>BitmapRegionDecoder</code> 分区域解码。</li>
      <li>使用 Glide、Coil 等图片库管理多级缓存。</li>
    </ul>
  </li>
</ul>
<div class="tip">可以结合 OPC 图像工具：超分模型按图块（tile）处理大图，就是为了控制内存峰值。</div>` },
    { p: 2, q: 'Parcelable 和 Serializable 的区别？Intent 传数据有什么限制？', a: `
<ul>
  <li><b>Serializable：</b>Java 接口，基于反射，会产生大量临时对象，速度慢，但使用简单，可以持久化。</li>
  <li><b>Parcelable：</b>Android 专用，手动或通过 <code>@Parcelize</code> 生成读写代码，速度快，适合进程间和组件间传递，不适合持久化。</li>
  <li><b>限制：</b>Intent 数据通过 Binder 传输，Binder 事务缓冲区约 1MB，并由进程内正在进行的事务共享，数据过大会抛出 <code>TransactionTooLargeException</code>。</li>
  <li>大数据应传递 ID、文件 URI 或使用共享存储，而不是直接传递对象或 Bitmap。</li>
</ul>` },
    { p: 2, q: 'Android 存储和权限的演进？', a: `
<ul>
  <li><b>Android 6：</b>运行时权限。</li>
  <li><b>Android 10 / 11：</b>分区存储。应用私有目录无需权限；共享媒体通过 MediaStore 访问；文档通过 SAF 访问。</li>
  <li><b>Android 13：</b>媒体权限细分为 <code>READ_MEDIA_IMAGES</code>、<code>READ_MEDIA_VIDEO</code>、<code>READ_MEDIA_AUDIO</code>；新增通知权限 <code>POST_NOTIFICATIONS</code>；系统照片选择器可以免权限选图。</li>
  <li><b>Android 14：</b>支持用户只授权部分照片（<code>READ_MEDIA_VISUAL_USER_SELECTED</code>）。</li>
  <li><b>最佳实践：</b>优先使用 Photo Picker，减少权限申请；遵循最小权限原则，并在合适时机说明用途。</li>
</ul>
<div class="tip">可以结合 OPC：图像类应用优先使用系统照片选择器，减少权限申请，这也有利于应用商店的隐私审核。</div>` },
    { p: 2, q: 'Android 12～16 的主要适配点？', a: `
<ul>
  <li><b>Android 12：</b>包含 intent-filter 的组件必须显式声明 <code>android:exported</code>；PendingIntent 必须指定 <code>FLAG_IMMUTABLE</code> 或 <code>FLAG_MUTABLE</code>；统一的 SplashScreen API；限制后台启动前台服务；精确闹钟需要权限。</li>
  <li><b>Android 13：</b>通知运行时权限、细分媒体权限、应用级语言设置、预测性返回手势的预备支持。</li>
  <li><b>Android 14：</b>前台服务必须声明类型；动态注册广播必须声明是否导出；部分照片访问。</li>
  <li><b>Android 15：</b>targetSdk 35 时<b>强制 Edge-to-Edge</b>，应用需要自行处理状态栏、导航栏和刘海区域的 insets；支持 16KB 页面大小，Native 库需要重新对齐。</li>
  <li><b>Android 16：</b>targetSdk 36 后不能再退出 Edge-to-Edge；预测性返回默认启用；大屏设备会忽略屏幕方向和不可调整大小的限制。</li>
</ul>
<div class="tip">你在 eBay 完成过 11+ 页面的 Android 15 Edge-to-Edge 适配，可以讲 <code>WindowInsets</code> 的处理方式、底部导航栏和键盘遮挡问题。</div>` },
    { p: 1, q: 'Android 进程优先级和 LMK？', a: `
<ul>
  <li>优先级从高到低：前台进程 → 可见进程 → 服务进程 → 缓存进程（后台）。</li>
  <li>内存不足时，Low Memory Killer 根据 <code>oom_adj</code> 分数优先杀死低优先级进程。</li>
  <li>不要追求“保活”。需要可靠执行的任务应使用 WorkManager 或前台服务，并处理进程被回收后的状态恢复。</li>
</ul>` },
  ]
},
{
  id: 'framework', title: 'Android Framework', note: '源码原理高频',
  items: [
    { p: 3, q: 'Handler 消息机制的原理？', a: `
<ul>
  <li><b>四个角色：</b>Handler 发送和处理消息；Message 是消息；MessageQueue 是按执行时间排序的单链表；Looper 循环取出消息。</li>
  <li><code>Looper.prepare()</code> 创建 Looper，并保存在 <b>ThreadLocal</b> 中，因此每个线程最多只有一个 Looper；主线程的 Looper 由 <code>ActivityThread.main()</code> 创建。</li>
  <li><b>流程：</b><code>sendMessage → enqueueMessage</code> 按时间插入队列 → <code>Looper.loop()</code> 调用 <code>queue.next()</code> 取出消息 → <code>msg.target.dispatchMessage()</code>。</li>
  <li><b>dispatchMessage 优先级：</b><code>msg.callback</code>（post 的 Runnable）→ Handler 构造时传入的 Callback → <code>handleMessage</code>。</li>
  <li>使用 <code>Message.obtain()</code> 从对象池复用 Message，减少对象创建。</li>
  <li><b>内存泄漏：</b>非静态内部类 Handler 持有 Activity，延迟消息又持有 Handler。解决：静态内部类 + WeakReference，并在销毁时调用 <code>removeCallbacksAndMessages(null)</code>；Kotlin 中更推荐使用协程和生命周期作用域。</li>
</ul>` },
    { p: 3, q: '主线程 Looper.loop() 是死循环，为什么不会卡死或导致 ANR？', a: `
<ul>
  <li>没有消息时，<code>MessageQueue.next()</code> 调用 <code>nativePollOnce</code>，基于 Linux <b>epoll</b> 进入阻塞，释放 CPU，不会空转。</li>
  <li>有新消息入队时，通过 <code>nativeWake</code> 写入 eventfd 唤醒线程。</li>
  <li>Activity 生命周期、输入事件、界面绘制本身都是主线程消息，正是依靠这个循环驱动的；循环结束意味着应用退出。</li>
  <li><b>ANR 的原因不是循环本身</b>，而是某条消息处理时间过长，导致输入事件或组件生命周期回调不能在规定时间内完成。</li>
</ul>` },
    { p: 2, q: '什么是同步屏障和 IdleHandler？', a: `
<ul>
  <li><b>同步屏障：</b>一个 target 为 null 的特殊消息。遇到屏障时，MessageQueue 会跳过普通同步消息，只处理<b>异步消息</b>，直到移除屏障。</li>
  <li>用途：<code>ViewRootImpl.scheduleTraversals()</code> 会先插入同步屏障，确保 VSYNC 到来后，绘制任务优先于其他普通消息执行。<code>postSyncBarrier</code> 是隐藏 API，不建议业务使用。</li>
  <li><b>IdleHandler：</b>消息队列空闲时回调，返回 false 后自动移除。适合延迟执行非关键初始化，例如启动后预加载。</li>
</ul>` },
    { p: 3, q: 'Binder 的原理？为什么 Android 选择 Binder 作为主要 IPC 方式？', a: `
<ul>
  <li><b>架构：</b>Client、Server、ServiceManager 和内核中的 Binder 驱动。ServiceManager 类似 DNS，负责服务注册与查询。</li>
  <li><b>一次拷贝：</b>接收方通过 <code>mmap</code> 将内核缓冲区映射到自己的用户空间；发送方将数据拷贝到内核缓冲区后，接收方可以直接读取。</li>
  <li><b>对比其他 IPC：</b>
    <table>
      <tr><th>方式</th><th>拷贝次数</th><th>特点</th></tr>
      <tr><td>Binder</td><td>1 次</td><td>C/S 架构，内核附带调用方 UID/PID，安全性高</td></tr>
      <tr><td>Socket / 管道</td><td>2 次</td><td>通用，但效率较低</td></tr>
      <tr><td>共享内存</td><td>0 次</td><td>最快，但需要自行处理同步，安全控制复杂</td></tr>
    </table>
  </li>
  <li>服务端可通过 <code>Binder.getCallingUid()</code> 获取调用方身份并做权限校验。</li>
  <li>每个进程有 Binder 线程池，默认最多 15 个工作线程 + 1 个主 Binder 线程；事务缓冲区约 1MB。</li>
  <li>Java 层通过 Proxy（客户端代理）和 Stub（服务端实现）封装调用。</li>
</ul>` },
    { p: 2, q: 'AIDL 如何使用？有哪些注意事项？', a: `
<ul>
  <li>定义 <code>.aidl</code> 接口，编译生成 <b>Stub</b>（服务端继承并实现）和 <b>Proxy</b>（客户端调用，负责序列化参数并调用 <code>transact</code>）。</li>
  <li>服务端在 Service 的 <code>onBind</code> 中返回 Stub 实例；客户端通过 <code>bindService</code> 获取 IBinder，再调用 <code>Stub.asInterface()</code>。</li>
  <li>参数方向：<code>in</code>、<code>out</code>、<code>inout</code>；自定义对象必须实现 Parcelable。</li>
  <li><code>oneway</code> 方法异步执行，不等待返回结果。</li>
  <li>服务端方法运行在 Binder 线程池中，需要考虑线程安全；客户端同步调用会阻塞当前线程，不要在主线程调用耗时远程方法。</li>
  <li>使用 <code>linkToDeath</code> 监听服务端进程死亡并重连；使用 <code>RemoteCallbackList</code> 管理跨进程回调。</li>
</ul>` },
    { p: 2, q: 'Android 系统的启动流程？', a: `
<ol>
  <li>Boot ROM 加载 Bootloader。</li>
  <li>启动 Linux 内核。</li>
  <li>启动用户空间第一个进程 <b>init</b>，解析 init.rc，启动 ServiceManager 等守护进程。</li>
  <li>init 启动 <b>Zygote</b>：创建虚拟机，预加载常用类和资源，开启 Socket 等待创建进程的请求。</li>
  <li>Zygote fork 出 <b>SystemServer</b>，启动 AMS、ATMS、PMS、WMS 等系统服务。</li>
  <li>系统服务就绪后，AMS 启动 <b>Launcher</b>，显示桌面。</li>
</ol>` },
    { p: 3, q: '点击桌面图标后，App 的冷启动流程是怎样的？', a: `
<ol>
  <li>Launcher 调用 <code>startActivity</code>，通过 Binder 请求 <b>ATMS</b>（Android 10 前为 AMS）。</li>
  <li>ATMS 解析 Intent、检查权限、处理任务栈；发现目标进程不存在。</li>
  <li>AMS 通过 <b>Socket</b> 请求 <b>Zygote fork</b> 新进程。</li>
  <li>新进程执行 <code>ActivityThread.main()</code>：创建主线程 Looper，并通过 <code>attachApplication</code> 向 AMS 注册。</li>
  <li>AMS 回调 <code>bindApplication</code>：创建 Application，依次执行 <code>attachBaseContext</code>、安装 ContentProvider、<code>Application.onCreate</code>。</li>
  <li>ATMS 通过 <code>ClientTransaction</code>（LaunchActivityItem、ResumeActivityItem）通知应用启动 Activity。</li>
  <li>主线程执行 <code>performLaunchActivity</code>：通过 Instrumentation 反射创建 Activity，调用 <code>attach</code>（创建 PhoneWindow）和 <code>onCreate</code>。</li>
  <li>执行 <code>onStart</code>、<code>onResume</code>，然后通过 WindowManager 添加 DecorView，创建 ViewRootImpl，完成首次测量、布局和绘制，首帧显示。</li>
</ol>
<div class="tip">启动优化的切入点：Application 与 ContentProvider 的初始化、首个 Activity 的 onCreate、首帧布局复杂度。</div>` },
    { p: 2, q: 'Zygote 为什么使用 Socket 而不是 Binder 通信？', a: `
<ul>
  <li><code>fork()</code> 只会复制调用它的线程。如果父进程是多线程的，其他线程持有的锁会在子进程中保持锁定状态，可能导致死锁。</li>
  <li>Binder 依赖多线程的 Binder 线程池，因此 Zygote 刻意保持单线程，使用 Socket 接收请求。</li>
  <li>fork 后子进程通过写时复制（COW）共享 Zygote 预加载的类和资源，这正是应用启动较快、内存共享的原因。</li>
</ul>` },
    { p: 2, q: 'Window、WindowManager、WMS、ViewRootImpl 的关系？', a: `
<ul>
  <li><b>Window：</b>抽象概念，唯一实现是 PhoneWindow；Activity 在 <code>attach</code> 时创建 PhoneWindow，<code>setContentView</code> 时创建 DecorView。</li>
  <li><b>WindowManager：</b>应用侧接口，实现链路为 WindowManagerImpl → WindowManagerGlobal。</li>
  <li><b>ViewRootImpl：</b>在 <code>addView</code> 时创建，连接 View 树和 WMS，负责测量布局绘制的调度、输入事件接收和线程检查。</li>
  <li><b>WMS：</b>系统服务，管理窗口层级、尺寸和焦点，并为窗口分配 Surface。</li>
  <li>内容绘制到 Surface 的缓冲区后，由 <b>SurfaceFlinger</b> 合成并显示到屏幕上。</li>
  <li>窗口类型：应用窗口、子窗口、系统窗口。Dialog 必须使用 Activity Context，因为需要 Activity 的窗口 token，否则会抛出 <code>BadTokenException</code>。</li>
</ul>` },
    { p: 3, q: '屏幕刷新机制：VSYNC 和 Choreographer 是如何工作的？', a: `
<ul>
  <li>60Hz 屏幕每 16.6ms 刷新一次，120Hz 为 8.3ms。VSYNC 信号用于同步 CPU、GPU 和屏幕。</li>
  <li><b>流程：</b>
    <ol>
      <li>调用 <code>invalidate</code> 或 <code>requestLayout</code> 后，<code>ViewRootImpl.scheduleTraversals()</code> 插入同步屏障，并向 Choreographer 注册回调。</li>
      <li>Choreographer 请求下一次 VSYNC 信号。</li>
      <li>VSYNC 到来后执行 <code>doFrame</code>，依次处理输入、动画、遍历绘制等回调。</li>
      <li><code>performTraversals</code> 完成测量、布局和绘制；硬件加速下 UI 线程记录 DisplayList，由 RenderThread 提交给 GPU。</li>
      <li>SurfaceFlinger 在之后的 VSYNC 合成图层并显示。</li>
    </ol>
  </li>
  <li>界面没有变化时，应用不会请求绘制。</li>
  <li><b>掉帧：</b>一帧的工作超过时间预算，就无法赶上当前刷新周期，用户会感到卡顿。</li>
</ul>` },
    { p: 2, q: '为什么子线程不能更新 UI？', a: `
<ul>
  <li>UI 工具包不是线程安全的。如果使用锁保护，会让 UI 操作变复杂并降低性能，因此采用单线程模型。</li>
  <li>检查发生在 <code>ViewRootImpl.checkThread()</code>，非创建 ViewRootImpl 的线程更新 UI 会抛异常。</li>
  <li>在 <code>onCreate</code> 中，ViewRootImpl 尚未创建，因此子线程更新 UI 有时不会立即报错，但这属于未定义行为。</li>
  <li>SurfaceView、TextureView 可以在独立线程中绘制。</li>
</ul>` },
    { p: 2, q: 'AMS、ATMS、PMS、WMS 分别负责什么？', a: `
<table>
  <tr><th>服务</th><th>职责</th></tr>
  <tr><td>AMS</td><td>进程管理、Service、Broadcast、ContentProvider 调度，进程优先级与 OOM 调整</td></tr>
  <tr><td>ATMS</td><td>Android 10 从 AMS 中拆分，负责 Activity 和任务栈管理</td></tr>
  <tr><td>PMS</td><td>APK 安装与卸载、解析 Manifest、组件查询、权限管理</td></tr>
  <tr><td>WMS</td><td>窗口的添加、层级、布局、动画、焦点和输入窗口</td></tr>
</table>
<p>它们运行在 SystemServer 进程中，应用通过 Binder 调用。</p>` },
    { p: 2, q: 'Context 的继承体系？不同 Context 应该如何使用？', a: `
<ul>
  <li>Context 是抽象类，真正的实现是 <b>ContextImpl</b>；ContextWrapper 通过 <code>mBase</code> 委托给 ContextImpl。</li>
  <li>Application、Service 继承 ContextWrapper；Activity 继承 ContextThemeWrapper，多了主题信息。</li>
  <li>一个进程中 Context 的数量 = Activity 数量 + Service 数量 + 1（Application）。</li>
  <li><b>使用原则：</b>
    <ul>
      <li>显示 Dialog、加载带主题的布局时使用 Activity Context。</li>
      <li>单例和长生命周期对象使用 <code>applicationContext</code>，避免泄漏 Activity。</li>
      <li>从非 Activity Context 启动 Activity 需要添加 <code>FLAG_ACTIVITY_NEW_TASK</code>。</li>
    </ul>
  </li>
</ul>` },
    { p: 2, q: 'Android 的类加载机制？热修复和 so 动态加载的原理？', a: `
<ul>
  <li><b>ClassLoader：</b>BootClassLoader 加载系统类；PathClassLoader 加载已安装的应用；DexClassLoader 可加载任意路径的 dex/apk。它们遵循双亲委派模型。</li>
  <li>BaseDexClassLoader 内部的 <code>DexPathList</code> 持有 <code>dexElements</code> 数组，查找类时按顺序遍历。</li>
  <li><b>类替换型热修复：</b>将补丁 dex 插到 <code>dexElements</code> 前面，使补丁类优先加载（代表方案：Tinker）。还有基于插桩的方案（Robust）和底层方法替换方案。</li>
  <li><b>so 动态加载：</b>
    <ul>
      <li>下载到应用私有目录，校验签名或哈希，匹配 CPU 架构。</li>
      <li>通过 <code>System.load(绝对路径)</code> 加载，或将目录注入 <code>nativeLibraryDirectories</code>，使 <code>System.loadLibrary</code> 可以找到。</li>
      <li>处理依赖顺序、版本兼容和加载失败的降级。</li>
    </ul>
  </li>
</ul>
<div class="tip">这是你在壹钱包“so 库动态下发，APK 减少 15M”的原理基础，面试官很可能深挖。</div>` },
    { p: 1, q: 'Dalvik 和 ART 的区别？什么是 Baseline Profile？', a: `
<ul>
  <li><b>Dalvik：</b>解释执行 + JIT。</li>
  <li><b>ART（Android 5.0）：</b>安装时 AOT 编译为机器码，运行快，但安装慢、占用空间大。</li>
  <li><b>Android 7.0 起混合模式：</b>首次运行时解释执行 + JIT，收集热点代码 profile，在设备空闲充电时进行 AOT 编译。</li>
  <li><b>Baseline Profile：</b>应用随包提供关键路径（启动、核心页面）的规则，安装时即进行 AOT 编译，改善启动和首次运行性能。Compose 应用尤其受益。</li>
  <li>ART 还改进了 GC，例如并发复制回收，降低卡顿。</li>
</ul>` },
    { p: 2, q: 'APK 的打包流程和签名机制？', a: `
<ol>
  <li><b>aapt2</b> 编译并链接资源，生成 <code>resources.arsc</code>、R 类和最终 Manifest。</li>
  <li>kotlinc / javac 将源码编译为 class 文件。</li>
  <li><b>R8</b> 进行脱糖、代码压缩、优化和混淆，生成 dex。</li>
  <li>打包 dex、资源、assets 和 so 库。</li>
  <li><b>zipalign</b> 对齐，提高运行时读取效率。</li>
  <li><b>apksigner</b> 签名。</li>
</ol>
<table>
  <tr><th>签名版本</th><th>特点</th></tr>
  <tr><td>v1（JAR）</td><td>逐文件校验，不保护 ZIP 元数据，校验慢</td></tr>
  <tr><td>v2（Android 7.0）</td><td>对整个 APK 签名，安全性更高、安装校验更快</td></tr>
  <tr><td>v3（Android 9）</td><td>支持签名密钥轮换</td></tr>
  <tr><td>v4（Android 11）</td><td>支持增量安装，签名存储在单独文件中</td></tr>
</table>
<p>AAB 由 Google Play 按 ABI、屏幕密度、语言生成拆分 APK；三星 Galaxy Store 等渠道通常直接上传 APK。</p>` },
    { p: 1, q: '触摸事件是如何从硬件传递到 View 的？', a: `
<ol>
  <li>触摸屏产生中断，内核将事件写入 <code>/dev/input</code>。</li>
  <li>SystemServer 中 InputManagerService 的 <b>InputReader</b> 读取并加工事件。</li>
  <li><b>InputDispatcher</b> 找到目标窗口，通过 <b>InputChannel</b>（socketpair）发送给应用进程。</li>
  <li>应用中 ViewRootImpl 的 <code>WindowInputEventReceiver</code> 接收事件，经过 InputStage 责任链处理。</li>
  <li>DecorView → Activity → PhoneWindow → DecorView → ViewGroup → View。</li>
  <li>应用处理完成后向 InputDispatcher 回复；超过 5 秒未完成则触发输入 ANR。</li>
</ol>` },
  ]
},
{
  id: 'jetpack', title: 'Jetpack / Compose / 架构', note: '结合 eBay 经历回答',
  items: [
    { p: 3, q: 'ViewModel 为什么能在配置变化时保留数据？', a: `
<ul>
  <li>ViewModel 存储在 Activity 的 <code>ViewModelStore</code> 中。</li>
  <li>配置变化导致 Activity 重建时，<code>onRetainNonConfigurationInstance()</code> 将 ViewModelStore 保存到 <code>NonConfigurationInstances</code>，由 ActivityThread 暂存在 ActivityClientRecord 中。</li>
  <li>新 Activity 通过 <code>getLastNonConfigurationInstance()</code> 取回同一个 ViewModelStore，因此获得相同的 ViewModel 实例。</li>
  <li>只有在 Activity 真正结束（<code>!isChangingConfigurations</code>）时才清空，调用 <code>onCleared()</code> 并取消 <code>viewModelScope</code>。</li>
  <li><b>ViewModel 不能应对进程被杀</b>，需要使用 <code>SavedStateHandle</code> 保存少量关键状态。</li>
  <li>ViewModel 中不能持有 Activity、View 或 Activity Context。</li>
</ul>` },
    { p: 3, q: 'LiveData、StateFlow、SharedFlow 有什么区别？', a: `
<table>
  <tr><th></th><th>LiveData</th><th>StateFlow</th><th>SharedFlow</th></tr>
  <tr><td>生命周期感知</td><td>内置</td><td>需要配合 repeatOnLifecycle</td><td>同 StateFlow</td></tr>
  <tr><td>初始值</td><td>可以没有</td><td>必须有</td><td>不需要</td></tr>
  <tr><td>粘性</td><td>新观察者会收到最新值</td><td>总是有当前值</td><td>由 replay 决定</td></tr>
  <tr><td>相同值</td><td>会重复分发</td><td>自动去重</td><td>不去重</td></tr>
  <tr><td>适用</td><td>View 体系旧项目</td><td>UI 状态</td><td>一次性事件、广播式事件</td></tr>
</table>
<ul>
  <li>Kotlin 和 Compose 项目推荐使用 StateFlow 表示 UiState。</li>
  <li>View 中使用 <code>repeatOnLifecycle(Lifecycle.State.STARTED)</code> 收集，Compose 中使用 <code>collectAsStateWithLifecycle()</code>。</li>
  <li>一次性事件（如导航、Toast）可以使用 Channel 或 SharedFlow，也可以将事件建模为状态，消费后清除。</li>
</ul>` },
    { p: 2, q: 'Lifecycle 的实现原理？', a: `
<ul>
  <li><code>LifecycleRegistry</code> 维护当前状态和观察者列表，状态为：INITIALIZED、CREATED、STARTED、RESUMED、DESTROYED。</li>
  <li>ComponentActivity 在 API 29 以下注入一个无界面的 <code>ReportFragment</code>，在 API 29 及以上通过 <code>ActivityLifecycleCallbacks</code> 感知生命周期，并分发事件。</li>
  <li>新添加的观察者会被逐步同步到当前状态，因此可以收到之前的事件。</li>
  <li>使用 <code>DefaultLifecycleObserver</code> 编写观察者；<code>ProcessLifecycleOwner</code> 可以监听整个应用进入前台或后台。</li>
</ul>` },
    { p: 3, q: 'MVC、MVP、MVVM、MVI 的区别？', a: `
<table>
  <tr><th>模式</th><th>核心</th><th>优点</th><th>缺点</th></tr>
  <tr><td>MVC</td><td>Activity 同时承担 View 和 Controller</td><td>简单</td><td>Activity 臃肿，难以测试</td></tr>
  <tr><td>MVP</td><td>Presenter 通过 View 接口更新界面</td><td>逻辑可以单元测试</td><td>接口数量多，需要处理生命周期，防止泄漏</td></tr>
  <tr><td>MVVM</td><td>ViewModel 暴露可观察状态，View 订阅</td><td>ViewModel 不持有 View，生命周期安全</td><td>多个可观察数据分散时，状态难以统一</td></tr>
  <tr><td>MVI</td><td>单一不可变 UiState + Intent/Action，单向数据流</td><td>状态可预测、易调试、易测试</td><td>样板代码较多，需要频繁复制状态</td></tr>
</table>
<div class="tip">你的经历正好覆盖演进路径：华为图库项目使用 MVP，eBay 偏好设置模块使用 MVVM，可以从实践角度说明各自的取舍。</div>` },
    { p: 2, q: '如何设计 Android 分层架构和模块化？', a: `
<ul>
  <li><b>分层：</b>UI 层（Compose / ViewModel）→ Domain 层（UseCase，可选）→ Data 层（Repository + DataSource）。</li>
  <li><b>依赖规则：</b>外层依赖内层，Domain 层不依赖 Android 框架；Repository 作为数据的单一可信来源。</li>
  <li><b>模块化：</b>
    <ul>
      <li>按功能拆分模块，公共能力下沉为 core 模块。</li>
      <li>将接口模块（api）与实现模块（impl）分离，模块之间只依赖 api，通过依赖注入组装实现。</li>
      <li>好处：编译更快、边界清晰、可以独立测试和复用。</li>
    </ul>
  </li>
  <li>注意避免模块之间循环依赖，资源命名添加前缀防止冲突。</li>
</ul>
<div class="tip">可以结合 OPC：采用 API / App / Impl + Dagger 的分层方式，并在共享库中复用广告、隐私、图片选择等能力。</div>` },
    { p: 2, q: 'Dagger / Hilt 和 Koin 的区别？', a: `
<table>
  <tr><th></th><th>Dagger / Hilt</th><th>Koin</th></tr>
  <tr><td>原理</td><td>编译期注解处理并生成代码</td><td>运行时 DSL，本质接近服务定位器</td></tr>
  <tr><td>错误发现</td><td>编译期</td><td>运行时（可以使用测试校验依赖图）</td></tr>
  <tr><td>运行性能</td><td>好，无反射</td><td>启动时需要构建依赖图，开销略高</td></tr>
  <tr><td>学习成本</td><td>较高</td><td>低</td></tr>
  <tr><td>多平台</td><td>主要用于 JVM / Android</td><td>支持 KMP</td></tr>
</table>
<ul>
  <li>Hilt 在 Dagger 基础上预定义了与 Android 生命周期绑定的组件：SingletonComponent、ActivityRetainedComponent、ViewModelComponent、ActivityComponent 等。</li>
  <li>ViewModel 使用 <code>@HiltViewModel</code> 和 <code>@Inject constructor</code> 注入。</li>
</ul>` },
    { p: 2, q: 'Room 的特点和使用注意事项？', a: `
<ul>
  <li>基于 SQLite 的 ORM，编译期校验 SQL 语句。</li>
  <li>由 Entity、DAO、Database 组成，使用 KSP 生成代码。</li>
  <li>查询可以返回 Flow；底层通过 <code>InvalidationTracker</code> 监听表变化，表数据变化时重新查询。</li>
  <li>多步操作使用 <code>@Transaction</code> 保证原子性。</li>
  <li><b>数据库升级：</b>编写 Migration 或使用 AutoMigration，开启 <code>exportSchema</code>，并使用 MigrationTestHelper 测试迁移。</li>
  <li>默认不允许在主线程查询；默认使用 WAL 模式，提高读写并发性。</li>
</ul>` },
    { p: 2, q: 'WorkManager 的原理和适用场景？', a: `
<ul>
  <li>适用于<b>可延迟、需要保证执行</b>的后台任务，例如日志上传、数据同步、图片备份。</li>
  <li>任务信息保存在内部数据库中，应用退出或设备重启后仍能继续执行；底层主要使用 JobScheduler。</li>
  <li>支持约束条件（网络、充电、存储空间）、一次性任务和周期任务（最短 15 分钟）、任务链、唯一任务、指数退避重试。</li>
  <li><code>CoroutineWorker</code> 支持协程；加急任务适合用户触发的短时间重要任务。</li>
  <li><b>选择：</b>与页面生命周期相关的任务使用协程；用户可感知且需要立即持续执行的任务使用前台服务；可延迟并需保证完成的任务使用 WorkManager。</li>
</ul>` },
    { p: 2, q: 'Compose Navigation 的类型安全路由？', a: `
<ul>
  <li>Navigation 2.8 起支持使用 <code>@Serializable</code> 类或对象作为路由，替代字符串路由，参数在编译期得到类型检查。</li>
</ul>
<pre><code>@Serializable data class Profile(val id: String)

NavHost(navController, startDestination = Home) {
    composable&lt;Home&gt; { HomeScreen(onOpen = { navController.navigate(Profile(it)) }) }
    composable&lt;Profile&gt; { entry -&gt;
        val route: Profile = entry.toRoute()
        ProfileScreen(route.id)
    }
}</code></pre>
<ul>
  <li>只传递 ID 等简单参数，复杂数据由目标页面从 Repository 获取。</li>
  <li>ViewModel 中可以通过 <code>savedStateHandle.toRoute&lt;Profile&gt;()</code> 获取参数。</li>
  <li>支持嵌套导航图和深层链接。Google 还推出了由开发者直接持有返回栈的 Navigation 3。</li>
</ul>
<div class="tip">你在 eBay 收藏品模块完成过 Fragment → Compose Type-Safe Navigation 迁移，可以说明逐步迁移时如何让 Fragment 与 Compose 页面共存。</div>` },
    { p: 3, q: 'Compose 的重组原理和性能优化？', a: `
<ul>
  <li><b>三个阶段：</b>组合（Composition）→ 布局（Layout）→ 绘制（Drawing）。状态在哪个阶段被读取，状态变化时就从哪个阶段重新执行。</li>
  <li>Compose 通过快照系统跟踪状态读取，状态变化时只重组读取该状态的作用域。</li>
  <li>参数稳定且没有变化时，可以跳过重组。Kotlin 2.0.20 起默认启用强跳过模式，进一步放宽了跳过条件。</li>
  <li><b>优化方法：</b>
    <ul>
      <li>使用 <code>remember</code> 缓存计算结果；使用 <code>derivedStateOf</code> 将高频变化的状态转换为低频结果，例如根据滚动位置决定是否显示按钮。</li>
      <li>LazyColumn 设置 <code>key</code> 和 <code>contentType</code>。</li>
      <li>延迟读取状态：使用 lambda 版本的修饰符，如 <code>Modifier.offset { }</code>、<code>graphicsLayer { }</code>，跳过组合阶段。</li>
      <li>使用不可变数据，必要时添加 <code>@Immutable</code> 或 <code>@Stable</code>。</li>
      <li>通过 Layout Inspector 查看重组次数，使用 Baseline Profile 改善首次组合性能。</li>
    </ul>
  </li>
</ul>
<div class="tip">结合 eBay：统一 Compose 列表架构中使用 key() 和 derivedStateOf 优化重组，性能与原 RecyclerView 方案对齐。</div>` },
    { p: 2, q: 'Compose 的副作用 API 有哪些？', a: `
<table>
  <tr><th>API</th><th>用途</th></tr>
  <tr><td>LaunchedEffect(key)</td><td>进入组合时启动协程，key 变化时取消并重新启动</td></tr>
  <tr><td>DisposableEffect(key)</td><td>注册监听，并在 <code>onDispose</code> 中清理</td></tr>
  <tr><td>SideEffect</td><td>每次成功重组后执行，用于同步非 Compose 对象</td></tr>
  <tr><td>rememberCoroutineScope</td><td>在点击等事件回调中启动协程</td></tr>
  <tr><td>rememberUpdatedState</td><td>在长期运行的副作用中读取最新值，而不重启副作用</td></tr>
  <tr><td>produceState</td><td>将非 Compose 数据源转换为 State</td></tr>
  <tr><td>snapshotFlow</td><td>将 Compose State 转换为 Flow</td></tr>
</table>
<p>状态提升原则：无状态组件接收 <code>state</code> 和 <code>onEvent</code>，状态由调用方或 ViewModel 持有，便于复用、预览和测试。</p>` },
    { p: 2, q: 'Compose 和 View 如何互操作？如何渐进式迁移？', a: `
<ul>
  <li><b>View 中使用 Compose：</b><code>ComposeView</code>。在 Fragment 中设置 <code>ViewCompositionStrategy.DisposeOnViewTreeLifecycleDestroyed</code>，使组合随 Fragment 的 View 生命周期释放。</li>
  <li><b>Compose 中使用 View：</b><code>AndroidView</code>，适合地图、WebView、广告、相机预览等组件。</li>
  <li><b>迁移策略：</b>
    <ul>
      <li>新功能直接使用 Compose。</li>
      <li>旧页面从叶子组件开始自下而上迁移，或者按页面逐个迁移。</li>
      <li>先统一主题、颜色和字体，确保新旧 UI 一致。</li>
      <li>每个阶段可以独立上线，并通过远程配置灰度，保留回退路径。</li>
      <li>迁移前后补充 UI 测试和截图测试，并对比性能。</li>
    </ul>
  </li>
</ul>
<div class="tip">这就是你在 My eBay 四个核心页面中采用的渐进式迁移思路，可以完整讲出来。</div>` },
    { p: 2, q: 'Flutter、React Native、KMP 怎么选？', a: `
<table>
  <tr><th></th><th>Flutter</th><th>React Native</th><th>KMP</th></tr>
  <tr><td>语言</td><td>Dart</td><td>JS / TS</td><td>Kotlin</td></tr>
  <tr><td>UI</td><td>自绘引擎（Impeller），多端高度一致</td><td>映射为原生组件，新架构使用 JSI / Fabric</td><td>共享业务逻辑，UI 可以原生实现，或使用 Compose Multiplatform</td></tr>
  <tr><td>优势</td><td>UI 一致性和性能好</td><td>Web 团队容易上手，可热更新</td><td>保留原生体验，渐进式接入成本低</td></tr>
  <tr><td>适用场景</td><td>新项目、重视 UI 一致性</td><td>已有 React 团队</td><td>已有原生项目，希望共享网络、数据和业务逻辑</td></tr>

{
  id: 'kotlin', title: 'Kotlin 与协程', note: '',
  items: [
    { p: 3, q: '协程的实现原理？suspend 函数是如何挂起和恢复的？', a: `
<ul>
  <li>编译器对 <code>suspend</code> 函数进行 <b>CPS 变换</b>：增加一个 <code>Continuation</code> 参数，返回值变为 <code>Any?</code>。</li>
  <li>函数体被编译为<b>状态机</b>，用 label 记录执行到哪个挂起点，局部变量保存在 Continuation 中。</li>
  <li>遇到真正挂起时返回 <code>COROUTINE_SUSPENDED</code>，释放当前线程；异步结果返回后调用 <code>resumeWith</code>，根据 label 从挂起点继续执行。</li>
  <li>协程不是线程，而是可挂起的计算；由 Dispatcher 决定在哪个线程上恢复执行。</li>
  <li>挂起不会阻塞线程，因此少量线程可以支撑大量协程。</li>
</ul>` },
    { p: 3, q: '协程的结构化并发、取消和异常处理？', a: `
<ul>
  <li><b>结构化并发：</b>协程必须在作用域中启动；父协程等待所有子协程完成；取消父协程会取消所有子协程，避免泄漏。</li>
  <li><b>调度器：</b><code>Dispatchers.Main</code>（UI）、<code>IO</code>（阻塞 IO）、<code>Default</code>（CPU 计算）。</li>
  <li><b>取消是协作式的：</b>挂起函数会检查取消状态；CPU 密集循环中需要调用 <code>ensureActive()</code> 或 <code>yield()</code>。被取消时会抛出 CancellationException，不应吞掉它。</li>
  <li><b>异常传播：</b>
    <ul>
      <li>普通 Job：一个子协程失败会取消父协程和其他兄弟协程。</li>
      <li><code>SupervisorJob</code> / <code>supervisorScope</code>：子协程失败互不影响。<code>viewModelScope</code> 使用的就是 SupervisorJob。</li>
      <li><code>launch</code> 中未捕获的异常交给 <code>CoroutineExceptionHandler</code>；<code>async</code> 的异常在调用 <code>await()</code> 时抛出。</li>
    </ul>
  </li>
</ul>` },
    { p: 2, q: 'launch、async、withContext、coroutineScope、supervisorScope 的区别？', a: `
<table>
  <tr><th>API</th><th>作用</th></tr>
  <tr><td>launch</td><td>启动协程，不返回结果，返回 Job</td></tr>
  <tr><td>async</td><td>启动协程并返回 Deferred，通过 <code>await()</code> 获取结果，适合并发请求</td></tr>
  <tr><td>withContext</td><td>切换上下文执行代码块并返回结果，不创建并发</td></tr>
  <tr><td>coroutineScope</td><td>创建子作用域，等待所有子协程完成，任一失败则全部取消</td></tr>
  <tr><td>supervisorScope</td><td>与 coroutineScope 类似，但子协程失败互不影响</td></tr>
</table>
<pre><code>suspend fun loadPage() = coroutineScope {
    val user = async { repo.user() }
    val feed = async { repo.feed() }
    Page(user.await(), feed.await())   // 两个请求并发执行
}</code></pre>` },
    { p: 2, q: 'Flow 的特点和常用操作符？', a: `
<ul>
  <li><b>冷流：</b>只有被 collect 时才执行，每个收集者都会重新执行一次上游。</li>
  <li><b>常用操作符：</b><code>map</code>、<code>filter</code>、<code>flatMapLatest</code>（搜索时取消旧请求）、<code>combine</code>、<code>zip</code>、<code>debounce</code>、<code>distinctUntilChanged</code>、<code>catch</code>、<code>retry</code>。</li>
  <li><code>flowOn</code> 只改变<b>上游</b>的执行上下文。</li>
  <li><b>背压：</b>默认通过挂起处理；还可以使用 <code>buffer</code>、<code>conflate</code>（只保留最新值）、<code>collectLatest</code>（新值到来时取消旧处理）。</li>
  <li><b>冷流转热流：</b><code>stateIn(scope, SharingStarted.WhileSubscribed(5000), initial)</code>。5 秒的超时可以在屏幕旋转期间保持上游不被取消。</li>
</ul>` },
    { p: 2, q: 'inline、noinline、crossinline、reified 的作用？', a: `
<ul>
  <li><b>inline：</b>编译时将函数体和 lambda 复制到调用处，避免创建 lambda 对象；允许 lambda 中使用 <code>return</code> 从外层函数返回（非局部返回）。</li>
  <li><b>noinline：</b>指定某个 lambda 参数不内联，以便将其存储或传递给其他函数。</li>
  <li><b>crossinline：</b>lambda 会在其他上下文中调用（如另一个 lambda 或线程）时使用，禁止非局部返回。</li>
  <li><b>reified：</b>只能用于 inline 函数，使泛型类型在运行时可用，例如 <code>T::class.java</code>，常用于 <code>inline fun &lt;reified T&gt; Gson.fromJson(json: String)</code>。</li>
  <li>过度使用 inline 会让字节码膨胀，适合体积较小的高阶函数。</li>
</ul>` },
    { p: 2, q: 'lazy 和 lateinit 的区别？', a: `
<table>
  <tr><th></th><th>by lazy</th><th>lateinit</th></tr>
  <tr><td>修饰</td><td>val</td><td>var</td></tr>
  <tr><td>初始化</td><td>首次访问时执行 lambda</td><td>手动赋值</td></tr>
  <tr><td>类型限制</td><td>无</td><td>非空、非基本类型</td></tr>
  <tr><td>线程安全</td><td>默认线程安全（SYNCHRONIZED）</td><td>不保证</td></tr>
  <tr><td>未初始化访问</td><td>不会发生</td><td>抛出 UninitializedPropertyAccessException</td></tr>
</table>
<p>可以通过 <code>::name.isInitialized</code> 检查 lateinit 属性是否已经初始化。</p>` },
    { p: 2, q: 'data class、sealed class、object、value class 的用途？', a: `
<ul>
  <li><b>data class：</b>根据主构造函数中的属性自动生成 <code>equals</code>、<code>hashCode</code>、<code>toString</code>、<code>copy</code>、<code>componentN</code>，适合数据模型和 UiState。</li>
  <li><b>sealed class / interface：</b>受限的继承结构，<code>when</code> 可以进行穷尽检查，适合 UI 状态、网络结果、事件。</li>
  <li><b>object：</b>线程安全的单例；<b>companion object</b> 用于类级别成员。</li>
  <li><b>value class</b>（<code>@JvmInline</code>）：为单个值提供类型安全包装，运行时尽量不额外创建对象，例如 <code>UserId</code>、<code>Price</code>。</li>
</ul>
<pre><code>sealed interface UiState {
    data object Loading : UiState
    data class Success(val items: List&lt;Item&gt;) : UiState
    data class Error(val message: String) : UiState
}</code></pre>` },
    { p: 2, q: 'let、run、with、apply、also 的区别？', a: `
<table>
  <tr><th>函数</th><th>对象引用</th><th>返回值</th><th>典型场景</th></tr>
  <tr><td>let</td><td>it</td><td>lambda 结果</td><td>空安全调用：<code>x?.let { }</code></td></tr>
  <tr><td>run</td><td>this</td><td>lambda 结果</td><td>对象配置后计算结果</td></tr>
  <tr><td>with</td><td>this</td><td>lambda 结果</td><td>对同一对象调用多个方法（非扩展函数）</td></tr>
  <tr><td>apply</td><td>this</td><td>对象本身</td><td>对象初始化和配置</td></tr>
  <tr><td>also</td><td>it</td><td>对象本身</td><td>附加操作，如日志</td></tr>
</table>` },
    { p: 2, q: 'Kotlin 的委托（by）有哪些用法？', a: `
<ul>
  <li><b>类委托：</b><code>class Logger(base: Repo) : Repo by base</code>，自动将接口方法转发给 base，用组合代替继承。</li>
  <li><b>属性委托：</b><code>by lazy</code>、<code>Delegates.observable</code>、<code>by map</code>。</li>
  <li>自定义委托：实现 <code>getValue</code> / <code>setValue</code> 运算符。</li>
  <li>Android 中的常见例子：<code>by viewModels()</code>、Compose 中的 <code>var x by remember { mutableStateOf(0) }</code>。</li>
</ul>` },
    { p: 1, q: '泛型的 in、out 是什么意思？', a: `
<ul>
  <li><b>out（协变）：</b>只作为生产者输出 T。例如 <code>List&lt;out T&gt;</code>，所以 <code>List&lt;String&gt;</code> 可以赋值给 <code>List&lt;Any&gt;</code>。</li>
  <li><b>in（逆变）：</b>只作为消费者接收 T。例如 <code>Comparator&lt;in T&gt;</code>。</li>
  <li><b>不变：</b><code>MutableList&lt;T&gt;</code> 既读又写，因此不能协变。</li>
  <li>对应 Java 的 <code>? extends T</code> 和 <code>? super T</code>（PECS 原则）。</li>
  <li>泛型在运行时会被擦除，需要类型信息时使用 reified。</li>
</ul>` },
    { p: 1, q: 'Kotlin 与 Java 互操作需要注意什么？', a: `
<ul>
  <li>Java 返回值在 Kotlin 中是<b>平台类型</b>（<code>String!</code>），可能为 null，应在边界处显式判断或为 Java 代码添加可空性注解。</li>
  <li><code>@JvmStatic</code>：伴生对象方法生成真正的静态方法。</li>
  <li><code>@JvmField</code>：直接暴露字段，不生成 getter/setter。</li>
  <li><code>@JvmOverloads</code>：为默认参数生成多个重载方法。</li>
  <li><code>@Throws</code>：声明受检异常，以便 Java 调用方捕获。</li>
  <li>Kotlin 类默认为 final；Spring 等需要代理的框架需要使用 all-open 插件。</li>
</ul>` },
    { p: 1, q: '扩展函数的原理是什么？', a: `
<ul>
  <li>扩展函数编译后是一个静态方法，第一个参数是接收者对象。</li>
  <li>扩展函数是<b>静态解析</b>的，由变量声明的类型决定，不支持多态。</li>
  <li>成员函数与扩展函数同名时，成员函数优先。</li>
  <li>扩展函数不能访问类的 private 成员。</li>
</ul>` },
  ]
},
{
  id: 'perf', title: 'Android 性能与稳定性', note: '高级岗位必问',
  items: [
    { p: 3, q: 'App 启动优化怎么做？', a: `
<ul>
  <li><b>启动类型：</b>冷启动（进程不存在）、温启动（进程存在，Activity 需要重建）、热启动（Activity 回到前台），重点优化冷启动。</li>
  <li><b>度量：</b>
    <ul>
      <li>TTID（首帧显示时间）和 TTFD（完全可用时间，调用 <code>reportFullyDrawn()</code>）。</li>
      <li>Logcat 中的 Displayed 日志、<code>adb shell am start -W</code>、Macrobenchmark、Perfetto。</li>
    </ul>
  </li>
  <li><b>优化方法：</b>
    <ul>
      <li>Application 初始化：按需懒加载、可以并行的放到后台线程、非关键任务延迟到首帧后或 IdleHandler 中执行。</li>
      <li>使用 App Startup 合并第三方库基于 ContentProvider 的初始化。</li>
      <li>避免主线程 IO，例如用 DataStore 替代同步读取 SharedPreferences。</li>
      <li>使用 Baseline Profile 预编译启动路径。</li>
      <li>简化首屏布局，先展示缓存数据，再异步刷新。</li>
      <li>使用 SplashScreen API，避免额外的闪屏 Activity。</li>
    </ul>
  </li>
</ul>` },
    { p: 3, q: '如何排查和优化卡顿？', a: `
<ul>
  <li><b>常见原因：</b>主线程 IO 或复杂计算、布局层级深、过度绘制、频繁 GC（如在 onDraw 中创建对象）、锁等待、Compose 不必要的重组。</li>
  <li><b>线下工具：</b>Perfetto / System Trace、Android Studio CPU Profiler、GPU 过度绘制调试、Layout Inspector、Macrobenchmark 的 FrameTimingMetric。</li>
  <li><b>线上监控：</b>
    <ul>
      <li>JankStats 或 FrameMetrics 统计掉帧率。</li>
      <li>通过 Looper 的 Printer 计算每条消息的执行时间，超过阈值时采集主线程堆栈（BlockCanary 的思路）。</li>
    </ul>
  </li>
  <li><b>优化：</b>耗时任务移出主线程、减少布局层级、移除不必要的背景、列表使用局部刷新、图片按尺寸加载、提高 Compose 参数稳定性。</li>
</ul>` },
    { p: 3, q: '内存优化：OOM 的类型和 LeakCanary 的原理？', a: `
<ul>
  <li><b>OOM 类型：</b>Java 堆内存不足、线程数过多（无法创建线程）、文件描述符耗尽、32 位进程虚拟地址空间不足。</li>
  <li><b>常见泄漏：</b>静态变量或单例持有 Activity、未注销的监听器、Handler 延迟消息、未取消的协程或线程、WebView。</li>
  <li><b>LeakCanary 原理：</b>
    <ol>
      <li>在 Activity、Fragment、ViewModel 等对象销毁时，用带 ReferenceQueue 的弱引用监视它们。</li>
      <li>等待约 5 秒并触发 GC，如果弱引用仍未进入 ReferenceQueue，说明对象被保留。</li>
      <li>保留对象达到阈值后生成堆转储（hprof）。</li>
      <li>使用 Shark 分析从 GC Roots 到泄漏对象的最短强引用路径。</li>
    </ol>
  </li>
  <li><b>优化：</b>图片按需采样、使用 LruCache、响应 <code>onTrimMemory</code> 释放缓存、避免无上限的集合缓存。</li>
</ul>` },
    { p: 3, q: 'ANR 的类型、阈值和排查方法？', a: `
<table>
  <tr><th>类型</th><th>阈值</th></tr>
  <tr><td>输入事件</td><td>5 秒未处理完成</td></tr>
  <tr><td>BroadcastReceiver</td><td>前台 10 秒，后台 60 秒</td></tr>
  <tr><td>Service</td><td>前台 20 秒，后台 200 秒</td></tr>
  <tr><td>ContentProvider 发布</td><td>10 秒</td></tr>
  <tr><td>前台服务未调用 startForeground</td><td>启动后约 10 秒</td></tr>
</table>
<ul>
  <li><b>排查：</b>查看 <code>/data/anr/</code> 中的 traces 文件，分析主线程堆栈；查看 CPU 负载和 IO 等待；Android 11 起可以通过 <code>ApplicationExitInfo</code> 获取历史退出原因。</li>
  <li><b>常见原因：</b>主线程 IO、网络、数据库操作；主线程等待被其他线程持有的锁；同步 Binder 调用耗时；系统资源紧张。</li>
  <li><b>预防：</b>StrictMode 检测主线程磁盘和网络访问；耗时操作使用协程切到后台线程。</li>
</ul>` },
    { p: 2, q: '包体积优化有哪些方法？', a: `
<ul>
  <li>使用 APK Analyzer 分析体积构成。</li>
  <li><b>代码：</b>开启 R8 代码压缩、优化和混淆；移除无用依赖，避免重复功能的库。</li>
  <li><b>资源：</b>开启 <code>shrinkResources</code>；图片使用 WebP 或矢量图；只保留需要的语言资源。</li>
  <li><b>so 库：</b>通过 <code>abiFilters</code> 只保留需要的 CPU 架构；低频使用的大型 so 库动态下发。</li>
  <li><b>分发：</b>AAB 按设备拆分；Dynamic Feature 按需下载功能模块；大型模型或资源通过 Play Asset Delivery 等方式分发。</li>
</ul>
<div class="tip">两个真实案例：壹钱包中 so 库动态下发减少 15M；OPC 中针对约 129MB 的上色模型规划了资源分发方案。</div>` },
    { p: 2, q: '如何监控 Java 崩溃和 Native 崩溃？', a: `
<ul>
  <li><b>Java 崩溃：</b>通过 <code>Thread.setDefaultUncaughtExceptionHandler</code> 捕获，记录堆栈和设备信息后交给默认处理器。</li>
  <li><b>Native 崩溃：</b>注册信号处理器捕获 SIGSEGV、SIGABRT 等信号，可使用 Breakpad、Crashpad、xCrash；系统会生成 tombstone 文件。</li>
  <li><b>符号化：</b>
    <ul>
      <li>Java：上传 R8 生成的 <code>mapping.txt</code> 还原混淆堆栈。</li>
      <li>Native：保留带符号的 so 文件，使用 <code>ndk-stack</code> 或 <code>addr2line</code> 还原。</li>
    </ul>
  </li>
  <li><b>平台与指标：</b>Firebase Crashlytics 或 Bugly；关注无崩溃用户比例和 ANR 率，并按版本对比。</li>
</ul>` },
    { p: 2, q: 'OkHttp 和 Retrofit 的原理？', a: `
<ul>
  <li><b>OkHttp 拦截器责任链：</b>
    <ol>
      <li>应用拦截器（自定义，如添加公共请求头、日志）</li>
      <li>RetryAndFollowUpInterceptor：重试和重定向</li>
      <li>BridgeInterceptor：补全请求头，处理 gzip</li>
      <li>CacheInterceptor：HTTP 缓存</li>
      <li>ConnectInterceptor：从连接池获取或建立连接</li>
      <li>网络拦截器（自定义）</li>
      <li>CallServerInterceptor：发送请求并读取响应</li>
    </ol>
  </li>
  <li><b>连接池：</b>复用 TCP 连接，默认最多 5 个空闲连接，空闲 5 分钟后关闭；支持 HTTP/2 多路复用。</li>
  <li><b>Dispatcher：</b>异步请求默认最多 64 个并发，每个主机最多 5 个。</li>
  <li><b>Retrofit：</b>通过<b>动态代理</b>生成接口实现，解析方法注解构建请求；<code>Converter</code> 负责序列化（Moshi、kotlinx.serialization），<code>CallAdapter</code> 适配返回类型，原生支持 suspend 函数。</li>
</ul>` },

  <li><b>生命周期绑定：</b>根据传入的 Activity、Fragment 或 View 绑定生命周期，页面停止时暂停请求，销毁时取消请求并释放资源。</li>
  <li><b>多级缓存：</b>活动资源（正在使用的图片，弱引用）→ 内存 LRU 缓存 → 磁盘缓存（原始数据或处理后的图片）→ 网络。</li>
  <li><b>内存优化：</b>按目标 View 的尺寸采样解码；通过 BitmapPool 复用内存；页面退出时回收资源。</li>
  <li><b>Coil：</b>基于 Kotlin 协程，提供 Compose 的 <code>AsyncImage</code>，更适合 Kotlin 和 Compose 项目。</li>
</ul>

  <li><b>策略：</b>合理使用 HTTP 缓存；请求合并与去重；弱网下指数退避重试、请求超时分级；离线优先，先展示本地数据。</li>
  <li><b>监控：</b>通过 OkHttp EventListener 统计 DNS、连接、TLS、首字节等阶段的耗时。</li>

  <li><b>Android 12+：</b>后台启动前台服务受限；精确闹钟需要权限。</li>
  <li><b>Android 14：</b>前台服务必须声明类型。</li>

<div class="droid">和 Kotlin lambda 捕获外部变量是同一个概念。Kotlin 中 lambda 修改外部 <code>var</code> 时，编译器会把它包装成 <code>Ref.IntRef</code> 放到堆上，所以函数返回后变量仍然存活。JS 的闭包就是这个机制。</div>
<pre><code>// JavaScript
function createCounter() {
  let count = 0;                 // 外层函数的局部变量
  return {
    inc() { count++; return count; },
    get() { return count; }
  };
}
const counter = createCounter(); // createCounter 已经执行完毕

<pre><code>// 前端：分片上传 + 秒传 + 断点续传
async function uploadFile(file) {
  const CHUNK = 5 * 1024 * 1024;
  const hash = await sha256(file);                                     // 文件指纹
  const status = await fetch('/api/uploads/' + hash).then(r =&gt; r.json());
  if (status.done) return;                                             // 秒传：服务端已有该文件

  const total = Math.ceil(file.size / CHUNK);
  for (let i = 0; i &lt; total; i++) {
    if (status.uploaded.includes(i)) continue;                         // 断点续传：跳过已上传的分片
    const body = file.slice(i * CHUNK, (i + 1) * CHUNK);
    await fetch('/api/uploads/' + hash + '/chunks/' + i, { method: 'PUT', body });
  }
  await fetch('/api/uploads/' + hash + '/complete', { method: 'POST' }); // 通知服务端合并
}

async function sha256(file) {
  const buf = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
  return Array.from(new Uint8Array(buf)).map(b =&gt; b.toString(16).padStart(2, '0')).join('');

<pre><code>// 令牌桶：理解原理用的单机实现
class TokenBucket(private val capacity: Int, private val refillPerSecond: Double) {
    private var tokens = capacity.toDouble()
    private var lastRefill = System.nanoTime()

    @Synchronized
    fun tryAcquire(): Boolean {
        val now = System.nanoTime()
        val elapsedSeconds = (now - lastRefill) / 1_000_000_000.0
        tokens = minOf(capacity.toDouble(), tokens + elapsedSeconds * refillPerSecond)  // 按时间补充令牌

        if (tokens &lt; 1) return false
        tokens -= 1
        return true
    }

fun lengthOfLongestSubstring(s: String): Int {
    val last = HashMap&lt;Char, Int&gt;()     // 字符 → 最后出现的位置
    var left = 0
    var best = 0
    for (right in s.indices) {

<pre><code>// Kotlin：快速排序
fun quickSort(a: IntArray, lo: Int = 0, hi: Int = a.size - 1) {
    if (lo &gt;= hi) return
    val pivot = a[(lo..hi).random()]         // 随机基准，避免有序数组退化
    var i = lo
    var j = hi
    while (i &lt;= j) {
        while (a[i] &lt; pivot) i++
        while (a[j] &gt; pivot) j--
        if (i &lt;= j) {
            a[i] = a[j].also { a[j] = a[i] } // 交换
            i++
            j--
        }
    }
    quickSort(a, lo, j)
    quickSort(a, i, hi)
}

// Kotlin：归并排序（稳定）
fun mergeSort(a: List&lt;Int&gt;): List&lt;Int&gt; {
    if (a.size &lt;= 1) return a
    val left = mergeSort(a.subList(0, a.size / 2))
    val right = mergeSort(a.subList(a.size / 2, a.size))
    val result = ArrayList&lt;Int&gt;(a.size)
    var i = 0
    var j = 0
    while (i &lt; left.size &amp;&amp; j &lt; right.size) {
        result.add(if (left[i] &lt;= right[j]) left[i++] else right[j++])
    }
    while (i &lt; left.size) result.add(left[i++])
    while (j &lt; right.size) result.add(right[j++])
    return result

<pre><code>// Kotlin 手写版：哈希表 + 双向链表（面试官常要求）
class LRU(private val capacity: Int) {
    private class Node(val key: Int, var value: Int) {
        var prev: Node? = null
        var next: Node? = null
    }
    private val map = HashMap&lt;Int, Node&gt;()
    private val head = Node(0, 0)            // 哨兵节点：头部是最近使用的
    private val tail = Node(0, 0)            // 哨兵节点：尾部是最久未使用的

    init { head.next = tail; tail.prev = head }

    fun get(key: Int): Int {
        val node = map[key] ?: return -1
        moveToHead(node)
        return node.value
    }

    fun put(key: Int, value: Int) {
        map[key]?.let { it.value = value; moveToHead(it); return }
        val node = Node(key, value)
        map[key] = node
        addToHead(node)
        if (map.size &gt; capacity) {
            val last = tail.prev!!
            remove(last)
            map.remove(last.key)
        }
    }

    private fun addToHead(n: Node) {
        n.prev = head
        n.next = head.next
        head.next!!.prev = n
        head.next = n
    }
    private fun remove(n: Node) {
        n.prev!!.next = n.next
        n.next!!.prev = n.prev
    }
    private fun moveToHead(n: Node) { remove(n); addToHead(n) }
}</code></pre>`,

class SimpleWatcher {
    private val queue = ReferenceQueue&lt;Any&gt;()
    private val watched = mutableMapOf&lt;String, KeyedWeakReference&gt;()

    fun watch(obj: Any) {                              // 在 Activity onDestroy 后调用

        watched[key] = KeyedWeakReference(obj, key, queue)
        mainHandler.postDelayed({ check(key) }, 5000)  // 5 秒后检查

        removeCollected()
        if (key !in watched) return                    // 已被回收，没有泄漏

        removeCollected()

    }

<pre><code>// OkHttp 拦截器链的极简实现，理解 chain.proceed() 的递归调用
interface Interceptor { fun intercept(chain: Chain): Response }

class Chain(private val interceptors: List&lt;Interceptor&gt;, private val index: Int, val request: Request) {
    fun proceed(request: Request): Response {
        val next = Chain(interceptors, index + 1, request)   // 创建下一个链节点
        return interceptors[index].intercept(next)            // 调用当前拦截器
    }
}

      '<summary><span class="no">' + (si + 1) + '.' + (qi + 1) + '</span>' +
      '<span class="q">' + it.q + '</span>' +
      '<span class="badge p' + it.p + '">' + '★'.repeat(it.p) + '</span>' +
      '<button type="button" class="mk">标记掌握</button></summary>' +
      '<div class="ans">' + it.a +
      (EXTRA[id] ? '<div class="deep"><div class="deep-h">📘 深入理解 · 代码 Demo</div>' + EXTRA[id] + '</div>' : '') +
      '</div>';
    section.appendChild(d);
    d.dataset.text = d.textContent.toLowerCase();
    total++;
  });
  main.appendChild(section);

  const link = document.createElement('a');
  link.href = '#' + sec.id;
  link.innerHTML = (si + 1) + '. ' + sec.title + ' <span></span>';
  toc.appendChild(link);
  tocCounts[sec.id] = link.querySelector('span');
});

const emptyTip = document.createElement('div');
emptyTip.className = 'empty';
emptyTip.textContent = '没有匹配的题目';
emptyTip.hidden = true;
main.appendChild(emptyTip);

function renderMark(d) {
  const on = !!mastered[d.dataset.id];
  const btn = d.querySelector('.mk');
  btn.classList.toggle('on', on);
  btn.textContent = on ? '✓ 已掌握' : '标记掌握';
  d.classList.toggle('mastered', on);
}

function updateStat() {
  const count = Array.from(document.querySelectorAll('details.qa')).filter(d => mastered[d.dataset.id]).length;
  document.getElementById('stat').textContent = '已掌握 ' + count + ' / ' + total;
  document.getElementById('barFill').style.width = (total ? count / total * 100 : 0) + '%';
}

const searchInput = document.getElementById('search');
const hideMastered = document.getElementById('hideMastered');

function apply() {
  const kw = searchInput.value.trim().toLowerCase();
  let visibleTotal = 0;
  document.querySelectorAll('.sec').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('details.qa').forEach(d => {
      const ok = (!kw || d.dataset.text.includes(kw)) &&
        (currentP === 0 || Number(d.dataset.p) === currentP) &&
        !(hideMastered.checked && mastered[d.dataset.id]);
      d.hidden = !ok;
      if (ok) n++;
    });
    sec.hidden = n === 0;
    tocCounts[sec.id].textContent = n;
    tocCounts[sec.id].parentElement.hidden = n === 0;
    visibleTotal += n;
  });
  emptyTip.hidden = visibleTotal > 0;
}

document.querySelectorAll('details.qa').forEach(d => {
  renderMark(d);
  d.querySelector('.mk').addEventListener('click', e => {
    e.preventDefault();
    e.stopPropagation();
    const id = d.dataset.id;
    if (mastered[id]) delete mastered[id]; else mastered[id] = true;
    save();
    renderMark(d);
    updateStat();
    if (hideMastered.checked) apply();
  });
});

document.querySelectorAll('.toolbar .btn[data-p]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.toolbar .btn[data-p]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentP = Number(btn.dataset.p);
    apply();
  });
});

searchInput.addEventListener('input', apply);
hideMastered.addEventListener('change', apply);

const visibleCards = () => Array.from(document.querySelectorAll('details.qa')).filter(d => !d.hidden);

document.getElementById('expand').addEventListener('click', () => visibleCards().forEach(d => { d.open = true; }));
document.getElementById('collapse').addEventListener('click', () => document.querySelectorAll('details.qa').forEach(d => { d.open = false; }));

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('确定清空所有“已掌握”标记吗？')) return;
  mastered = {};
  save();
  document.querySelectorAll('details.qa').forEach(renderMark);
  updateStat();
  apply();
});

document.getElementById('random').addEventListener('click', () => {
  let pool = visibleCards().filter(d => !mastered[d.dataset.id]);
  if (pool.length === 0) pool = visibleCards();
  if (pool.length === 0) return;
  const d = pool[Math.floor(Math.random() * pool.length)];
  document.querySelectorAll('details.qa.flash').forEach(x => x.classList.remove('flash'));
  d.open = false;
  d.scrollIntoView({ behavior: 'smooth', block: 'center' });
  d.classList.add('flash');
  setTimeout(() => d.classList.remove('flash'), 2500);
});

window.addEventListener('beforeprint', () => document.querySelectorAll('details.qa').forEach(d => { d.open = true; }));

updateStat();
apply();
</script>
</body>
</html>
