<script>
const DATA = [
{
  id: 'quant', title: '量化交易', note: '研究 / 开发 / 执行 / 风控',
  items: [
  { p: 3, q: '如何从一个交易想法走到可以上线的策略？', a: `
<p>先把想法写成<b>可证伪的假设</b>，例如“过去 12 个月动量在流动性好的 ETF 中存在持续性”。完整流程是：</p>
<ol><li><b>定义规则：</b>标的池、信号、调仓频率、仓位、退出条件与容量。</li><li><b>准备点时数据：</b>保留当时真正可得的数据、复权规则与退市证券。</li><li><b>严格回测：</b>加入手续费、买卖价差、滑点、涨跌停、最小交易单位和无法成交的情形。</li><li><b>稳健性验证：</b>样本内/样本外切分、滚动回测、参数敏感性和不同市场状态。</li><li><b>模拟盘与小资金实盘：</b>核对信号、订单、实际成交和回测假设；设定风险限额与紧急停机。</li></ol>
<p>可信的结论不是“回测收益高”，而是“扣除现实成本后，在未参与调参的数据中仍有稳定优势”，并能清楚说明策略的失效条件。</p>` },
  { p: 3, q: '什么是未来函数、幸存者偏差和数据窥探？如何避免？', a: `
<table><tr><th>问题</th><th>例子</th><th>控制方法</th></tr><tr><td>未来函数</td><td>用收盘价决定当日收盘成交；使用后来修正的财务数据</td><td>按可用时间戳对齐，信号至少延迟到下一根可交易 bar</td></tr><tr><td>幸存者偏差</td><td>用今天的指数成分股回测十年前，遗漏退市股票</td><td>使用历史成分股和退市证券的点时标的池</td></tr><tr><td>数据窥探</td><td>反复调参后只报告最优参数</td><td>预留测试集，滚动样本外验证，报告全参数区域</td></tr></table>
<p>还要检查复权、时区、财报披露时点、停牌和缺失值。不能说明“此刻数据是否真实可见”的回测，不应进入实盘决策。</p>` },
  { p: 3, q: '夏普比率、最大回撤、信息比率分别说明什么？', a: `
<ul><li><b>夏普比率：</b>超额收益除以总波动，衡量每单位波动获得的补偿；年化前要确认收益频率和独立性假设。</li><li><b>最大回撤：</b>净值从历史峰值到后续谷值的最大跌幅，反映最坏路径风险。</li><li><b>信息比率：</b>相对基准的超额收益除以跟踪误差，适合评估主动管理或因子组合。</li></ul><p>不能只看单一指标，还应查看收益分布、尾部损失、换手率、容量、因子暴露和收益是否集中在少量日期。</p>` },
  { p: 3, q: '为什么交易成本会让回测失真？如何建模？', a: `
<p>回测常以中间价或收盘价“瞬间成交”，但实际至少有<b>佣金、税费、买卖价差、滑点和市场冲击</b>。高换手策略的毛收益尤其容易被成本吞掉。</p><pre><code>turnover = sum(abs(target_weight - current_weight))
cost = turnover * (commission + half_spread + slippage)
net_return = gross_return - cost</code></pre><p>初版可用固定 bps；更可信的模型应按成交量、波动率、订单参与率和盘口深度动态估计，并限制单日成交额占 ADV 的比例。</p>` },
  { p: 3, q: '市价单、限价单有什么权衡？什么是订单簿和滑点？', a: `
<ul><li><b>市价单：</b>优先保证成交，代价是价格不确定；流动性不足时会吃穿多个档位。</li><li><b>限价单：</b>限制最差成交价，可能排队后完全不成交；回测不能把触及限价当作必然成交。</li><li><b>订单簿：</b>按价格档位排列的买卖挂单；最优买卖价之差是 bid-ask spread，中间价只是参考。</li></ul><p>执行策略需在成交概率、价格改善、冲击成本和信息泄露之间取舍。大单通常拆为 VWAP、TWAP 或参与率订单。</p>` },
  { p: 3, q: '如何设计策略和账户层面的风险控制？', a: `
<ul><li><b>事前：</b>单标的/行业/风格敞口、杠杆、仓位、订单金额、成交参与率和可交易性限额。</li><li><b>盘中：</b>价格偏离保护、重复订单幂等、行情陈旧检测、最大日内亏损、熔断与 kill switch。</li><li><b>事后：</b>持仓与成交对账、PnL 归因、风险暴露、异常成交和模型漂移监控。</li></ul><p>连续亏损不等于策略失效；超出预设阈值时降仓或停机重新验证，而不是临时修改规则追逐近期表现。</p>` },
  { p: 2, q: '时间序列中的平稳性、均值回归和协整分别是什么？', a: `
<ul><li><b>平稳性：</b>均值、方差和自协方差不随时间变化。价格通常非平稳，收益率可能更接近平稳。</li><li><b>均值回归：</b>偏离长期均值后有回归倾向，必须验证交易成本后是否仍成立。</li><li><b>协整：</b>两个非平稳序列的线性组合是平稳的；相关性高不代表协整。</li></ul><p>ADF/KPSS 仅是辅助检验，统计显著性不等于可交易性；还要验证样本外稳定性、结构变化和执行成本。</p>` },
  { p: 2, q: '向量化回测与事件驱动回测有什么区别？交易系统应有哪些核心模块？', a: `
<table><tr><th>向量化回测</th><th>事件驱动回测</th></tr><tr><td>数组批量计算，研究迭代快，适合日频和简单调仓</td><td>按行情、信号、订单、成交事件推进，更接近真实生命周期</td></tr><tr><td>容易忽略撮合、部分成交、延迟和订单状态</td><td>实现复杂，但适合验证执行逻辑和模拟盘</td></tr></table><p>完整系统至少包含：数据接入与校验、特征/策略、组合与风控、订单管理（OMS）、执行网关、持仓/PnL 账本、监控告警和审计日志。关键要求是事件可追溯、下单幂等、断线可恢复，以及和券商成交回报对账。</p>` },
  { p: 2, q: '如何做组合构建，避免“信号好但组合不可交易”？', a: `
<p>信号排序只是开始。组合层要将预期收益、风险、相关性、成本和约束一起考虑，并加上单标的上限、行业中性、杠杆、换手和流动性限制。预期收益和协方差估计误差会令最优化权重极端，实务常用波动率目标、风险平价、权重收缩和离散化。</p>` },
  { p: 1, q: '如何介绍一个量化项目，既可信又适合量化开发岗位？', a: `
<p>用“<b>假设 → 数据 → 实现 → 验证 → 风险</b>”介绍。例如：我实现了一个事件驱动的 ETF 回测和模拟交易系统；数据层按交易日和可用时间处理复权与缺失值，账户层按订单、成交、手续费和滑点更新现金、持仓和净值。</p><p>除夏普和回撤外，我报告换手、成本敏感性和样本外结果；系统通过订单状态机、幂等 client order id、持仓对账和最大亏损阈值处理交易风险。对开发岗而言，可复现代码、测试、数据版本、稳定性设计和诚实的局限分析，比未经验证的高收益曲线更能体现能力。</p>` },
  ]
},
{
  id: 'js', title: 'JavaScript 核心', note: '手写题高频',
  items: [
    { p: 3, q: '什么是闭包？有哪些用途和问题？', a: `
<p><b>闭包 = 函数 + 其定义时的词法环境。</b>内层函数引用了外层函数的变量，即使外层函数执行结束，这些变量仍然被保留。</p>
<ul>
  <li><b>用途：</b>私有变量与模块封装、函数工厂、柯里化、防抖节流中保存定时器。</li>
  <li><b>问题：</b>被引用的变量无法回收，使用不当会导致内存占用过高。</li>
  <li><b>经典题：</b><code>for (var i...) setTimeout(() =&gt; console.log(i))</code> 输出相同值，因为 <code>var</code> 只有函数作用域；改用 <code>let</code>（每次迭代新绑定）或 IIFE 解决。</li>
</ul>` },
    { p: 3, q: 'this 的指向规则是什么？call / apply / bind 有什么区别？', a: `
<ol>
  <li><b>默认绑定：</b>独立调用时，非严格模式指向全局对象，严格模式为 <code>undefined</code>。</li>
  <li><b>隐式绑定：</b><code>obj.fn()</code> 中指向 <code>obj</code>；赋值给变量后再调用会丢失绑定。</li>
  <li><b>显式绑定：</b><code>call / apply / bind</code> 指定 this。</li>
  <li><b>new 绑定：</b>指向新创建的实例。</li>
  <li><b>箭头函数：</b>没有自己的 this，继承定义时外层作用域的 this，且无法被改变。</li>
</ol>
<p>优先级：<b>new &gt; 显式 &gt; 隐式 &gt; 默认</b>。</p>
<p><code>call(ctx, a, b)</code> 逐个传参，<code>apply(ctx, [a, b])</code> 传数组，二者立即执行；<code>bind</code> 返回绑定后的新函数，不立即执行。</p>` },
    { p: 3, q: '解释原型链，以及 class 和原型的关系。', a: `
<ul>
  <li>每个对象都有内部属性 <code>[[Prototype]]</code>（可通过 <code>__proto__</code> 访问），指向其构造函数的 <code>prototype</code>。</li>
  <li>访问属性时先查自身，找不到就沿原型链向上查找，直到 <code>Object.prototype</code>，再往上是 <code>null</code>。</li>
  <li><code>class</code> 是基于原型的语法糖，<code>extends</code> 本质上是设置子类原型指向父类原型。</li>
  <li><code>instanceof</code> 判断构造函数的 <code>prototype</code> 是否出现在对象原型链上。</li>
</ul>` },
    { p: 3, q: '讲一下浏览器的事件循环（宏任务 / 微任务）。', a: `
<ul>
  <li>JS 主线程单线程执行，同步代码进入调用栈。</li>
  <li><b>宏任务：</b>script 整体、<code>setTimeout</code>、<code>setInterval</code>、I/O、UI 事件、<code>MessageChannel</code>。</li>
  <li><b>微任务：</b><code>Promise.then/catch/finally</code>、<code>queueMicrotask</code>、<code>MutationObserver</code>、await 之后的代码。</li>
  <li>流程：执行一个宏任务 → <b>清空全部微任务</b> → 浏览器可能渲染 → 取下一个宏任务。</li>
</ul>
<pre><code>console.log(1);
setTimeout(() =&gt; console.log(2));
Promise.resolve().then(() =&gt; console.log(3));
console.log(4);
// 输出：1 4 3 2</code></pre>` },
    { p: 3, q: 'Promise 有哪些状态？all / allSettled / race / any 的区别？', a: `
<p>三种状态：<code>pending</code>、<code>fulfilled</code>、<code>rejected</code>；状态一旦改变不可逆。<code>then</code> 返回新 Promise，因此可以链式调用。</p>
<table>
  <tr><th>方法</th><th>何时完成</th><th>失败行为</th></tr>
  <tr><td>Promise.all</td><td>全部成功</td><td>任意一个失败立即 reject</td></tr>
  <tr><td>Promise.allSettled</td><td>全部结束</td><td>不会 reject，返回每项状态</td></tr>
  <tr><td>Promise.race</td><td>第一个结束（成功或失败）</td><td>跟随第一个结果</td></tr>
  <tr><td>Promise.any</td><td>第一个成功</td><td>全部失败才 reject（AggregateError）</td></tr>
</table>` },
    { p: 3, q: 'async/await 的原理和注意事项？', a: `
<ul>
  <li>基于 Promise 的语法糖，类似生成器的暂停与恢复；<code>async</code> 函数总是返回 Promise。</li>
  <li><code>await</code> 之后的代码相当于放入 <code>then</code> 回调，作为微任务执行。</li>
  <li>错误处理使用 <code>try/catch</code>，或在调用处 <code>.catch</code>。</li>
  <li><b>常见坑：</b>互不依赖的请求逐个 await 会串行变慢，应使用 <code>Promise.all</code> 并发；在 <code>forEach</code> 中 await 不会等待，应使用 <code>for...of</code>。</li>
</ul>` },
    { p: 3, q: '手写防抖（debounce）和节流（throttle），并说明使用场景。', a: `
<pre><code>function debounce(fn, delay) {
  let timer = null;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() =&gt; fn.apply(this, args), delay);
  };
}

function throttle(fn, interval) {
  let last = 0;
  return function (...args) {
    const now = Date.now();
    if (now - last &gt;= interval) {
      last = now;
      fn.apply(this, args);
    }
  };
}</code></pre>
<ul>
  <li><b>防抖：</b>停止触发一段时间后才执行一次，如搜索联想、窗口 resize 结束后计算。</li>
  <li><b>节流：</b>固定间隔最多执行一次，如滚动监听、按钮防连点、拖拽。</li>
</ul>` },
    { p: 2, q: '手写 Promise.all。', a: `
<pre><code>function promiseAll(list) {
  return new Promise((resolve, reject) =&gt; {
    const result = [];
    let done = 0;
    const arr = Array.from(list);
    if (arr.length === 0) return resolve(result);
    arr.forEach((item, i) =&gt; {
      Promise.resolve(item).then(value =&gt; {
        result[i] = value;           // 按原顺序保存
        if (++done === arr.length) resolve(result);
      }, reject);                     // 任意失败立即 reject
    });
  });
}</code></pre>
<p>要点：保持结果顺序、兼容非 Promise 值、空数组直接 resolve、首个失败即 reject。</p>` },
    { p: 2, q: '深拷贝和浅拷贝的区别？如何实现深拷贝？', a: `
<ul>
  <li><b>浅拷贝</b>只复制第一层，嵌套对象仍共享引用：<code>{...obj}</code>、<code>Object.assign</code>、<code>slice</code>。</li>
  <li><b>深拷贝</b>递归复制所有层级。现代浏览器和 Node 优先使用 <code>structuredClone</code>。</li>
  <li><code>JSON.parse(JSON.stringify())</code> 的局限：丢失函数、<code>undefined</code>、Symbol，Date 变字符串，不能处理循环引用。</li>
</ul>
<pre><code>function deepClone(obj, seen = new WeakMap()) {
  if (obj === null || typeof obj !== 'object') return obj;
  if (obj instanceof Date) return new Date(obj);
  if (obj instanceof RegExp) return new RegExp(obj);
  if (seen.has(obj)) return seen.get(obj);   // 处理循环引用
  const copy = Array.isArray(obj) ? [] : {};
  seen.set(obj, copy);
  for (const key of Reflect.ownKeys(obj)) {
    copy[key] = deepClone(obj[key], seen);
  }
  return copy;
}</code></pre>` },
    { p: 2, q: '== 和 === 的区别？', a: `
<ul>
  <li><code>===</code> 严格相等，不做类型转换；<code>==</code> 会先进行隐式类型转换再比较。</li>
  <li>特例：<code>null == undefined</code> 为 true，但它们与其他值 <code>==</code> 均为 false；<code>NaN</code> 不等于自身。</li>
  <li><code>Object.is</code> 可以区分 <code>+0 / -0</code>，并认为 <code>NaN</code> 等于 <code>NaN</code>。</li>
  <li>工程中统一使用 <code>===</code>。</li>
</ul>` },
    { p: 2, q: 'var、let、const 的区别？', a: `
<table>
  <tr><th></th><th>var</th><th>let</th><th>const</th></tr>
  <tr><td>作用域</td><td>函数作用域</td><td>块级</td><td>块级</td></tr>
  <tr><td>变量提升</td><td>提升并初始化为 undefined</td><td>提升但处于暂时性死区（TDZ）</td><td>同 let</td></tr>
  <tr><td>重复声明</td><td>允许</td><td>不允许</td><td>不允许</td></tr>
  <tr><td>重新赋值</td><td>可以</td><td>可以</td><td>不可以（对象内部属性仍可修改）</td></tr>
</table>` },
    { p: 2, q: 'ES Module 和 CommonJS 的区别？', a: `
<ul>
  <li><b>加载时机：</b>ESM 编译时静态分析；CommonJS 运行时加载。</li>
  <li><b>导出值：</b>ESM 导出的是实时绑定；CommonJS 导出值的拷贝（对象则是引用）。</li>
  <li><b>同步性：</b>ESM 支持异步加载、顶层 await；<code>require</code> 同步执行。</li>
  <li><b>Tree Shaking：</b>ESM 的静态结构才支持。</li>
  <li>语法：<code>import / export</code> 与 <code>require / module.exports</code>。</li>
</ul>` },
    { p: 1, q: 'JS 垃圾回收机制？常见内存泄漏有哪些？', a: `
<ul>
  <li>主流采用<b>标记清除</b>：从根对象出发标记可达对象，清除不可达对象；V8 使用分代回收（新生代 Scavenge 复制、老生代标记清除 / 整理）。</li>
  <li><b>常见泄漏：</b>意外的全局变量、未清除的定时器、未移除的事件监听、闭包长期持有大对象、已从 DOM 移除但仍被引用的节点、无上限的缓存。</li>
  <li>排查：Chrome DevTools Memory 面板的 Heap Snapshot 对比。</li>
</ul>` },
  ]
},

<pre><code>type MyPartial&lt;T&gt; = { [K in keyof T]?: T[K] };
type MyPick&lt;T, K extends keyof T&gt; = { [P in K]: T[P] };
type MyOmit&lt;T, K extends keyof any&gt; = MyPick&lt;T, Exclude&lt;keyof T, K&gt;&gt;;</code></pre>` },

    { p: 3, q: 'HTTP/1.1、HTTP/2、HTTP/3 有什么区别？', a: `
<table>
  <tr><th>版本</th><th>关键特性</th><th>问题</th></tr>
  <tr><td>HTTP/1.1</td><td>持久连接（keep-alive）、管道化、Host 头</td><td>队头阻塞，浏览器需建立多个连接</td></tr>
  <tr><td>HTTP/2</td><td>二进制分帧、单连接多路复用、HPACK 头部压缩、流优先级</td><td>仍基于 TCP，丢包时存在 TCP 层队头阻塞</td></tr>
  <tr><td>HTTP/3</td><td>基于 UDP 的 QUIC，解决 TCP 队头阻塞；握手更快（1-RTT / 0-RTT）；支持连接迁移</td><td>部分网络对 UDP 支持不佳</td></tr>

    { p: 3, q: 'HTTPS 握手过程是怎样的？', a: `
<p>以 TLS 1.2 + ECDHE 为例：</p>
<ol>
  <li><b>ClientHello：</b>客户端发送支持的 TLS 版本、加密套件、随机数。</li>
  <li><b>ServerHello：</b>服务器确定加密套件，返回随机数、证书和 ECDHE 公钥参数。</li>
  <li><b>证书校验：</b>客户端验证证书链、有效期、域名和吊销状态。</li>
  <li><b>密钥交换：</b>客户端发送自己的 ECDHE 公钥，双方计算出相同的会话密钥。</li>
  <li><b>Finished：</b>双方确认握手，之后使用对称加密传输数据。</li>
</ol>
<p>核心思想：<b>非对称加密用于身份认证和密钥协商，对称加密用于传输数据</b>。TLS 1.3 将握手缩短为 1-RTT，并支持 0-RTT 恢复。</p>` },
    { p: 3, q: '常见 HTTP 状态码有哪些？', a: `

    { p: 3, q: 'GET 和 POST 的区别？什么是幂等？', a: `

  <li><b>缓存与历史：</b>GET 可被缓存、收藏、保留在历史记录中；POST 默认不缓存。</li>
  <li><b>安全性：</b>POST 也不是加密传输，敏感数据依靠 HTTPS。</li>
  <li><b>幂等：</b>多次执行和执行一次效果相同。GET、PUT、DELETE、HEAD 是幂等的；POST 不是；PATCH 不保证幂等。</li>
</ul>` },
    { p: 3, q: '浏览器缓存机制：强缓存和协商缓存？', a: `
<ul>

    <ul>

    { p: 2, q: 'TCP 为什么需要三次握手、四次挥手？', a: `
<ul>
  <li><b>三次握手：</b>SYN → SYN+ACK → ACK。确认双方都具备收发能力，并同步初始序列号；避免已失效的连接请求被误认为新连接。</li>
  <li><b>四次挥手：</b>TCP 是全双工，双方需各自关闭发送方向：FIN → ACK →（服务端发送完剩余数据）FIN → ACK。</li>
  <li><b>TIME_WAIT 等待 2MSL：</b>确保最后一个 ACK 能被对方收到，并让旧连接残留报文在网络中消失。</li>
</ul>` },

  <tr><td>场景</td><td>HTTP/1.1、HTTP/2、文件传输</td><td>音视频、游戏、DNS、QUIC</td></tr>

  <li><b>WebSocket：</b>全双工通信，适合聊天、协同编辑、实时游戏；需要处理心跳、重连和鉴权。</li>

  <li><b>布局（Layout）</b>：计算几何位置和尺寸。</li>
  <li><b>绘制（Paint）</b>：生成绘制指令。</li>
  <li><b>合成（Composite）</b>：分层、光栅化，由合成线程合成为最终画面。</li>
</ol>
<p>CSS 不阻塞 DOM 解析，但会阻塞渲染；同步 JS 会阻塞 HTML 解析。</p>` },
    { p: 2, q: '重排和重绘是什么？如何优化？', a: `
<ul>
  <li><b>重排（Reflow）：</b>几何属性变化，需要重新布局，开销大。例如修改宽高、增删 DOM、读取 <code>offsetWidth</code> 等布局信息。</li>
  <li><b>重绘（Repaint）：</b>只改变外观，如颜色、背景。</li>
  <li>重排一定导致重绘，重绘不一定重排。</li>
  <li><b>优化：</b>批量修改样式或使用 class；避免读写布局属性交替；动画使用 <code>transform</code> 和 <code>opacity</code>（只触发合成）；复杂动画适当使用 <code>will-change</code>；使用 DocumentFragment 批量操作 DOM。</li>
</ul>` },
    { p: 2, q: '事件冒泡、捕获和事件委托？', a: `
<ul>
  <li>事件传播分三个阶段：<b>捕获</b>（从 window 向下）→ <b>目标</b> → <b>冒泡</b>（向上）。</li>
  <li><code>addEventListener</code> 第三个参数或 <code>{ capture: true }</code> 控制是否在捕获阶段监听。</li>
  <li><code>stopPropagation</code> 阻止继续传播；<code>preventDefault</code> 阻止默认行为。</li>
  <li><b>事件委托：</b>将监听器绑定在父元素上，通过 <code>event.target</code> 判断实际触发元素。减少监听器数量，并支持动态新增的子元素。</li>
</ul>` },
    { p: 2, q: 'script 标签的 defer 和 async 有什么区别？', a: `
<ul>
  <li><b>普通 script：</b>阻塞 HTML 解析，下载并执行后才继续。</li>
  <li><b>async：</b>并行下载，下载完成后立即执行，执行时会阻塞解析；多个脚本执行顺序不确定。适合统计脚本等独立脚本。</li>
  <li><b>defer：</b>并行下载，在 HTML 解析完成后、<code>DOMContentLoaded</code> 前按顺序执行。适合依赖 DOM 的业务脚本。</li>
  <li><code>type="module"</code> 默认具有 defer 行为。</li>
</ul>` },
  ]
},
{
  id: 'react', title: 'React', note: '可用 Compose 类比回答',
  items: [
    { p: 3, q: '虚拟 DOM 和 Diff 算法是什么？', a: `
<ul>
  <li><b>虚拟 DOM</b> 是用 JS 对象描述 UI 结构。状态变化时生成新的树，与旧树比较后，将最小差异提交到真实 DOM。</li>
  <li>价值：声明式开发、跨平台渲染能力、批量更新；它不保证一定比手动操作 DOM 更快。</li>
  <li><b>Diff 的三个假设</b>，将复杂度从 O(n³) 降到 O(n)：
    <ol>
      <li>只比较同层节点，不跨层移动。</li>
      <li>元素类型不同，直接销毁并重建子树。</li>
      <li>通过 <code>key</code> 识别列表中的同一元素。</li>
    </ol>
  </li>
</ul>` },
    { p: 3, q: '列表中的 key 有什么作用？为什么不推荐使用 index？', a: `
<ul>
  <li><code>key</code> 帮助 React 识别哪些元素被新增、删除或移动，从而复用节点和组件状态。</li>
  <li>使用 index 时，列表插入、删除、排序会使 key 与数据错位，导致不必要的重渲染，或输入框等组件状态错乱。</li>
  <li>应使用数据中稳定且唯一的 ID。纯静态、不会重新排序的列表可以使用 index。</li>
</ul>
<div class="tip">对应 Compose 中 <code>LazyColumn</code> 的 <code>items(key = { it.id })</code> 和 <code>key()</code>。</div>` },
    { p: 3, q: 'Hooks 的使用规则是什么？为什么必须这样？', a: `
<ul>
  <li>只能在<b>函数组件或自定义 Hook 的顶层</b>调用，不能放在条件、循环或嵌套函数中。</li>
  <li>只能在 React 函数中调用。</li>
  <li><b>原因：</b>React 将 Hooks 按调用顺序存储在组件对应 Fiber 的链表中，每次渲染依靠顺序匹配状态。调用顺序变化会导致状态错位。</li>
</ul>` },
    { p: 3, q: 'useEffect 的依赖、清理函数和闭包陷阱？', a: `
<ul>
  <li><code>useEffect</code> 在浏览器绘制后执行；依赖使用 <code>Object.is</code> 比较，依赖变化时重新执行。</li>
  <li>不传依赖：每次渲染后执行；空数组：只在挂载后执行一次。</li>
  <li><b>清理函数</b>在下次执行 effect 前和卸载时调用，用于取消订阅、清除定时器、中止请求。</li>
  <li><b>闭包陷阱：</b>effect 或定时器捕获了旧渲染中的 state。解决方式：补全依赖、使用函数式更新 <code>setCount(c =&gt; c + 1)</code>、用 <code>useRef</code> 保存最新值。</li>
  <li>开发环境 StrictMode 会刻意执行两次 mount / unmount，用于发现未正确清理的副作用。</li>
  <li>需要在绘制前同步测量 DOM 时使用 <code>useLayoutEffect</code>。</li>
</ul>
<div class="tip">类比 Compose 的 <code>LaunchedEffect(key)</code> 和 <code>DisposableEffect</code>。</div>` },
    { p: 3, q: 'useMemo、useCallback、React.memo 的区别和使用场景？', a: `
<ul>
  <li><b>useMemo：</b>缓存计算结果，依赖不变时不重新计算。</li>
  <li><b>useCallback：</b>缓存函数引用，等价于 <code>useMemo(() =&gt; fn, deps)</code>。</li>
  <li><b>React.memo：</b>高阶组件，props 浅比较不变时跳过子组件渲染。</li>
  <li>通常配合使用：父组件用 <code>useCallback</code> 稳定回调，子组件用 <code>React.memo</code> 避免无效渲染。</li>
  <li><b>不要滥用：</b>缓存本身有比较和内存开销，只用于昂贵计算或明确的性能瓶颈。新版本 React Compiler 可以自动完成部分记忆化。</li>
</ul>` },
    { p: 3, q: '组件什么时候重新渲染？如何优化？', a: `
<ul>
  <li><b>触发条件：</b>自身 state 变化；父组件重新渲染（默认子组件也会渲染）；使用的 Context 值变化。</li>
  <li><b>优化：</b>
    <ul>
      <li>将状态下放到真正使用它的组件。</li>
      <li>将昂贵组件作为 <code>children</code> 传入，避免随父组件状态变化。</li>
      <li>使用 <code>React.memo</code> + 稳定 props。</li>
      <li>拆分 Context，或使用支持选择器的状态库，减少无关订阅。</li>
      <li>长列表虚拟化。</li>
      <li>使用 React DevTools Profiler 定位问题。</li>
    </ul>
  </li>
</ul>` },
    { p: 2, q: 'useRef 的作用？', a: `
<ul>
  <li>获取 DOM 节点引用。</li>
  <li>保存跨渲染持久存在的可变值，修改 <code>ref.current</code> 不会触发重新渲染。</li>
  <li>常用于保存定时器 ID、上一次的值、最新回调，解决闭包读取旧值的问题。</li>
</ul>` },
    { p: 2, q: 'setState 是同步还是异步？什么是批处理？', a: `
<ul>
  <li>状态更新会被调度，而不是立即修改当前渲染中的变量，因此调用后马上读取仍是旧值。</li>
  <li>React 18 起，在事件处理、Promise、定时器等场景中都会<b>自动批处理</b>，多次更新只触发一次渲染。</li>
  <li>新状态依赖旧状态时使用函数式更新：<code>setCount(c =&gt; c + 1)</code>。</li>
  <li>极少数需要立即同步更新 DOM 时，可以使用 <code>flushSync</code>。</li>
</ul>` },
    { p: 2, q: '受控组件和非受控组件的区别？', a: `
<ul>
  <li><b>受控组件：</b>表单值由 React state 管理，通过 <code>value + onChange</code> 更新，便于校验和联动。</li>
  <li><b>非受控组件：</b>表单值由 DOM 自己管理，通过 <code>ref</code> 读取，使用 <code>defaultValue</code>。实现简单，适合文件上传或大型表单性能优化。</li>
  <li>React Hook Form 主要基于非受控方式，以减少重新渲染。</li>
</ul>` },
    { p: 2, q: '组件通信方式和状态管理怎么选？', a: `
<ul>
  <li><b>父子：</b>props 和回调。</li>
  <li><b>跨层级：</b>Context，适合主题、语言、登录用户等低频变化数据。</li>
  <li><b>全局客户端状态：</b>Zustand（轻量）或 Redux Toolkit（规范、调试工具完善，适合大型团队）。</li>
  <li><b>服务端状态：</b>React Query / SWR，负责缓存、请求去重、失效重拉、重试和分页。</li>
  <li><b>原则：</b>区分服务端状态和客户端状态，不要将所有接口数据都放进全局 store。</li>
</ul>` },
    { p: 2, q: 'Fiber 架构和并发渲染是什么？', a: `
<ul>
  <li>Fiber 将渲染拆分为可中断的小工作单元，每个组件对应一个 Fiber 节点。</li>
  <li>分为两个阶段：<b>Render 阶段</b>可中断，计算变更；<b>Commit 阶段</b>同步执行，修改 DOM 并执行副作用。</li>
  <li>通过优先级调度（Lanes），高优先级更新（如输入）可以打断低优先级更新（如大列表筛选）。</li>
  <li>并发特性：<code>useTransition</code>、<code>useDeferredValue</code>、<code>Suspense</code>。</li>
</ul>` },
    { p: 2, q: 'CSR、SSR、SSG、ISR 的区别？', a: `
<table>
  <tr><th>模式</th><th>渲染时机</th><th>优点</th><th>缺点</th></tr>
  <tr><td>CSR</td><td>浏览器运行 JS 后渲染</td><td>服务端压力小，交互体验好</td><td>首屏慢，SEO 较弱</td></tr>
  <tr><td>SSR</td><td>每次请求时在服务端渲染</td><td>首屏快，SEO 好，数据实时</td><td>服务器压力大，需要 hydration</td></tr>
  <tr><td>SSG</td><td>构建时生成静态 HTML</td><td>最快，可放 CDN</td><td>数据更新需要重新构建</td></tr>
  <tr><td>ISR</td><td>静态页面按时间或按需重新生成</td><td>兼顾性能与数据更新</td><td>短时间内可能看到旧数据</td></tr>
</table>
<p>例如：营销页和文档使用 SSG，商品详情使用 ISR 或 SSR，后台管理系统使用 CSR。</p>` },
    { p: 1, q: 'React Server Components 是什么？', a: `
<ul>
  <li>在服务端渲染的组件，代码不会打包到客户端，可以直接访问数据库或内部服务。</li>
  <li>不能使用 state、effect 和浏览器 API；需要交互时，在文件顶部声明 <code>'use client'</code> 作为客户端组件。</li>
  <li>收益：减少客户端 JS 体积、将数据获取靠近数据源。Next.js App Router 默认使用 Server Components。</li>
</ul>` },
    { p: 1, q: '对比 Jetpack Compose 和 React。', a: `
<table>
  <tr><th>概念</th><th>Compose</th><th>React</th></tr>
  <tr><td>UI 模型</td><td>@Composable 函数</td><td>函数组件</td></tr>
  <tr><td>状态</td><td>mutableStateOf + remember</td><td>useState</td></tr>
  <tr><td>缓存</td><td>remember / derivedStateOf</td><td>useMemo / useRef</td></tr>
  <tr><td>副作用</td><td>LaunchedEffect / DisposableEffect</td><td>useEffect 及清理函数</td></tr>
  <tr><td>跨层级数据</td><td>CompositionLocal</td><td>Context</td></tr>
  <tr><td>列表标识</td><td>key / items(key)</td><td>key</td></tr>
  <tr><td>更新机制</td><td>读取状态的作用域精准重组</td><td>从更新的组件开始重新渲染并 Diff</td></tr>
</table>
<div class="tip">这是转全栈时很好的亮点：说明你理解声明式 UI 的共性，而不是只会一个框架。</div>` },
  ]
},
{
  id: 'fe-eng', title: '前端工程化与性能', note: '',
  items: [
    { p: 2, q: 'Webpack 和 Vite 的区别？', a: `
<ul>
  <li><b>Webpack：</b>开发时先打包整个依赖图再启动服务，项目大时启动和热更新较慢；生态成熟、配置灵活。</li>
  <li><b>Vite：</b>开发时利用浏览器原生 ESM 按需编译，使用 esbuild 预构建依赖，启动和 HMR 很快；生产构建基于 Rollup（新版本逐步引入 Rolldown）。</li>
  <li>新项目通常优先选择 Vite；需要复杂自定义构建或维护存量项目时继续使用 Webpack。</li>
</ul>` },
    { p: 2, q: 'Tree Shaking 的原理和前提？', a: `
<ul>
  <li>基于 ESM 的静态导入导出，分析未被使用的导出，在构建时删除。</li>
  <li><b>前提：</b>使用 ESM；代码无副作用，或在 <code>package.json</code> 中正确声明 <code>sideEffects</code>；生产模式压缩。</li>
  <li>CommonJS 和动态属性访问会导致无法有效 Tree Shaking。</li>
</ul>` },
    { p: 2, q: '代码分割和懒加载怎么做？', a: `
<ul>
  <li>使用动态 <code>import()</code> 让构建工具拆分出独立 chunk。</li>
  <li>React 中使用 <code>React.lazy</code> + <code>Suspense</code> 实现路由级或组件级懒加载。</li>
  <li>将第三方依赖拆分成 vendor chunk，利用长期缓存。</li>
  <li>图片使用 <code>loading="lazy"</code> 或 IntersectionObserver 懒加载。</li>
</ul>` },
    { p: 2, q: 'Core Web Vitals 包含哪些指标？', a: `
<table>
  <tr><th>指标</th><th>含义</th><th>良好阈值</th><th>常见优化</th></tr>
  <tr><td>LCP</td><td>最大内容绘制时间</td><td>≤ 2.5s</td><td>优化服务器响应、预加载首屏图片、CDN、SSR</td></tr>
  <tr><td>INP</td><td>交互到下一帧绘制的延迟</td><td>≤ 200ms</td><td>拆分长任务、减少主线程 JS、Web Worker</td></tr>
  <tr><td>CLS</td><td>累计布局偏移</td><td>≤ 0.1</td><td>为图片和广告预留尺寸、避免动态插入内容</td></tr>
</table>
<p>INP 已于 2024 年取代 FID。</p>` },
    { p: 2, q: '前端首屏性能优化有哪些方法？', a: `
<ul>
  <li><b>网络：</b>CDN、HTTP/2 或 HTTP/3、Gzip / Brotli 压缩、合理缓存、<code>preconnect / preload</code>。</li>
  <li><b>资源：</b>代码分割、Tree Shaking、图片使用 WebP / AVIF 和响应式尺寸、字体子集化。</li>
  <li><b>渲染：</b>SSR / SSG、关键 CSS 内联、骨架屏、非关键脚本 defer。</li>
  <li><b>运行时：</b>减少长任务、列表虚拟化、避免不必要的重新渲染。</li>
  <li><b>度量：</b>Lighthouse、Chrome Performance 面板、线上 RUM 监控。</li>
</ul>` },
    { p: 2, q: '长列表虚拟滚动的原理？', a: `
<ul>
  <li>只渲染可视区域及少量缓冲区内的元素，其余位置使用占位高度撑开滚动条。</li>
  <li>根据 <code>scrollTop</code> 计算起始索引和偏移量，滚动时替换渲染内容。</li>
  <li>不定高元素需要预估高度，并在渲染后测量并修正位置。</li>
  <li>常用库：TanStack Virtual、react-window。相当于 Android 的 RecyclerView / LazyColumn。</li>
</ul>` },
    { p: 1, q: '前端测试如何分层？', a: `
<ul>
  <li><b>单元测试：</b>Vitest / Jest，测试工具函数和 Hooks。</li>
  <li><b>组件测试：</b>React Testing Library，从用户视角测试，避免依赖实现细节。</li>
  <li><b>E2E 测试：</b>Playwright / Cypress，覆盖登录、下单等核心链路。</li>
  <li>接口 Mock：MSW。</li>
  <li>遵循测试金字塔：大量单元测试、适量集成测试、少量 E2E 测试。</li>
</ul>` },
  ]
},
{
  id: 'security', title: 'Web 安全', note: '前后端都会问',
  items: [
    { p: 3, q: '什么是 XSS？如何防御？', a: `
<ul>
  <li>攻击者向页面注入恶意脚本，并在其他用户浏览器中执行，可窃取 Cookie、伪造操作。</li>
  <li><b>类型：</b>存储型（存入数据库）、反射型（来自 URL 参数）、DOM 型（前端 JS 直接写入 DOM）。</li>
  <li><b>防御：</b>
    <ul>
      <li>根据输出上下文进行编码；React 默认会转义文本。</li>
      <li>避免使用 <code>innerHTML</code> 和 <code>dangerouslySetInnerHTML</code>；必须渲染 HTML 时使用 DOMPurify 等过滤。</li>
      <li>配置 CSP（Content-Security-Policy）。</li>
      <li>敏感 Cookie 设置 <code>HttpOnly</code>。</li>
      <li>服务端对输入进行校验。</li>
    </ul>
  </li>
</ul>` },
    { p: 3, q: '什么是 CSRF？如何防御？', a: `
<ul>
  <li>攻击者诱导已登录用户访问恶意页面，利用浏览器自动携带 Cookie 的机制，以用户身份发起请求。</li>
  <li><b>防御：</b>
    <ul>
      <li>Cookie 设置 <code>SameSite=Lax</code> 或 <code>Strict</code>。</li>
      <li>使用 CSRF Token，并在服务端校验。</li>
      <li>校验 <code>Origin</code> / <code>Referer</code>。</li>
      <li>GET 请求不执行有副作用的操作；关键操作要求二次验证。</li>
    </ul>
  </li>
  <li>将 Token 放在 <code>Authorization</code> 请求头中，天然不受 CSRF 影响，但需要更加注意 XSS。</li>
</ul>` },
    { p: 3, q: 'SQL 注入的原理和防御？', a: `
<ul>
  <li>将用户输入直接拼接到 SQL 中，导致输入被当作 SQL 代码执行，例如 <code>' OR '1'='1</code>。</li>
  <li><b>防御：</b>使用参数化查询或预编译语句；ORM 使用参数绑定；对输入进行类型和白名单校验；数据库账号最小权限。</li>
  <li>动态排序字段、表名等无法参数化的部分，必须使用白名单。</li>
</ul>` },
    { p: 3, q: '用户密码应该如何存储？', a: `
<ul>
  <li>使用专门的慢哈希算法：<b>Argon2id、bcrypt、scrypt</b>，它们内置随机盐并可调整计算成本。</li>
  <li>不能明文存储，不能使用可逆加密，也不能只使用 MD5 或 SHA-256。</li>
  <li>配合登录失败限制、验证码、多因素认证；密码只通过 HTTPS 传输。</li>
</ul>` },
    { p: 2, q: '什么是越权漏洞？如何防御？', a: `
<ul>
  <li><b>水平越权：</b>同角色用户访问他人数据，例如修改 URL 中的订单 ID 查看他人订单。</li>
  <li><b>垂直越权：</b>普通用户调用管理员接口。</li>
  <li><b>防御：</b>服务端对每个请求都进行鉴权；数据查询带上当前用户条件；统一权限中间件；不信任前端隐藏按钮；避免暴露可遍历的自增 ID。</li>
</ul>` },
    { p: 2, q: 'OWASP Top 10 包含哪些内容？', a: `
<p>2021 版主要包括：访问控制失效、加密机制失效、注入、不安全设计、安全配置错误、易受攻击和过时的组件、身份认证失效、软件和数据完整性失效、安全日志与监控失效、服务端请求伪造（SSRF）。</p>
<div class="tip">回答时不必背全，重点能结合项目说出访问控制、注入、认证、依赖漏洞和 SSRF 的防御方式。</div>` },
  ]
},
{
  id: 'api', title: 'API 设计与鉴权', note: '可结合 GraphQL 经验',
  items: [
    { p: 3, q: 'RESTful API 的设计规范？', a: `
<ul>
  <li>URL 表示资源，使用名词复数：<code>/users/123/orders</code>。</li>
  <li>使用 HTTP 方法表达操作：GET 查询、POST 创建、PUT 全量更新、PATCH 部分更新、DELETE 删除。</li>
  <li>使用准确的状态码，错误信息结构统一。</li>
  <li>支持过滤、排序、分页：<code>/orders?status=paid&amp;sort=-createdAt&amp;limit=20</code>。</li>
  <li>接口版本管理，保持向后兼容。</li>
  <li>统一命名风格，字段使用 camelCase 或 snake_case 之一。</li>
</ul>` },
    { p: 3, q: 'offset 分页和 cursor 分页有什么区别？', a: `
<ul>
  <li><b>offset 分页：</b><code>LIMIT 20 OFFSET 10000</code>。实现简单，支持跳页；但深分页需要扫描并丢弃大量数据，且数据插入或删除时会出现重复或遗漏。</li>
  <li><b>cursor 分页：</b><code>WHERE id &lt; :lastId ORDER BY id DESC LIMIT 20</code>。性能稳定，适合无限滚动和数据实时变化的列表；不支持直接跳到指定页。</li>
  <li>移动端 Feed、消息列表通常使用 cursor 分页；后台管理表格常用 offset 分页。</li>
</ul>` },
    { p: 3, q: '如何设计接口幂等？', a: `
<ul>
  <li><b>场景：</b>网络重试、用户重复点击、消息重复消费，导致重复下单或重复扣款。</li>
  <li><b>方案：</b>
    <ul>
      <li>客户端生成 <code>Idempotency-Key</code>，服务端记录处理结果，重复请求直接返回首次结果。</li>
      <li>数据库唯一约束，例如订单号或业务流水号。</li>
      <li>Redis <code>SET key NX</code> 防止并发重复处理。</li>
      <li>状态机控制：只有处于“待支付”状态的订单才能变为“已支付”。</li>
      <li>乐观锁：<code>UPDATE ... SET version = version + 1 WHERE id = ? AND version = ?</code>。</li>
    </ul>
  </li>
</ul>` },
    { p: 2, q: '如何设计统一的响应结构和错误处理？', a: `
<pre><code>// 成功
{ "data": { ... }, "meta": { "nextCursor": "abc" } }

// 失败
{
  "error": {
    "code": "ORDER_NOT_FOUND",
    "message": "Order does not exist",
    "traceId": "7f3a..."
  }
}</code></pre>
<ul>
  <li>HTTP 状态码表达错误类别，业务错误码表达具体原因。</li>
  <li>使用全局异常处理器统一转换，不向客户端暴露堆栈。</li>
  <li>返回 <code>traceId</code>，便于定位日志。</li>
</ul>` },
    { p: 2, q: '接口版本如何管理？', a: `
<ul>
  <li>常见方式：URL 版本 <code>/v1/users</code>（直观，最常用）、Header 版本、媒体类型版本。</li>
  <li>优先保持向后兼容：只新增可选字段，不删除字段，不修改字段含义。</li>
  <li>必须破坏兼容时发布新版本，旧版本设置下线周期并通知客户端。</li>
  <li><b>移动端尤其重要：</b>旧版 App 会长期存在，服务端需要兼容多个客户端版本。</li>
</ul>` },
    { p: 3, q: 'REST 和 GraphQL 怎么选？GraphQL 的 N+1 问题如何解决？', a: `
<table>
  <tr><th></th><th>REST</th><th>GraphQL</th></tr>
  <tr><td>数据获取</td><td>由服务端决定返回结构，可能过度获取或获取不足</td><td>客户端按需声明字段，一次请求聚合多个资源</td></tr>
  <tr><td>缓存</td><td>可直接使用 HTTP 缓存</td><td>通常为 POST 单入口，需要客户端或持久化查询缓存</td></tr>
  <tr><td>适用场景</td><td>简单 CRUD、公开 API</td><td>多端、复杂页面聚合、字段需求多变</td></tr>
</table>
<p><b>N+1 问题：</b>查询 N 个订单，每个订单的 user 字段各自查一次数据库，共 N+1 次查询。<b>解决：</b>使用 <b>DataLoader</b>，在同一请求中收集 ID 后批量查询，并做请求级缓存。</p>
<p>其他关注点：查询深度和复杂度限制、字段级鉴权、Schema 演进时使用 <code>@deprecated</code>。</p>` },
    { p: 3, q: 'Session 和 JWT 的区别？', a: `
<table>
  <tr><th></th><th>Session</th><th>JWT</th></tr>
  <tr><td>状态</td><td>服务端保存会话，客户端只保存 Session ID</td><td>无状态，信息在 Token 中</td></tr>
  <tr><td>扩展性</td><td>多实例需要共享存储，如 Redis</td><td>服务端易水平扩展</td></tr>
  <tr><td>注销与失效</td><td>删除服务端会话即可</td><td>签发后难以主动失效</td></tr>
  <tr><td>适用场景</td><td>传统 Web</td><td>移动端、API、微服务</td></tr>
</table>
<p>JWT 由 <code>Header.Payload.Signature</code> 组成，使用 Base64URL 编码。<b>Payload 未加密</b>，不能存放敏感信息。</p>` },
    { p: 3, q: 'JWT 如何续期和主动失效？', a: `
<ul>
  <li><b>双 Token：</b>短期 Access Token（如 15 分钟）+ 长期 Refresh Token；Access Token 过期后用 Refresh Token 换取新的 Token。</li>
  <li><b>Refresh Token 轮换：</b>每次刷新都签发新的 Refresh Token，并使旧 Token 失效；检测到旧 Token 被重复使用时，判定为泄露并注销整个会话。</li>
  <li><b>主动失效：</b>Redis 维护 <code>jti</code> 黑名单；或在用户表维护 token version，修改密码或注销时版本号加一。</li>
  <li>Web 端可将 Refresh Token 放入 <code>HttpOnly + Secure + SameSite</code> Cookie；移动端存入 Android Keystore / iOS Keychain。</li>
</ul>` },
    { p: 2, q: 'OAuth 2.0 授权码流程和 PKCE？', a: `
<ol>
  <li>客户端将用户重定向到授权服务器，携带 <code>client_id</code>、<code>redirect_uri</code>、<code>scope</code>、<code>state</code>，以及 PKCE 的 <code>code_challenge</code>。</li>
  <li>用户登录并同意授权，授权服务器重定向回客户端，并返回授权码 <code>code</code>。</li>
  <li>客户端使用 <code>code</code> 和 <code>code_verifier</code> 向令牌接口换取 Access Token。</li>
  <li>授权服务器校验 <code>SHA256(code_verifier)</code> 是否与 <code>code_challenge</code> 一致。</li>
</ol>
<ul>
  <li><b>PKCE</b> 防止授权码被拦截后被他人使用，是移动端和 SPA 等公共客户端的必选项。</li>
  <li><code>state</code> 用于防止 CSRF。</li>
  <li>OAuth 解决授权问题；需要身份认证时使用基于 OAuth 的 OpenID Connect（ID Token）。</li>
</ul>` },
    { p: 2, q: '如何设计 RBAC 权限模型？', a: `
<ul>
  <li>核心关系：<b>用户 ↔ 角色 ↔ 权限</b>，均为多对多。</li>
  <li>表结构：<code>users</code>、<code>roles</code>、<code>permissions</code>、<code>user_roles</code>、<code>role_permissions</code>。</li>
  <li>权限粒度：菜单、按钮、接口，例如 <code>order:refund</code>。</li>
  <li>网关或中间件统一校验接口权限；数据权限需在查询条件中额外控制。</li>
  <li>更复杂的规则可使用 ABAC（基于属性的访问控制）。</li>
</ul>` },
    { p: 2, q: '大文件上传如何设计？', a: `
<ul>
  <li><b>分片上传：</b>前端按固定大小（如 5MB）切片，并发上传。</li>
  <li><b>秒传：</b>先计算文件哈希，服务端已存在相同文件时直接返回。</li>
  <li><b>断点续传：</b>服务端记录已上传分片，客户端只上传缺失部分。</li>
  <li><b>合并：</b>全部分片上传完成后由服务端合并，并校验哈希。</li>
  <li><b>直传对象存储：</b>服务端签发预签名 URL，客户端直接上传到 S3 / OSS，减轻应用服务器带宽压力。</li>
  <li>安全：限制文件大小和类型，检查文件内容，必要时进行病毒扫描。</li>
</ul>` },
  ]
},
{
  id: 'spring', title: 'Kotlin / Spring Boot / JVM', note: '方案 A：可复用 Kotlin 能力',
  items: [
    { p: 3, q: '什么是 IoC 和依赖注入？', a: `
<ul>
  <li><b>IoC（控制反转）：</b>对象的创建和依赖关系由容器管理，而不是由对象自己 new。</li>
  <li><b>DI（依赖注入）</b>是 IoC 的实现方式：构造器注入（推荐）、Setter 注入、字段注入。</li>
  <li>好处：解耦、便于替换实现和单元测试 Mock。</li>
  <li>推荐构造器注入：依赖不可变、必需依赖明确、便于测试；Kotlin 主构造函数写起来很自然。</li>
</ul>
<div class="tip">可以类比 Dagger / Hilt / Koin：Spring 主要在运行时通过反射和代理完成，Dagger 在编译期生成代码。</div>` },
    { p: 2, q: 'Spring Bean 的生命周期和作用域？', a: `
<ol>
  <li>实例化。</li>
  <li>属性填充，即依赖注入。</li>
  <li>Aware 回调，如 <code>BeanNameAware</code>。</li>
  <li><code>BeanPostProcessor</code> 前置处理。</li>
  <li>初始化：<code>@PostConstruct</code> → <code>afterPropertiesSet</code> → 自定义 init 方法。</li>
  <li><code>BeanPostProcessor</code> 后置处理，<b>AOP 代理通常在这一步创建</b>。</li>
  <li>使用。</li>
  <li>销毁：<code>@PreDestroy</code> → <code>destroy</code>。</li>
</ol>
<p>作用域：<code>singleton</code>（默认）、<code>prototype</code>、<code>request</code>、<code>session</code>。单例 Bean 应保持无状态，以确保线程安全。</p>` },
    { p: 3, q: 'Spring AOP 的原理？', a: `
<ul>
  <li>通过<b>动态代理</b>在方法调用前后织入横切逻辑，例如事务、日志、权限、监控。</li>
  <li><b>JDK 动态代理：</b>基于接口。<b>CGLIB：</b>通过生成子类代理，Spring Boot 默认使用。</li>
  <li>核心概念：切面（Aspect）、切点（Pointcut）、通知（Before / After / Around）、连接点。</li>
  <li><b>同类内部方法自调用不会经过代理</b>，因此 AOP 和事务都会失效。</li>
</ul>` },
    { p: 3, q: '@Transactional 的传播行为有哪些？什么情况下会失效？', a: `
<p><b>常用传播行为：</b></p>
<ul>
  <li><code>REQUIRED</code>（默认）：有事务就加入，没有就新建。</li>
  <li><code>REQUIRES_NEW</code>：挂起当前事务并新建独立事务，例如记录操作日志。</li>
  <li><code>NESTED</code>：嵌套事务，基于保存点，可以单独回滚。</li>
  <li>其他：<code>SUPPORTS</code>、<code>NOT_SUPPORTED</code>、<code>MANDATORY</code>、<code>NEVER</code>。</li>
</ul>
<p><b>常见失效场景：</b></p>
<ul>
  <li>同类方法自调用，没有经过代理。</li>
  <li>方法不可被代理，例如 private 或 final 方法（Kotlin 类默认 final，需要使用 <code>kotlin-spring</code> 插件开放）。</li>
  <li>异常被 catch 吞掉，没有继续抛出。</li>
  <li>默认只对 RuntimeException 和 Error 回滚，受检异常需要设置 <code>rollbackFor</code>。</li>
  <li>类未被 Spring 管理；数据库引擎不支持事务；在新线程中执行。</li>
</ul>` },
    { p: 2, q: 'Spring Boot 自动配置原理？', a: `
<ul>
  <li><code>@SpringBootApplication</code> 包含 <code>@Configuration</code>、<code>@EnableAutoConfiguration</code>、<code>@ComponentScan</code>。</li>
  <li>启动时读取依赖中声明的自动配置类：Boot 3 使用 <code>META-INF/spring/...AutoConfiguration.imports</code>，Boot 2 使用 <code>spring.factories</code>。</li>
  <li>配合条件注解按需生效：<code>@ConditionalOnClass</code>、<code>@ConditionalOnMissingBean</code>、<code>@ConditionalOnProperty</code>。</li>
  <li>用户自定义 Bean 会优先于默认配置；配置项通过 <code>@ConfigurationProperties</code> 绑定。</li>
</ul>` },
    { p: 2, q: 'Spring MVC 的请求处理流程？', a: `
<ol>
  <li>请求进入 <code>DispatcherServlet</code>。</li>
  <li><code>HandlerMapping</code> 找到对应的 Controller 方法。</li>
  <li>执行拦截器 <code>preHandle</code>。</li>
  <li><code>HandlerAdapter</code> 调用方法，完成参数解析和校验。</li>
  <li>返回值经过 <code>HttpMessageConverter</code> 转换为 JSON。</li>
  <li>执行 <code>postHandle</code> 和 <code>afterCompletion</code>。</li>
  <li>出现异常时由 <code>@RestControllerAdvice</code> 统一处理。</li>
</ol>
<p>在 Servlet 之前还有 Filter，例如 Spring Security 的过滤器链。</p>` },
    { p: 2, q: 'JVM 内存结构和垃圾回收？', a: `
<ul>
  <li><b>线程共享：</b>堆（新生代 Eden + 两个 Survivor，老年代）、元空间（类元数据）。</li>
  <li><b>线程私有：</b>虚拟机栈、本地方法栈、程序计数器。</li>
  <li><b>判断对象存活：</b>可达性分析，从 GC Roots 出发。</li>
  <li><b>回收算法：</b>标记清除、复制（新生代）、标记整理（老年代）。</li>
  <li><b>收集器：</b>JDK 9 起默认 G1，按 Region 回收，可预测停顿；ZGC 适合超低延迟场景。</li>
  <li>排查工具：<code>jstat</code>、<code>jmap</code>、<code>jstack</code>、Arthas、GC 日志。</li>
</ul>` },
    { p: 3, q: '线程池的核心参数和执行流程？', a: `
<p><b>七个参数：</b>核心线程数、最大线程数、空闲存活时间、时间单位、任务队列、线程工厂、拒绝策略。</p>
<p><b>执行流程：</b>线程数小于核心数则创建核心线程 → 否则放入队列 → 队列满且线程数小于最大值则创建非核心线程 → 否则执行拒绝策略。</p>
<p><b>拒绝策略：</b><code>AbortPolicy</code>（抛异常，默认）、<code>CallerRunsPolicy</code>（调用方线程执行）、<code>DiscardPolicy</code>、<code>DiscardOldestPolicy</code>。</p>
<ul>
  <li>不推荐使用 <code>Executors</code> 的快捷方法，因为可能产生无界队列或无限线程，导致 OOM。</li>
  <li>CPU 密集型线程数约为 CPU 核数 + 1；IO 密集型可以更多，最终以压测为准。</li>
  <li>Java 21 的虚拟线程适合大量阻塞型 IO 任务。</li>
</ul>` },
    { p: 2, q: 'synchronized、volatile 和 ReentrantLock 的区别？', a: `
<ul>
  <li><b>volatile：</b>保证可见性和有序性（禁止指令重排），不保证原子性，适合状态标记。</li>
  <li><b>synchronized：</b>基于对象监视器，保证原子性、可见性和有序性；JVM 会进行锁升级（无锁 → 轻量级锁 → 重量级锁）。</li>
  <li><b>ReentrantLock：</b>支持可中断、超时获取、公平锁和多个 Condition，但必须在 finally 中手动释放。</li>
  <li><b>CAS：</b>无锁原子操作，例如 <code>AtomicInteger</code>；存在 ABA 问题，可以通过版本号解决。</li>
</ul>` },
    { p: 1, q: 'Spring 如何解决循环依赖？', a: `
<ul>
  <li>对单例 Bean 的 Setter 或字段注入，使用<b>三级缓存</b>：完整 Bean、早期 Bean 引用、Bean 工厂（用于需要时提前创建代理）。</li>
  <li>构造器注入的循环依赖无法解决。</li>
  <li>Spring Boot 2.6 起默认禁止循环依赖，因为它通常代表设计问题，应通过拆分职责或引入事件机制解决。</li>
</ul>` },
  ]
},
{
  id: 'node', title: 'Node.js / NestJS', note: '方案 B：TypeScript 全栈',
  items: [
    { p: 3, q: 'Node.js 的事件循环和浏览器有什么区别？', a: `
<p>Node 基于 libuv，事件循环分为六个阶段：</p>
<ol>
  <li><b>timers：</b>执行 <code>setTimeout / setInterval</code> 回调。</li>
  <li><b>pending callbacks：</b>部分系统操作回调。</li>
  <li><b>idle / prepare：</b>内部使用。</li>
  <li><b>poll：</b>获取新的 I/O 事件并执行回调。</li>
  <li><b>check：</b>执行 <code>setImmediate</code>。</li>
  <li><b>close callbacks：</b>关闭事件回调。</li>
</ol>
<ul>
  <li><code>process.nextTick</code> 优先级高于 Promise 微任务。</li>
  <li>Node 11 起，每个回调执行后都会清空微任务，与浏览器行为一致。</li>
  <li>在 I/O 回调中，<code>setImmediate</code> 一定先于 <code>setTimeout(0)</code>。</li>
</ul>` },
    { p: 2, q: 'Node.js 单线程如何处理 CPU 密集型任务？', a: `
<ul>
  <li>JS 执行是单线程，I/O 由 libuv 线程池和操作系统异步处理，因此适合高并发 I/O。</li>
  <li>CPU 密集任务会阻塞事件循环，导致所有请求变慢。</li>
  <li><b>解决：</b>使用 <code>worker_threads</code>；将任务拆分到独立服务或消息队列中异步处理；使用 <code>cluster</code> 或 PM2 多进程利用多核。</li>
</ul>` },
    { p: 2, q: 'Express 和 Koa 的中间件模型有什么区别？', a: `
<ul>
  <li><b>Express：</b>线性中间件，通过 <code>next()</code> 传递，后置逻辑处理不够直观。</li>
  <li><b>Koa：</b>洋葱模型，基于 async/await，<code>await next()</code> 之后的代码会在下游执行完毕后回到当前中间件执行，适合计时、统一异常处理和响应包装。</li>
</ul>
<pre><code>app.use(async (ctx, next) =&gt; {
  const start = Date.now();
  await next();
  ctx.set('X-Response-Time', (Date.now() - start) + 'ms');
});</code></pre>` },
    { p: 2, q: 'NestJS 的核心概念和请求生命周期？', a: `
<ul>
  <li>Module 组织代码，Controller 处理路由，Provider / Service 承载业务，并通过依赖注入组合。</li>
  <li><b>请求顺序：</b>Middleware → Guard（鉴权）→ Interceptor 前置 → Pipe（参数校验与转换）→ Controller → Service → Interceptor 后置 → Exception Filter（异常处理）。</li>
  <li>整体风格接近 Spring Boot，Android 开发者也容易理解其 DI 和分层结构。</li>
</ul>` },
    { p: 1, q: 'Node.js Stream 的作用？', a: `
<ul>
  <li>以数据块形式流式处理数据，避免一次性将大文件读入内存。</li>
  <li>类型：Readable、Writable、Duplex、Transform。</li>
  <li><code>pipeline</code> 可以组合多个流，并正确处理错误和背压。</li>
  <li>适用场景：大文件下载、日志处理、上传代理、压缩。</li>
</ul>` },
  ]
},
{
  id: 'db', title: '数据库（MySQL / PostgreSQL）', note: '后端必考',
  items: [
    { p: 2, q: '数据库三大范式是什么？什么时候需要反范式？', a: `
<ul>
  <li><b>第一范式：</b>字段具有原子性，不可再分。</li>
  <li><b>第二范式：</b>非主键字段完全依赖于整个主键，而不是部分主键。</li>
  <li><b>第三范式：</b>非主键字段不依赖其他非主键字段，消除传递依赖。</li>
  <li><b>反范式：</b>为了减少高频联表查询，冗余存储部分字段，例如订单中保存下单时的商品名称和价格快照。代价是需要维护数据一致性。</li>
</ul>` },
    { p: 3, q: '为什么数据库索引使用 B+ 树？', a: `
<ul>
  <li>非叶子节点只存储键，单个节点可容纳更多索引项，树更矮。千万级数据通常只需 3～4 层，磁盘 IO 少。</li>
  <li>所有数据都在叶子节点，查询路径长度稳定。</li>
  <li>叶子节点通过链表连接，适合范围查询和排序。</li>
  <li><b>对比：</b>哈希索引不支持范围查询；二叉树或红黑树层级太高；B 树非叶子节点也存数据，扇出更小，范围查询需要中序遍历。</li>
</ul>` },
    { p: 3, q: '聚簇索引、二级索引、回表和覆盖索引？', a: `
<ul>
  <li><b>聚簇索引：</b>InnoDB 中主键索引的叶子节点存储完整行数据，一张表只有一个。</li>
  <li><b>二级索引：</b>叶子节点存储索引列和主键值。</li>
  <li><b>回表：</b>通过二级索引找到主键后，再回到聚簇索引查询完整数据。</li>
  <li><b>覆盖索引：</b>查询的列都在索引中，无需回表；EXPLAIN 中 Extra 显示 <code>Using index</code>。</li>
  <li>主键建议使用自增或趋势递增值，避免随机插入导致页分裂。</li>
</ul>` },
    { p: 3, q: '联合索引和最左前缀原则？', a: `
<ul>
  <li>联合索引 <code>(a, b, c)</code> 按 a、b、c 的顺序排序。</li>
  <li>可以使用索引：<code>a</code>、<code>a, b</code>、<code>a, b, c</code>；优化器会自动调整 WHERE 条件顺序。</li>
  <li>通常无法有效使用：只有 <code>b</code> 或 <code>b, c</code>。</li>
  <li><code>a = 1 AND b &gt; 2 AND c = 3</code>：a 和 b 可以使用索引，c 不能用于范围后的索引查找（可通过索引下推减少回表）。</li>
  <li>设计原则：高频查询字段和区分度高的字段放前面，同时考虑排序和覆盖索引。</li>
</ul>` },
    { p: 3, q: '哪些情况会导致索引失效？', a: `
<ul>
  <li>对索引列使用函数或计算：<code>WHERE DATE(created_at) = ...</code>。</li>
  <li>隐式类型转换：字符串字段用数字比较。</li>
  <li>前导模糊查询：<code>LIKE '%abc'</code>。</li>
  <li>不满足最左前缀原则。</li>
  <li><code>OR</code> 条件中有未建立索引的列。</li>
  <li><code>!=</code>、<code>NOT IN</code>、<code>IS NOT NULL</code> 等可能不使用索引。</li>
  <li>区分度低或数据量小，优化器认为全表扫描更快。</li>
</ul>` },
    { p: 3, q: '事务的 ACID 是什么？', a: `
<ul>
  <li><b>原子性：</b>事务要么全部成功，要么全部回滚，依靠 undo log。</li>
  <li><b>一致性：</b>事务前后数据满足约束，是最终目标。</li>
  <li><b>隔离性：</b>并发事务之间互不干扰，依靠锁和 MVCC。</li>
  <li><b>持久性：</b>提交后数据不丢失，依靠 redo log 和 WAL。</li>
</ul>` },
    { p: 3, q: '事务隔离级别及其解决的问题？', a: `
<table>
  <tr><th>隔离级别</th><th>脏读</th><th>不可重复读</th><th>幻读</th></tr>
  <tr><td>读未提交</td><td>可能</td><td>可能</td><td>可能</td></tr>
  <tr><td>读已提交（PostgreSQL 默认）</td><td>避免</td><td>可能</td><td>可能</td></tr>
  <tr><td>可重复读（MySQL 默认）</td><td>避免</td><td>避免</td><td>标准中可能</td></tr>
  <tr><td>串行化</td><td>避免</td><td>避免</td><td>避免</td></tr>
</table>
<ul>
  <li><b>脏读：</b>读到其他事务未提交的数据。</li>
  <li><b>不可重复读：</b>同一事务两次读取同一行，结果不同。</li>
  <li><b>幻读：</b>同一范围查询两次，行数不同。</li>
  <li>InnoDB 在可重复读下通过 MVCC（快照读）和临键锁（当前读）在很大程度上避免了幻读。</li>
</ul>` },
    { p: 3, q: 'MVCC 的原理？', a: `
<ul>
  <li>每行包含隐藏字段：最近修改它的事务 ID、指向 undo log 的回滚指针。</li>
  <li>多次修改通过 undo log 形成<b>版本链</b>。</li>
  <li><b>ReadView</b> 记录创建时的活跃事务列表、最小活跃事务 ID、下一个将分配的事务 ID 和当前事务 ID，用于判断版本链中的哪个版本可见。</li>
  <li><b>读已提交：</b>每条 SELECT 创建新的 ReadView。<b>可重复读：</b>事务中第一次读取时创建，之后复用。</li>
  <li>作用：读不加锁，读写不阻塞，提高并发性能。</li>
</ul>` },
    { p: 2, q: '数据库有哪些锁？如何避免死锁？', a: `
<ul>
  <li><b>粒度：</b>表锁、行锁；InnoDB 行锁加在索引上，没有命中索引可能锁住大量数据。</li>
  <li><b>类型：</b>共享锁（S）、排他锁（X）、意向锁；记录锁、间隙锁、临键锁。</li>
  <li><b>乐观锁：</b>使用版本号，适合读多写少；<b>悲观锁：</b><code>SELECT ... FOR UPDATE</code>，适合冲突频繁。</li>
  <li><b>死锁：</b>InnoDB 会自动检测并回滚代价较小的事务。</li>
  <li><b>避免：</b>按固定顺序访问资源、缩短事务、确保查询命中索引、降低隔离级别、业务层重试。</li>
</ul>` },
    { p: 3, q: '如何定位和优化慢查询？', a: `
<ol>
  <li>开启慢查询日志，或使用 APM 找出慢 SQL。</li>
  <li>使用 <code>EXPLAIN</code> 分析执行计划：
    <ul>
      <li><code>type</code>：从好到差为 const &gt; eq_ref &gt; ref &gt; range &gt; index &gt; ALL。</li>
      <li><code>key</code>：实际使用的索引；<code>rows</code>：预估扫描行数。</li>
      <li><code>Extra</code>：<code>Using filesort</code>、<code>Using temporary</code> 通常需要优化。</li>
    </ul>
  </li>
  <li><b>优化手段：</b>添加或调整索引、使用覆盖索引、避免 <code>SELECT *</code>、改写子查询、优化深分页、拆分大事务、读写分离或引入缓存。</li>
</ol>` },
    { p: 2, q: '深分页如何优化？', a: `
<ul>
  <li><code>LIMIT 1000000, 10</code> 需要扫描并丢弃前 100 万行，性能很差。</li>
  <li><b>游标分页：</b><code>WHERE id &gt; :lastId ORDER BY id LIMIT 10</code>。</li>
  <li><b>延迟关联：</b>先通过覆盖索引查询主键，再关联完整数据：</li>
</ul>
<pre><code>SELECT o.* FROM orders o
JOIN (
  SELECT id FROM orders
  WHERE user_id = 42
  ORDER BY id
  LIMIT 1000000, 10
) t ON o.id = t.id;</code></pre>
<p>产品层面也可以限制最大可翻页数。</p>` },
    { p: 3, q: '手写 SQL：查询每个部门工资最高的前三名员工。', a: `
<pre><code>SELECT dept_id, name, salary
FROM (
  SELECT dept_id, name, salary,
         DENSE_RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rk
  FROM employee
) t
WHERE rk &lt;= 3;</code></pre>
<ul>
  <li><code>ROW_NUMBER</code>：连续编号，不处理并列。</li>
  <li><code>RANK</code>：并列后跳号，如 1、1、3。</li>
  <li><code>DENSE_RANK</code>：并列后不跳号，如 1、1、2。</li>
</ul>
<p>相关基础：<code>WHERE</code> 在分组前过滤，<code>HAVING</code> 在分组后过滤：</p>
<pre><code>SELECT dept_id, COUNT(*) AS cnt, AVG(salary) AS avg_salary
FROM employee
WHERE status = 'active'
GROUP BY dept_id
HAVING COUNT(*) &gt; 5;</code></pre>` },
    { p: 2, q: '读写分离和分库分表怎么做？', a: `
<ul>
  <li><b>读写分离：</b>主库写，从库读，通过 binlog 复制。问题是主从延迟，写后立即读的场景应强制读主库。</li>
  <li><b>垂直拆分：</b>按业务拆分数据库，或将宽表拆为多张表。</li>
  <li><b>水平拆分：</b>按 user_id 哈希或时间范围将数据分布到多张表、多个库。</li>
  <li><b>带来的问题：</b>跨库 JOIN、分布式事务、全局唯一 ID、跨分片分页与聚合、扩容迁移。</li>
  <li>原则：先通过索引、缓存、读写分离、归档历史数据解决；确实需要时再分库分表。</li>
</ul>` },
    { p: 1, q: 'MySQL 和 PostgreSQL 怎么选？', a: `
<ul>
  <li><b>MySQL：</b>互联网业务使用广泛，生态和运维经验丰富，简单读写性能好。</li>
  <li><b>PostgreSQL：</b>SQL 标准支持完善，JSONB、窗口函数、CTE、GIS、全文检索能力强，扩展丰富（如 pgvector 用于向量检索）。</li>
  <li>国内互联网公司多用 MySQL；创业公司和需要复杂查询的新项目越来越多选择 PostgreSQL。</li>
</ul>` },
  ]
},
{
  id: 'redis', title: 'Redis 与缓存', note: '',
  items: [
    { p: 2, q: 'Redis 为什么快？', a: `
<ul>
  <li>数据存储在内存中。</li>
  <li>高效的数据结构，如 SDS、跳表、哈希表、压缩列表 / listpack。</li>
  <li>命令执行使用单线程，避免锁竞争和线程上下文切换。</li>
  <li>使用 IO 多路复用（epoll）处理大量连接；Redis 6 起支持多线程处理网络 IO。</li>
</ul>` },
    { p: 3, q: 'Redis 的数据结构及使用场景？', a: `
<table>
  <tr><th>类型</th><th>场景</th></tr>
  <tr><td>String</td><td>缓存对象、计数器、分布式锁、Session</td></tr>
  <tr><td>Hash</td><td>存储对象字段，如用户信息、购物车</td></tr>
  <tr><td>List</td><td>简单消息队列、最新列表</td></tr>
  <tr><td>Set</td><td>去重、标签、共同关注（交集）</td></tr>
  <tr><td>ZSet</td><td>排行榜、延迟队列、按时间排序的浏览记录</td></tr>
  <tr><td>Bitmap / HyperLogLog</td><td>签到统计 / UV 估算</td></tr>
  <tr><td>Stream</td><td>具备消费组的消息队列</td></tr>
</table>` },
    { p: 3, q: '缓存穿透、击穿、雪崩分别是什么？如何解决？', a: `
<table>
  <tr><th>问题</th><th>原因</th><th>解决方案</th></tr>
  <tr><td>穿透</td><td>查询不存在的数据，缓存和数据库都没有，请求全部打到数据库</td><td>缓存空值并设置短 TTL；布隆过滤器；参数校验</td></tr>
  <tr><td>击穿</td><td>某个热点 key 过期瞬间，大量请求打到数据库</td><td>互斥锁，只允许一个请求重建缓存；逻辑过期 + 异步刷新；热点数据不过期</td></tr>
  <tr><td>雪崩</td><td>大量 key 同时过期，或 Redis 宕机</td><td>TTL 加随机值；多级缓存；Redis 高可用集群；限流和降级</td></tr>
</table>` },
    { p: 3, q: '如何保证缓存和数据库的一致性？', a: `
<ul>
  <li><b>Cache-Aside 模式：</b>读时缓存未命中则查数据库并写入缓存；写时<b>先更新数据库，再删除缓存</b>。</li>
  <li><b>为什么删除而不是更新缓存：</b>避免并发写入顺序不同导致脏数据，也避免计算无人读取的缓存。</li>
  <li><b>为什么不先删除缓存：</b>删除后、更新数据库前，其他读请求可能把旧值重新写回缓存。</li>
  <li><b>增强方案：</b>
    <ul>
      <li>删除失败时通过消息队列重试。</li>
      <li>订阅 binlog（如 Canal）异步删除缓存。</li>
      <li>延迟双删。</li>
      <li>所有缓存都设置 TTL 作为兜底。</li>
    </ul>
  </li>
  <li>结论：缓存只能保证<b>最终一致</b>；要求强一致的数据，如余额，应直接读取数据库。</li>
</ul>` },
    { p: 2, q: 'Redis 的过期删除和内存淘汰策略？', a: `
<ul>
  <li><b>过期删除：</b>惰性删除（访问时检查）+ 定期删除（定时抽样清理）。</li>
  <li><b>内存淘汰策略：</b><code>noeviction</code>（默认，内存满时写入报错）、<code>allkeys-lru</code>、<code>volatile-lru</code>、<code>allkeys-lfu</code>、<code>volatile-ttl</code>、random 系列。</li>
  <li>纯缓存场景通常使用 <code>allkeys-lru</code> 或 <code>allkeys-lfu</code>。</li>
</ul>` },
    { p: 2, q: 'RDB 和 AOF 持久化的区别？', a: `
<ul>
  <li><b>RDB：</b>定时生成内存快照，通过 fork 子进程实现。文件小、恢复快，但可能丢失最近一段时间的数据。</li>
  <li><b>AOF：</b>记录每条写命令，通常每秒 fsync 一次，最多丢失约 1 秒数据。文件较大，需要 AOF 重写压缩。</li>
  <li><b>混合持久化（Redis 4.0+）：</b>AOF 重写时以 RDB 格式写入快照，后续追加增量命令，兼顾恢复速度和数据安全。</li>
</ul>` },
    { p: 2, q: '如何用 Redis 实现分布式锁？', a: `
<ul>
  <li>加锁：<code>SET lock:order:42 &lt;唯一值&gt; NX PX 30000</code>，必须原子地设置值和过期时间。</li>
  <li>解锁：使用 Lua 脚本比较值后删除，避免误删其他线程的锁：</li>
</ul>
<pre><code>if redis.call("get", KEYS[1]) == ARGV[1] then
  return redis.call("del", KEYS[1])
else
  return 0
end</code></pre>
<ul>
  <li>业务执行时间可能超过过期时间，可以使用看门狗自动续期（如 Redisson）。</li>
  <li>主从切换可能导致锁丢失。要求强一致时，可使用 ZooKeeper 或 etcd，并结合数据库约束兜底。</li>
</ul>` },
    { p: 1, q: '如何使用 ZSet 实现排行榜？', a: `
<ul>
  <li><code>ZINCRBY rank 10 user:1</code> 增加分数。</li>
  <li><code>ZREVRANGE rank 0 9 WITHSCORES</code> 获取前十名。</li>
  <li><code>ZREVRANK rank user:1</code> 查询用户排名。</li>
  <li>同分时按时间排序，可以将时间编码到分数的小数位中。</li>
  <li>ZSet 底层使用跳表 + 哈希表，按分数范围查询的时间复杂度为 O(log N + M)。</li>
</ul>` },
  ]
},
{
  id: 'dist', title: '分布式与中间件', note: '',
  items: [
    { p: 2, q: '消息队列有什么作用？会引入哪些问题？', a: `
<ul>
  <li><b>作用：</b>异步处理（如下单后发送通知）、系统解耦、削峰填谷（如秒杀）。</li>
  <li><b>带来的问题：</b>系统复杂度增加、消息丢失、重复消费、消息积压、顺序性、最终一致性。</li>
</ul>` },
    { p: 2, q: '如何处理消息丢失、重复消费和顺序消费？', a: `
<ul>
  <li><b>防止丢失：</b>
    <ul>
      <li>生产端：发送确认，失败重试。</li>
      <li>Broker：持久化、多副本，如 Kafka <code>acks=all</code>。</li>
      <li>消费端：业务处理成功后再手动确认或提交 offset。</li>
    </ul>
  </li>
  <li><b>重复消费：</b>至少一次投递无法避免重复，因此消费端要幂等，例如使用唯一业务 ID 去重表、数据库唯一约束、状态机。</li>
  <li><b>顺序消费：</b>需要有序的消息使用相同的分区键，如订单 ID，进入同一分区或队列，并由单线程消费。</li>
  <li><b>消息积压：</b>增加消费者和分区、优化消费逻辑、临时扩容转发。</li>
</ul>` },
    { p: 2, q: 'Kafka 和 RabbitMQ 的区别？', a: `
<table>
  <tr><th></th><th>Kafka</th><th>RabbitMQ</th></tr>
  <tr><td>模型</td><td>分布式日志，按分区顺序存储</td><td>AMQP，Exchange 灵活路由到队列</td></tr>
  <tr><td>吞吐量</td><td>极高</td><td>中高</td></tr>
  <tr><td>消息重放</td><td>支持，可按 offset 回溯</td><td>消费确认后通常删除</td></tr>
  <tr><td>适用场景</td><td>日志采集、事件流、大数据管道</td><td>业务消息、复杂路由、延迟队列、死信队列</td></tr>
</table>` },
    { p: 2, q: 'CAP 和 BASE 理论？', a: `
<ul>
  <li><b>CAP：</b>一致性、可用性、分区容错性。分布式系统必须容忍网络分区，因此发生分区时只能在 C 和 A 之间取舍。
    <ul>
      <li>CP：ZooKeeper、etcd。</li>
      <li>AP：Eureka、Cassandra。</li>
    </ul>
  </li>
  <li><b>BASE：</b>基本可用、软状态、最终一致性，是大多数互联网业务的选择。</li>
</ul>` },
    { p: 2, q: '分布式事务有哪些方案？', a: `
<ul>
  <li><b>2PC / XA：</b>强一致，但存在同步阻塞和协调者单点问题，性能较差。</li>
  <li><b>TCC：</b>Try 预留资源、Confirm 确认、Cancel 取消，对业务侵入较大，需要处理空回滚和悬挂。</li>
  <li><b>本地消息表 / Outbox：</b>业务数据和消息在同一个本地事务中写入，再由后台任务可靠投递，最终一致，最常用。</li>
  <li><b>Saga：</b>将长事务拆分为多个本地事务，失败时执行反向补偿。</li>
  <li><b>事务消息：</b>如 RocketMQ 的半消息机制。</li>
  <li>原则：能避免分布式事务就避免；大多数场景使用最终一致性方案。</li>
</ul>` },
    { p: 2, q: '常见限流算法有哪些？', a: `
<table>
  <tr><th>算法</th><th>特点</th></tr>
  <tr><td>固定窗口</td><td>实现简单，窗口边界可能出现两倍流量突发</td></tr>
  <tr><td>滑动窗口</td><td>按更细时间片统计，更加平滑</td></tr>
  <tr><td>漏桶</td><td>以恒定速率处理请求，削平突发流量</td></tr>
  <tr><td>令牌桶</td><td>按固定速率生成令牌，允许一定程度的突发，最常用</td></tr>
</table>
<p>单机可以使用 Guava RateLimiter；分布式场景可以使用 Redis + Lua 原子计数，或在网关层（如 Nginx、Sentinel）统一限流。超限返回 429，并设置 <code>Retry-After</code>。</p>` },
    { p: 2, q: '熔断和降级是什么？', a: `
<ul>
  <li><b>熔断：</b>下游错误率或超时率超过阈值时，熔断器打开并快速失败，防止故障扩散；经过一段时间进入半开状态，探测恢复后再关闭。</li>
  <li><b>降级：</b>在系统压力过大或依赖故障时，返回默认值、缓存数据，或暂时关闭非核心功能。</li>
  <li>常用工具：Resilience4j、Sentinel。</li>
  <li>还应配合超时控制、带退避的重试和隔离（舱壁模式）。</li>
</ul>
<div class="tip">可以结合 eBay 能效标签项目：通过远程配置灰度放量，并在异常时降级处理。</div>` },
    { p: 1, q: '如何生成分布式唯一 ID？', a: `
<ul>
  <li><b>UUID：</b>简单，但无序且较长，作为 InnoDB 主键会导致页分裂；可以考虑有序的 UUIDv7。</li>
  <li><b>数据库自增 / 号段模式：</b>批量获取一段 ID，如美团 Leaf。</li>
  <li><b>雪花算法：</b>1 位符号位 + 41 位时间戳 + 10 位机器 ID + 12 位序列号，趋势递增；需要处理时钟回拨问题。</li>
</ul>` },
  ]
},
{
  id: 'devops', title: '部署与运维', note: '',
  items: [
    { p: 3, q: 'Docker 镜像和容器的区别？如何编写多阶段构建？', a: `
<ul>
  <li><b>镜像：</b>只读模板，由多层文件系统组成。<b>容器：</b>镜像的运行实例，在镜像上增加可写层。</li>
  <li>多阶段构建：在构建阶段编译，运行阶段只复制产物，减小镜像体积并降低安全风险。</li>
</ul>
<pre><code>FROM gradle:8-jdk21 AS build
WORKDIR /app
COPY . .
RUN gradle bootJar --no-daemon

FROM eclipse-temurin:21-jre
WORKDIR /app
COPY --from=build /app/build/libs/*.jar app.jar
EXPOSE 8080
ENTRYPOINT ["java", "-jar", "app.jar"]</code></pre>
<p>优化：利用层缓存，先复制依赖文件再复制源码；使用 <code>.dockerignore</code>；使用非 root 用户运行。</p>` },
    { p: 2, q: '容器和虚拟机的区别？', a: `
<ul>
  <li><b>虚拟机：</b>每台虚拟机运行完整的操作系统，隔离性强，但资源开销大、启动慢。</li>
  <li><b>容器：</b>共享宿主机内核，通过 Namespace 隔离、Cgroups 限制资源；轻量、秒级启动，但隔离性弱于虚拟机。</li>
</ul>` },
    { p: 3, q: 'CI/CD 流程如何设计？', a: `
<ul>
  <li><b>CI：</b>代码提交 → 安装依赖 → Lint → 单元测试 → 构建 → 安全扫描 → 构建并推送镜像。</li>
  <li><b>CD：</b>部署到测试环境 → 自动化测试 → 人工审批 → 生产环境灰度发布 → 监控 → 必要时回滚。</li>
</ul>
<pre><code># .github/workflows/ci.yml
name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew test bootJar</code></pre>
<p>密钥存放在 CI 平台的 Secrets 中，不能提交到代码仓库。</p>` },
    { p: 3, q: 'Nginx 的反向代理和负载均衡如何配置？', a: `
<pre><code>upstream api_servers {
  server 10.0.0.1:8080;
  server 10.0.0.2:8080;
}

server {
  listen 443 ssl;
  server_name example.com;

  location / {
    root /var/www/web;
    try_files $uri /index.html;   # SPA 路由回退
  }

  location /api/ {
    proxy_pass http://api_servers;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}</code></pre>
<ul>
  <li>负载均衡策略：轮询（默认）、权重、<code>ip_hash</code>、<code>least_conn</code>。</li>
  <li>常见用途：静态资源服务、HTTPS 终止、Gzip 压缩、限流、同域部署解决跨域。</li>
</ul>` },
    { p: 2, q: 'Kubernetes 的核心对象有哪些？', a: `
<ul>
  <li><b>Pod：</b>最小调度单元，包含一个或多个容器。</li>
  <li><b>Deployment：</b>管理无状态应用的副本数和滚动更新。</li>
  <li><b>Service：</b>为一组 Pod 提供稳定访问入口和负载均衡（ClusterIP / NodePort / LoadBalancer）。</li>
  <li><b>Ingress：</b>HTTP 路由入口。</li>
  <li><b>ConfigMap / Secret：</b>配置和敏感信息。</li>
  <li><b>HPA：</b>根据 CPU 或自定义指标自动扩缩容。</li>
  <li><b>探针：</b>liveness 判断是否需要重启，readiness 判断是否可以接收流量。</li>
</ul>` },
    { p: 2, q: '常见的发布策略有哪些？', a: `
<ul>
  <li><b>滚动发布：</b>逐步替换实例，资源占用少，但新旧版本会同时存在。</li>
  <li><b>蓝绿发布：</b>准备一套完整的新环境，一次性切换流量，回滚快，但资源成本翻倍。</li>
  <li><b>金丝雀 / 灰度发布：</b>先将少量流量（如 5%）切到新版本，观察指标后逐步放量。</li>
  <li><b>Feature Flag：</b>代码已经上线，但功能开关单独控制，可以快速关闭。</li>
</ul>
<div class="tip">这与移动端的分批发布、远程配置灰度经验相通，可以结合 eBay 项目说明。</div>` },
    { p: 2, q: '可观测性包括什么？', a: `
<ul>
  <li><b>日志：</b>结构化日志 + Trace ID，可以使用 ELK 或 Loki。</li>
  <li><b>指标：</b>Prometheus + Grafana；常用 RED 方法（请求速率、错误率、耗时）和 USE 方法（资源使用率、饱和度、错误）。</li>
  <li><b>链路追踪：</b>OpenTelemetry + Jaeger / Tempo，定位跨服务调用的耗时。</li>
  <li><b>告警：</b>基于 SLO 设置告警，避免告警过多。</li>
</ul>` },
  ]
},
{
  id: 'design', title: '系统设计', note: '含基于你经历的定制题',
  items: [
    { p: 3, q: '系统设计题的答题框架？', a: `
<ol>
  <li><b>澄清需求：</b>核心功能、用户规模、读写比例、延迟和一致性要求。</li>
  <li><b>容量估算：</b>QPS、存储量、带宽。</li>
  <li><b>API 设计：</b>列出核心接口。</li>
  <li><b>数据模型：</b>表结构、存储选型、索引。</li>
  <li><b>整体架构：</b>客户端 → CDN → 网关 / 负载均衡 → 服务 → 缓存 / 数据库 / 消息队列。</li>
  <li><b>深入关键点：</b>热点、扩展性、一致性、容错。</li>
  <li><b>总结取舍：</b>说明瓶颈、监控和后续演进方向。</li>
</ol>
<div class="tip">面试中不要一开始就画复杂架构。先确认需求，再从简单方案逐步演进。</div>` },
    { p: 3, q: '设计一个短链接系统。', a: `
<ul>
  <li><b>API：</b><code>POST /links</code> 创建短链接；<code>GET /{code}</code> 重定向。</li>
  <li><b>短码生成：</b>
    <ul>
      <li>使用发号器或雪花算法生成唯一 ID，再转为 Base62。7 位 Base62 约有 3.5 万亿种组合。</li>
      <li>或对长链接哈希后截取，冲突时重试。</li>
    </ul>
  </li>
  <li><b>存储：</b>表 <code>(code PK, long_url, user_id, expire_at, created_at)</code>；同一长链接需要去重时，对 long_url 的哈希建立索引。</li>
  <li><b>读多写少：</b>Redis 缓存热点短码，CDN 或边缘节点加速。</li>
  <li><b>301 还是 302：</b>301 会被浏览器缓存，减少服务器压力，但无法统计每次点击；需要统计时使用 302。</li>
  <li><b>访问统计：</b>通过消息队列异步写入分析系统。</li>
  <li><b>安全：</b>创建接口限流、恶意链接检测。</li>
</ul>` },
    { p: 2, q: '设计一个分布式限流器。', a: `
<ul>
  <li><b>维度：</b>按用户、IP、接口、应用 Key 限流。</li>
  <li><b>算法：</b>令牌桶，允许适度突发。</li>
  <li><b>实现：</b>Redis 存储每个 key 的令牌数和上次刷新时间，使用 Lua 脚本原子执行补充令牌和扣减。</li>
  <li><b>部署位置：</b>优先放在 API 网关，业务服务内部可以再做细粒度限流。</li>
  <li><b>返回：</b>超限返回 429，并带上 <code>Retry-After</code> 和剩余配额。</li>
  <li><b>容错：</b>Redis 不可用时降级为本地限流，避免整体不可用。</li>
  <li>规则配置中心化，支持动态调整。</li>
</ul>` },
    { p: 2, q: '设计一个 Feed 流（如关注动态）。', a: `
<ul>
  <li><b>推模式（写扩散）：</b>发布时写入所有粉丝的收件箱，读取快；但大 V 粉丝多时写入压力巨大。</li>
  <li><b>拉模式（读扩散）：</b>读取时拉取所有关注对象的内容并合并，写入简单；但关注数多时读取慢。</li>
  <li><b>推拉结合：</b>普通用户使用推模式；大 V 使用拉模式，读取时合并。</li>
  <li><b>存储：</b>每个用户的时间线存入 Redis ZSet（分数为时间戳），只保留最近 N 条；内容详情从缓存或数据库批量获取。</li>
  <li>分页使用 cursor；只给活跃用户推送，减少无效写入。</li>
</ul>` },
    { p: 2, q: '设计一个秒杀系统。', a: `
<ul>
  <li><b>前端：</b>页面静态化并放到 CDN、按钮防重复点击、答题或验证码分散请求。</li>
  <li><b>网关：</b>限流、黑名单、用户级频率限制。</li>
  <li><b>库存预扣：</b>库存预热到 Redis，使用 Lua 原子校验并扣减，同时记录用户是否已购买。</li>
  <li><b>异步下单：</b>扣减成功后发送消息，订单服务异步创建订单，前端轮询结果。</li>
  <li><b>数据库兜底：</b><code>UPDATE stock SET count = count - 1 WHERE id = ? AND count &gt; 0</code>，配合唯一约束防止重复购买。</li>
  <li><b>超时处理：</b>超时未支付则取消订单并归还库存（延迟队列）。</li>
  <li>秒杀服务独立部署，避免影响主业务。</li>
</ul>` },
    { p: 3, q: '【定制题】设计商品收藏（Watchlist）和最近浏览（Recently Viewed）系统。', a: `
<ul>
  <li><b>收藏：</b>
    <ul>
      <li>表 <code>watchlist(user_id, item_id, created_at)</code>，唯一索引 <code>(user_id, item_id)</code> 保证幂等。</li>
      <li>列表使用 cursor 分页，基于 <code>created_at, item_id</code>。</li>
      <li>商品被收藏数单独计数，异步更新。</li>
    </ul>
  </li>
  <li><b>最近浏览：</b>
    <ul>
      <li>写多读少，可以容忍少量丢失。Redis ZSet，key 为 <code>rv:{userId}</code>，分数为浏览时间。</li>
      <li>写入时 <code>ZADD</code> 后执行 <code>ZREMRANGEBYRANK</code>，只保留最近 100 条；重复浏览自动更新时间。</li>
      <li>通过消息队列异步持久化，用于跨设备同步和推荐。</li>
    </ul>
  </li>
  <li><b>商品信息聚合：</b>列表只存 item_id，读取时批量查询商品服务，或通过 GraphQL 聚合；能效标签等地区合规字段由商品服务按地区返回。</li>
  <li><b>客户端：</b>收藏使用乐观更新，失败回滚；离线时缓存，恢复网络后同步。</li>
  <li><b>新功能上线：</b>通过 Feature Flag 按地区灰度，并保留降级路径。</li>
</ul>
<div class="tip">回答时可以自然引出你在 eBay 做过 Watchlist、Recently Viewed 的能效标签集成，以及远程配置灰度。</div>` },
    { p: 3, q: '【定制题】设计一个 Feature Flag / 远程配置平台。', a: `
<ul>
  <li><b>数据模型：</b>flag key、环境、默认值、规则列表、版本号、负责人、修改记录。</li>
  <li><b>规则：</b>用户白名单、地区、App 版本、平台，以及按百分比放量。</li>
  <li><b>百分比放量：</b><code>hash(flagKey + userId) % 100 &lt; percentage</code>，保证同一用户结果稳定，放量时只增加新的命中用户。</li>
  <li><b>SDK：</b>
    <ul>
      <li>启动时拉取配置，并缓存到本地。</li>
      <li>评估在本地完成，不阻塞业务请求。</li>
      <li>拉取失败时使用本地缓存或代码中的默认值，保证可用性。</li>
    </ul>
  </li>
  <li><b>更新：</b>通过 SSE 或长轮询推送变更；服务端使用版本号做增量更新。</li>
  <li><b>治理：</b>操作审计、审批流程、紧急关闭开关；定期清理过期 Flag，避免技术债务。</li>
  <li><b>实验能力：</b>记录曝光事件，与业务指标关联，支持 A/B 测试。</li>
</ul>` },
    { p: 2, q: '【定制题】图片 AI 处理：端侧推理和云端推理怎么选？如何设计云端服务？', a: `
<table>
  <tr><th></th><th>端侧推理</th><th>云端推理</th></tr>
  <tr><td>隐私</td><td>图片不离开设备</td><td>需要上传，并处理合规问题</td></tr>
  <tr><td>成本</td><td>无服务器成本</td><td>GPU 成本高</td></tr>
  <tr><td>效果</td><td>受模型大小和设备性能限制</td><td>可使用大模型，效果稳定</td></tr>
  <tr><td>体验</td><td>离线可用，但会增加包体、耗电和发热</td><td>依赖网络，存在排队和传输延迟</td></tr>
</table>
<p><b>云端架构：</b></p>
<ol>
  <li>客户端申请预签名 URL，将图片直传对象存储。</li>
  <li>创建任务，返回 taskId；同一个请求使用幂等键。</li>
  <li>任务进入消息队列，GPU Worker 消费并处理，可以按负载自动扩缩容。</li>
  <li>结果写入对象存储，通过 CDN 分发。</li>
  <li>客户端通过轮询、WebSocket 或推送获取结果。</li>
  <li>原图和结果设置生命周期，到期自动删除；限制文件大小和请求频率。</li>
</ol>
<div class="tip">可以结合 OPC：你的应用选择端侧推理，是基于隐私、离线和零服务器成本的取舍；超分模型分块处理、大模型通过资源分发等也是很好的工程细节。</div>` },
  ]
},
{
  id: 'algo', title: '算法与手写代码', note: '建议刷 LeetCode Hot 100',
  items: [
    { p: 3, q: '算法题的准备策略和答题流程？', a: `
<ul>
  <li><b>按题型准备：</b>哈希、双指针、滑动窗口、链表、栈、二叉树、二分、BFS / DFS、回溯、动态规划、堆。</li>
  <li><b>答题流程：</b>
    <ol>
      <li>复述题目，确认输入范围和边界条件。</li>
      <li>先说暴力解法及复杂度。</li>
      <li>再提出优化思路，与面试官确认后再编码。</li>
      <li>编码后使用示例和边界用例验证。</li>

    </ol>
  </li>
  <li>全程边想边说，面试官更看重思路和沟通。</li>
</ul>` },
    { p: 3, q: '两数之和（哈希表）。', a: `
<pre><code>function twoSum(nums, target) {
  const map = new Map();          // 值 -&gt; 下标
  for (let i = 0; i &lt; nums.length; i++) {
    const need = target - nums[i];
    if (map.has(need)) return [map.get(need), i];
    map.set(nums[i], i);
  }
  return [];
}
// 时间 O(n)，空间 O(n)</code></pre>` },
    { p: 3, q: '无重复字符的最长子串（滑动窗口）。', a: `
<pre><code>function lengthOfLongestSubstring(s) {
  const last = new Map();         // 字符 -&gt; 最后出现的位置
  let left = 0, best = 0;
  for (let right = 0; right &lt; s.length; right++) {
    const ch = s[right];
    if (last.has(ch) &amp;&amp; last.get(ch) &gt;= left) {
      left = last.get(ch) + 1;    // 收缩左边界
    }
    last.set(ch, right);
    best = Math.max(best, right - left + 1);
  }
  return best;
}
// 时间 O(n)</code></pre>
<p>滑动窗口模板：右指针扩张 → 不满足条件时左指针收缩 → 更新答案。</p>` },
    { p: 3, q: '反转链表。', a: `
<pre><code>function reverseList(head) {
  let prev = null, cur = head;
  while (cur) {
    const next = cur.next;
    cur.next = prev;
    prev = cur;
    cur = next;
  }
  return prev;
}
// 时间 O(n)，空间 O(1)</code></pre>
<p>相关题型：合并两个有序链表、判断链表是否有环（快慢指针）、删除倒数第 N 个节点。</p>` },
    { p: 3, q: '二分查找模板。', a: `
<pre><code>// 查找第一个 &gt;= target 的位置
function lowerBound(nums, target) {
  let lo = 0, hi = nums.length;   // 左闭右开区间
  while (lo &lt; hi) {
    const mid = lo + ((hi - lo) &gt;&gt; 1);
    if (nums[mid] &lt; target) lo = mid + 1;
    else hi = mid;
  }
  return lo;
}</code></pre>
<p>关键是统一区间定义，避免死循环和越界。可用于搜索旋转数组、寻找峰值、按答案二分。</p>` },
    { p: 3, q: '岛屿数量（DFS / BFS）。', a: `
<pre><code>function numIslands(grid) {
  const m = grid.length, n = grid[0].length;
  let count = 0;
  const dfs = (i, j) =&gt; {
    if (i &lt; 0 || j &lt; 0 || i &gt;= m || j &gt;= n || grid[i][j] !== '1') return;
    grid[i][j] = '0';               // 标记已访问
    dfs(i + 1, j); dfs(i - 1, j); dfs(i, j + 1); dfs(i, j - 1);
  };
  for (let i = 0; i &lt; m; i++) {
    for (let j = 0; j &lt; n; j++) {
      if (grid[i][j] === '1') { count++; dfs(i, j); }
    }
  }
  return count;
}
// 时间 O(m*n)</code></pre>
<p>网格过大时，DFS 可能栈溢出，可以改用 BFS 队列。</p>` },
    { p: 3, q: '动态规划的解题思路？以最长递增子序列为例。', a: `
<ol>
  <li>定义状态：<code>dp[i]</code> 表示以 <code>nums[i]</code> 结尾的最长递增子序列长度。</li>
  <li>状态转移：<code>dp[i] = max(dp[j] + 1)</code>，其中 <code>j &lt; i</code> 且 <code>nums[j] &lt; nums[i]</code>。</li>
  <li>初始化：所有 <code>dp[i] = 1</code>。</li>
  <li>结果：<code>max(dp)</code>。</li>
</ol>
<pre><code>function lengthOfLIS(nums) {
  const dp = new Array(nums.length).fill(1);
  for (let i = 1; i &lt; nums.length; i++) {
    for (let j = 0; j &lt; i; j++) {
      if (nums[j] &lt; nums[i]) dp[i] = Math.max(dp[i], dp[j] + 1);
    }
  }
  return Math.max(...dp);
}
// O(n²)；使用“贪心 + 二分”可以优化到 O(n log n)</code></pre>
<p>常见 DP 类型：爬楼梯、打家劫舍、背包、最长公共子序列、编辑距离。</p>` },
    { p: 2, q: '手写快速排序。', a: `
<pre><code>function quickSort(arr, lo = 0, hi = arr.length - 1) {
  if (lo &gt;= hi) return arr;
  const pivotIndex = lo + Math.floor(Math.random() * (hi - lo + 1));
  [arr[pivotIndex], arr[hi]] = [arr[hi], arr[pivotIndex]];
  const pivot = arr[hi];
  let i = lo;
  for (let j = lo; j &lt; hi; j++) {
    if (arr[j] &lt; pivot) {
      [arr[i], arr[j]] = [arr[j], arr[i]];
      i++;
    }
  }
  [arr[i], arr[hi]] = [arr[hi], arr[i]];
  quickSort(arr, lo, i - 1);
  quickSort(arr, i + 1, hi);
  return arr;
}</code></pre>
<p>平均 O(n log n)，最坏 O(n²)，不稳定；随机选择基准可以避免有序数组导致的退化。归并排序稳定，时间复杂度稳定为 O(n log n)，但需要 O(n) 额外空间。</p>` },
    { p: 3, q: '实现 LRU 缓存。', a: `
<pre><code>class LRUCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map();         // Map 保持插入顺序
  }
  get(key) {
    if (!this.map.has(key)) return -1;
    const value = this.map.get(key);
    this.map.delete(key);
    this.map.set(key, value);     // 移到最新位置
    return value;
  }
  put(key, value) {
    if (this.map.has(key)) this.map.delete(key);
    this.map.set(key, value);
    if (this.map.size &gt; this.capacity) {
      this.map.delete(this.map.keys().next().value);  // 删除最久未使用
    }
  }
}
// get / put 均为 O(1)</code></pre>
<p>通用实现是<b>哈希表 + 双向链表</b>；Java 可以使用 <code>LinkedHashMap</code>，并设置 accessOrder 为 true。Android 的 <code>LruCache</code> 也基于这一思路。</p>` },
  ]
},

{
